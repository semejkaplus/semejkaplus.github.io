<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- все мета-теги и стили без изменений -->
</head>
<body>
    <!-- экран регистрации и чат без изменений -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ==================== PWA + Push (доработано) ====================
        if ('serviceWorker' in navigator && 'PushManager' in window) {
            window.addEventListener('load', async () => {
                try {
                    const registration = await navigator.serviceWorker.register('/service-worker.js');
                    console.log('SW registered');

                    // Слушаем сообщения от SW (новые сообщения из уведомлений)
                    navigator.serviceWorker.addEventListener('message', event => {
                        if (event.data && event.data.user_name) {
                            const fakeMsg = {
                                id: 'push-' + Date.now(),
                                user_id: 'unknown',
                                user_name: event.data.user_name,
                                text: event.data.body,
                                created_at: new Date().toISOString()
                            };
                            if (currentUser && chatScreen.classList.contains('active')) {
                                renderMessage(fakeMsg, true);
                            }
                        }
                    });

                    registration.addEventListener('updatefound', () => {
                        // обновление SW
                    });

                    const permission = await Notification.requestPermission();
                    if (permission === 'granted') {
                        const subscription = await registration.pushManager.subscribe({
                            userVisibleOnly: true,
                            applicationServerKey: urlBase64ToUint8Array('BPOJS8FN1hoVsNOyaUMKk1HdExG2fFgMDmg3mV_C2QBdOTWT6h5RKWfMLy-wedJlJoT2jXnBnfArU8ixOPvE554')
                        });
                        window._pushSubscription = subscription;
                    }
                } catch (err) {
                    console.error('Push setup error:', err);
                }
            });
        }

        // ... все остальные функции (sendMessage, renderMessage, loadMessages, subscribeMessages и т.д.) без изменений
    </script>
</body>
</html>
