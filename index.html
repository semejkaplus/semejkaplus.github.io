<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SEMEJKA PLUS</title>

    <link rel="icon" type="image/jpeg" href="https://s10.iimage.su/s/09/th_gvMJ97Lx8OAzBYuHL1UHLtuA0yebaDQnB8Uie9Xwd.jpg">
    <meta name="theme-color" content="#6C63FF">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Семейка+">
    <link rel="apple-touch-icon" href="https://s10.iimage.su/s/09/th_gvMJ97Lx8OAzBYuHL1UHLtuA0yebaDQnB8Uie9Xwd.jpg">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
            height: 100dvh; height: 100vh; overflow: hidden;
        }
        .screen { display: none; height: 100%; width: 100%; }
        .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

        #regScreen {
            background: linear-gradient(180deg, #FEE0B7 0%, #FDD299 33%, #EB8680 66%, #E67D76 100%);
            padding: 20px;
        }
        .box {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-radius: 40px; padding: 45px 35px; max-width: 420px; width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1), inset 0 0 0 1px rgba(255,255,255,0.6);
            text-align: center; border: 1px solid rgba(255,255,255,0.5);
        }

        .logo-glass-container {
            width: 100%;
            max-width: 320px;
            margin: 0 auto 20px auto;
            user-select: none;
        }
        .logo-glass-container svg { width: 100%; height: auto; display: block; }

        p { color: #635857; margin-bottom: 25px; font-size: 17px; font-weight: 600; opacity: 0.85; }
        input { width: 100%; padding: 18px 24px; font-size: 18px; border: 1px solid rgba(255,255,255,0.8); border-radius: 25px; margin-bottom: 15px; background: rgba(255,255,255,0.5); outline: none; transition: 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.05); color: #3A3A4A; }
        input:focus { border-color: #6C63FF; background: rgba(255,255,255,0.8); box-shadow: 0 0 0 4px rgba(108,99,255,0.2), 0 5px 15px rgba(0,0,0,0.1); }
        
        .error-msg { color: #D04A42; font-size: 14px; font-weight: 600; margin-bottom: 15px; display: none; text-align: left; padding-left: 15px; }
        
        .welcome-back, .login-existing { display: none; flex-direction: column; gap: 15px; width: 100%; }
        .welcome-text { color: #3A3A4A; font-size: 20px; font-weight: 700; margin-bottom: 5px; }
        
        .link-btn { 
            width: 100%;
            padding: 14px; 
            background: rgba(255, 255, 255, 0.4); 
            border: 2px solid #6C63FF; 
            color: #6C63FF; 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            border-radius: 25px;
            margin-top: 12px; 
            display: inline-block;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(108,99,255,0.1);
        }
        .link-btn:hover { 
            background: #6C63FF;
            color: white;
            box-shadow: 0 8px 15px rgba(108,99,255,0.2);
            transform: translateY(-1px);
        }

        button { width: 100%; padding: 18px; background: linear-gradient(135deg, #6C63FF, #8B82FF); color: white; border: none; border-radius: 25px; font-size: 20px; font-weight: 700; cursor: pointer; transition: 0.2s; box-shadow: 0 10px 25px rgba(108,99,255,0.4); }
        button:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(108,99,255,0.5); }
        button:disabled { background: #B0B0B0; box-shadow: none; transform: none; cursor: not-allowed; }

        #chatScreen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, #FEE0B7 0%, #FDD299 33%, #EB8680 66%, #E67D76 100%); display: none; flex-direction: column; width: 100%; height: 100%; }
        #chatScreen.active { display: flex; }

        .messages {
            flex: 1 1 auto; overflow-y: auto; padding: 10px 20px;
            display: flex; flex-direction: column; gap: 14px;
            margin: 20px auto 0 auto; width: 100%; max-width: 800px; align-items: stretch;
        }

        .date-separator { display: flex; justify-content: center; align-items: center; margin: 10px 0; width: 100%; }
        .date-separator span { background: rgba(255,255,255,0.5); padding: 6px 18px; border-radius: 15px; font-size: 13px; color: #5A5A6A; border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 2px 6px rgba(0,0,0,0.05); white-space: nowrap; }

        /* СООБЩЕНИЯ */
        .msg { max-width: 75%; display: flex; flex-direction: column; position: relative; }
        .msg.sent { align-self: flex-end; align-items: flex-end; }
        .msg.received { align-self: flex-start; align-items: flex-start; }

        .msg-content { display: flex; align-items: flex-end; gap: 6px; width: 100%; }
        .sent .msg-content { flex-direction: row-reverse; }
        .received .msg-content { flex-direction: row; }

        .bubble {
            display: inline-block; padding: 14px 20px; border-radius: 22px; font-size: 17px; line-height: 1.5; word-wrap: break-word;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12); background: rgba(240,236,245,0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            color: #3A3A4A; max-width: 100%; overflow-wrap: break-word; word-break: break-word; border: 1px solid rgba(255,255,255,0.6);
            cursor: pointer; user-select: none; -webkit-user-select: none;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease;
        }
        .sent .bubble { border-bottom-right-radius: 8px; }
        .received .bubble { border-bottom-left-radius: 8px; }

        /* ЭФФЕКТ СВАЙПА ВНИЗ НА БАББЛЕ */
        .bubble.swiped-down { 
            transform: translateY(8px); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.15), 0 3px 6px rgba(0,0,0,0.05);
        }

        .name { font-size: 13px; font-weight: 600; margin-bottom: 4px; padding-left: 6px; color: #6A6A7A; }
        .sent .name { display: none; }
        
        .msg-footer { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 4px; width: 100%; }
        .sent .msg-footer { flex-direction: row-reverse; }
        .received .msg-footer { flex-direction: row; }

        .time { font-size: 11px; color: #4A4A5A; padding: 3px 8px; display: inline-block; border-radius: 12px; background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 2px 6px rgba(0,0,0,0.08); white-space: nowrap; }

        /* РЕАКЦИИ */
        .reactions-wrapper { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
        .reaction-badge {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.8);
            padding: 4px 10px; border-radius: 14px; font-size: 14px; display: flex; align-items: center; gap: 5px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.05); cursor: pointer; transition: 0.15s ease; user-select: none;
        }
        .reaction-badge:hover { transform: scale(1.05); background: rgba(255,255,255,0.8); }
        .reaction-badge.active {
            background: rgba(108, 99, 255, 0.15);
            border-color: rgba(108, 99, 255, 0.4);
            box-shadow: 0 3px 10px rgba(108,99,255,0.15);
        }
        .reaction-count { font-size: 12px; font-weight: 700; color: #4A4A5A; }
        .reaction-badge.active .reaction-count { color: #6C63FF; }

        /* МЕНЮ РЕАКЦИЙ */
        .reaction-picker-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.15); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 9999; display: none; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.2s ease;
        }
        .reaction-picker-overlay.active { display: flex; opacity: 1; }
        
        .reaction-picker-box {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 20px 25px; border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15), inset 0 0 0 1px rgba(255,255,255,0.5);
            display: flex; gap: 14px; transform: scale(0.85); transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .reaction-picker-overlay.active .reaction-picker-box { transform: scale(1); }
        
        .picker-emoji {
            font-size: 30px; cursor: pointer; transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none; -webkit-user-select: none; padding: 4px;
        }
        .picker-emoji:hover { transform: scale(1.3) translateY(-4px); }

        .loading-spinner { display: none; justify-content: center; align-items: center; flex-direction: column; gap: 12px; padding: 40px; color: #6C63FF; font-size: 16px; width: 100%; }
        .loading-spinner.active { display: flex; }
        .spinner-circle { width: 40px; height: 40px; border: 4px solid rgba(108,99,255,0.2); border-top: 4px solid #6C63FF; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .input-area {
            background: rgba(255,255,255,0.8); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); padding: 14px 20px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); margin: 0 auto 10px auto; display: flex; gap: 12px; align-items: flex-end; border-radius: 35px; box-shadow: 0 -5px 25px rgba(0,0,0,0.1), inset 0 0 0 1px rgba(255,255,255,0.8); border: 1px solid rgba(108,99,255,0.3); width: calc(100% - 20px); max-width: 800px;
        }
        .input-area textarea {
            flex: 1; margin: 0; border-radius: 25px; padding: 15px 22px; font-size: 17px; line-height: 1.4; border: 1px solid #D0D0E0; background: rgba(255,255,255,0.95); outline: none; transition: 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.08); resize: none; overflow-y: auto; font-family: inherit; min-height: 52px; max-height: 200px; max-width: 100%; word-wrap: break-word; word-break: break-word;
        }
        .input-area textarea::-webkit-scrollbar { display: none; }
        .input-area textarea:focus { border-color: #6C63FF; background: #FFFFFF; box-shadow: 0 0 0 4px rgba(108,99,255,0.2), 0 2px 8px rgba(0,0,0,0.1); }
        .input-area button { width: 52px; height: 52px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #6C63FF, #8B82FF); box-shadow: 0 10px 20px rgba(108,99,255,0.4); border: none; flex-shrink: 0; }
        .input-area button:hover { transform: scale(1.05); }

        .bubble a { color: #6C63FF; text-decoration: underline; word-break: break-all; }
        .bubble a:hover { color: #4A42D0; }

        @media (max-width: 480px) {
            .messages { padding: 5px 10px; gap: 10px; }
            .bubble { font-size: 15px; padding: 10px 14px; }
            .msg { max-width: 85%; }
        }
    </style>
</head>
<body>
    <div id="regScreen" class="screen active">
        <div class="box">
            <div class="logo-glass-container">
                <svg viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <filter id="liquidGlassEffect" x="-30%" y="-30%" width="160%" height="160%">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur" />
                            <feOffset dx="0" dy="7" result="offsetBlur" />
                            <feSpecularLighting in="blur" surfaceScale="6" specularConstant="1.3" specularExponent="40" lighting-color="#ffffff" result="specOut">
                                <fePointLight x="-120" y="-140" z="180" />
                            </feSpecularLighting>
                            <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut" />
                            <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litOnOff" />
                            <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#c94a42" flood-opacity="0.35"/>
                        </filter>
                        <linearGradient id="glassSemejka" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFAE96" />
                            <stop offset="45%" stop-color="#F2796D" />
                            <stop offset="100%" stop-color="#C93D36" />
                        </linearGradient>
                        <linearGradient id="glassPlus" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFAA85" />
                            <stop offset="50%" stop-color="#ED5D52" />
                            <stop offset="100%" stop-color="#A61C17" />
                        </linearGradient>
                    </defs>
                    <g filter="url(#liquidGlassEffect)">
                        <text x="200" y="65" font-family="'Arial Rounded MT Bold', 'Comic Sans MS', system-ui, sans-serif" font-weight="900" font-size="56" text-anchor="middle" letter-spacing="3" fill="url(#glassSemejka)">SEMEJKA</text>
                        <text x="200" y="138" font-family="'Arial Rounded MT Bold', 'Comic Sans MS', system-ui, sans-serif" font-weight="900" font-size="62" text-anchor="middle" letter-spacing="4" fill="url(#glassPlus)">PLUS</text>
                    </g>
                </svg>
            </div>
            <p id="regSubtitle">Семейный чат для самых близких</p>
            
            <div id="freshForm">
                <input type="text" id="nameInput" placeholder="Ваше имя">
                <input type="text" id="usernameInput" placeholder="Придумайте юзернейм (например, ivan99)">
                <div class="error-msg" id="errorMsg">Юзернейм уже занят!</div>
                <button id="joinBtn">Создать аккаунт</button>
                <button class="link-btn" id="toLoginBtn">Уже есть юзернейм? Войти</button>
            </div>

            <div id="loginForm" class="login-existing">
                <input type="text" id="loginUsernameInput" placeholder="Введите ваш юзернейм">
                <div class="error-msg" id="loginErrorMsg">Пользователь с таким юзернеймом не найден!</div>
                <button id="loginBtn">Войти</button>
                <button class="link-btn" id="toRegisterBtn">Создать новый аккаунт</button>
            </div>

            <div id="fastForm" class="welcome-back">
                <div class="welcome-text" id="welcomeText">Привет!</div>
                <p style="margin-bottom:10px;">Войти как <span id="savedUsernameLabel" style="color:#6C63FF;">@username</span>?</p>
                <button id="fastJoinBtn">Войти в чат</button>
                <button class="link-btn" id="changeUserBtn">Сменить аккаунт</button>
            </div>
        </div>
    </div>

    <div id="chatScreen" class="screen">
        <div class="messages" id="messages">
            <div class="loading-spinner" id="loadingSpinner">
                <div class="spinner-circle"></div>
                <span>Загрузка сообщений...</span>
            </div>
        </div>
        <div class="input-area">
            <textarea id="msgInput" rows="1" placeholder="Сообщение..."></textarea>
            <button id="sendBtn">
                <svg width="20" height="20" viewBox="0 0 24 24"><path d="M2 21L23 12L2 3V10L17 12L2 14V21Z" fill="currentColor"/></svg>
            </button>
        </div>
    </div>

    <div class="reaction-picker-overlay" id="reactionPickerOverlay">
        <div class="reaction-picker-box" id="reactionPickerBox">
            <span class="picker-emoji" data-emoji="❤️">❤️</span>
            <span class="picker-emoji" data-emoji="👍">👍</span>
            <span class="picker-emoji" data-emoji="😂">😂</span>
            <span class="picker-emoji" data-emoji="😮">😮</span>
            <span class="picker-emoji" data-emoji="🔥">🔥</span>
            <span class="picker-emoji" data-emoji="💩">💩</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, getDocs, query, where, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlt7Q4ZjhSM9M3gytNk1UA6XHPROtz7eQ",
            authDomain: "semejka-plus.firebaseapp.com",
            projectId: "semejka-plus",
            storageBucket: "semejka-plus.firebasestorage.app",
            messagingSenderId: "400648498300",
            appId: "1:400648498300:web:b4fe58d33a2d66d5c72df9",
            measurementId: "G-NBG9WYCM1J"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const regScreen = document.getElementById('regScreen');
        const chatScreen = document.getElementById('chatScreen');
        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');

        const freshForm = document.getElementById('freshForm');
        const loginForm = document.getElementById('loginForm');
        const fastForm = document.getElementById('fastForm');

        const nameInput = document.getElementById('nameInput');
        const usernameInput = document.getElementById('usernameInput');
        const errorMsg = document.getElementById('errorMsg');
        const joinBtn = document.getElementById('joinBtn');
        const toLoginBtn = document.getElementById('toLoginBtn');

        const loginUsernameInput = document.getElementById('loginUsernameInput');
        const loginErrorMsg = document.getElementById('loginErrorMsg');
        const loginBtn = document.getElementById('loginBtn');
        const toRegisterBtn = document.getElementById('toRegisterBtn');

        const welcomeText = document.getElementById('welcomeText');
        const savedUsernameLabel = document.getElementById('savedUsernameLabel');
        const fastJoinBtn = document.getElementById('fastJoinBtn');
        const changeUserBtn = document.getElementById('changeUserBtn');

        const reactionPickerOverlay = document.getElementById('reactionPickerOverlay');
        const reactionPickerBox = document.getElementById('reactionPickerBox');
        const pickerEmojis = document.querySelectorAll('.picker-emoji');

        let currentUser = null;
        let lastDisplayedDate = null;
        let activeReactionMessageId = null;

        // Предзагрузка сессии, чтобы гарантировать правильное определение сторон до рендера сообщений
        const savedName = localStorage.getItem('semejka_name');
        const savedUsername = localStorage.getItem('semejka_username');
        if (savedName && savedUsername) {
            currentUser = { id: savedUsername, name: savedName };
        }

        function handleDataMigration() {
            if (localStorage.getItem('semejka_uid') && !localStorage.getItem('semejka_username')) {
                localStorage.removeItem('semejka_uid');
                localStorage.removeItem('semejka_username');
                localStorage.removeItem('semejka_name');
            }
        }
        handleDataMigration();

        function checkSavedUser() {
            if (currentUser) {
                freshForm.style.display = 'none';
                loginForm.style.display = 'none';
                fastForm.style.display = 'flex';
                welcomeText.textContent = `Привет, ${currentUser.name}!`;
                savedUsernameLabel.textContent = `@${currentUser.id}`;
            } else {
                freshForm.style.display = 'block';
                loginForm.style.display = 'none';
                fastForm.style.display = 'none';
            }
        }
        checkSavedUser();

        toLoginBtn.addEventListener('click', () => {
            freshForm.style.display = 'none';
            loginForm.style.display = 'flex';
            loginErrorMsg.style.display = 'none';
            loginUsernameInput.value = '';
        });

        toRegisterBtn.addEventListener('click', () => {
            loginForm.style.display = 'none';
            freshForm.style.display = 'block';
            errorMsg.style.display = 'none';
            nameInput.value = '';
            usernameInput.value = '';
        });

        changeUserBtn.addEventListener('click', () => {
            localStorage.removeItem('semejka_name');
            localStorage.removeItem('semejka_username');
            currentUser = null;
            checkSavedUser();
        });

        joinBtn.addEventListener('click', async () => {
            const name = nameInput.value.trim();
            let username = usernameInput.value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');

            if (!name || !username) {
                alert('Пожалуйста, заполните оба поля.');
                return;
            }

            joinBtn.disabled = true;
            errorMsg.style.display = 'none';

            try {
                const uQuery = query(collection(db, "users"), where("username", "==", username));
                const querySnapshot = await getDocs(uQuery);

                if (!querySnapshot.empty) {
                    errorMsg.style.display = 'block';
                    joinBtn.disabled = false;
                    return;
                }

                await addDoc(collection(db, "users"), {
                    name: name,
                    username: username,
                    created_at: serverTimestamp()
                });

                localStorage.setItem('semejka_name', name);
                localStorage.setItem('semejka_username', username);

                currentUser = { id: username, name: name };
                enterChat();

            } catch (err) {
                console.error("Ошибка при регистрации:", err);
                joinBtn.disabled = false;
            }
        });

        loginBtn.addEventListener('click', async () => {
            let username = loginUsernameInput.value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');

            if (!username) {
                alert('Пожалуйста, введите юзернейм.');
                return;
            }

            loginBtn.disabled = true;
            loginErrorMsg.style.display = 'none';

            try {
                const uQuery = query(collection(db, "users"), where("username", "==", username));
                const querySnapshot = await getDocs(uQuery);

                if (querySnapshot.empty) {
                    loginErrorMsg.style.display = 'block';
                    loginBtn.disabled = false;
                    return;
                }

                let foundName = '';
                querySnapshot.forEach((doc) => {
                    foundName = doc.data().name;
                });

                localStorage.setItem('semejka_name', foundName);
                localStorage.setItem('semejka_username', username);

                currentUser = { id: username, name: foundName };
                enterChat();

            } catch (err) {
                console.error("Ошибка при входе:", err);
                loginBtn.disabled = false;
            }
        });

        fastJoinBtn.addEventListener('click', () => {
            enterChat();
        });

        function autoResize() {
            msgInput.style.height = 'auto';
            const scrollHeight = msgInput.scrollHeight;
            msgInput.style.height = (scrollHeight > 200 ? 200 : scrollHeight) + 'px';
            msgInput.style.overflowY = scrollHeight > 200 ? 'auto' : 'hidden';
        }
        msgInput.addEventListener('input', autoResize);

        function resetTextarea() {
            msgInput.value = '';
            msgInput.style.height = 'auto';
            msgInput.style.overflowY = 'hidden';
        }

        function linkify(text) {
            const urlRegex = /(https?:\/\/[^\s<]+)/gi;
            return text.replace(urlRegex, (url) => `<a href="${url.replace(/"/g, '&quot;')}" target="_blank" rel="noopener noreferrer">${url}</a>`);
        }

        // ОТКРЫТИЕ ОКНА РЕАКЦИЙ
        function openReactionPicker(msgId, bubbleElement) {
            activeReactionMessageId = msgId;
            reactionPickerOverlay.classList.add('active');
            bubbleElement.classList.add('swiped-down');
        }

        // ЗАКРЫТИЕ ОКНА РЕАКЦИЙ
        function closeReactionPicker() {
            reactionPickerOverlay.classList.remove('active');
            document.querySelectorAll('.bubble').forEach(el => el.classList.remove('swiped-down'));
            activeReactionMessageId = null;
        }

        reactionPickerOverlay.addEventListener('click', (e) => {
            if (e.target === reactionPickerOverlay || e.target === reactionPickerBox) closeReactionPicker();
        });

        async function toggleReaction(msgId, emoji) {
            if (!currentUser) return;
            const msgRef = doc(db, "messages", msgId);
            
            const msgDiv = document.getElementById('msg-' + msgId);
            if (!msgDiv) return;
            
            let currentReactions = JSON.parse(msgDiv.getAttribute('data-reactions') || '{}');
            
            if (!currentReactions[emoji]) {
                currentReactions[emoji] = [];
            }
            
            const userIndex = currentReactions[emoji].indexOf(currentUser.id);
            if (userIndex > -1) {
                currentReactions[emoji].splice(userIndex, 1);
                if (currentReactions[emoji].length === 0) delete currentReactions[emoji];
            } else {
                for (let e in currentReactions) {
                    const idx = currentReactions[e].indexOf(currentUser.id);
                    if (idx > -1) {
                        currentReactions[e].splice(idx, 1);
                        if (currentReactions[e].length === 0) delete currentReactions[e];
                    }
                }
                currentReactions[emoji].push(currentUser.id);
            }
            
            try {
                await updateDoc(msgRef, { reactions: currentReactions });
            } catch (err) {
                console.error("Ошибка обновления реакции: ", err);
            }
        }

        pickerEmojis.forEach(emojiEl => {
            emojiEl.addEventListener('click', async () => {
                const emoji = emojiEl.getAttribute('data-emoji');
                if (activeReactionMessageId && emoji) {
                    await toggleReaction(activeReactionMessageId, emoji);
                    closeReactionPicker();
                }
            });
        });

        function updateReactionsUI(msgId, reactions) {
            const msgDiv = document.getElementById('msg-' + msgId);
            if (!msgDiv) return;

            msgDiv.setAttribute('data-reactions', JSON.stringify(reactions || {}));
            
            let wrapper = msgDiv.querySelector('.reactions-wrapper');
            if (!wrapper) {
                wrapper = document.createElement('div');
                wrapper.className = 'reactions-wrapper';
                msgDiv.querySelector('.msg-footer').appendChild(wrapper);
            }
            
            wrapper.innerHTML = '';
            
            for (let emoji in reactions) {
                const userList = reactions[emoji] || [];
                if (userList.length === 0) continue;
                
                const isMyReaction = userList.includes(currentUser?.id);
                
                const badge = document.createElement('div');
                badge.className = `reaction-badge ${isMyReaction ? 'active' : ''}`;
                badge.innerHTML = `<span>${emoji}</span><span class="reaction-count">${userList.length}</span>`;
                
                badge.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    await toggleReaction(msgId, emoji);
                });
                
                wrapper.appendChild(badge);
            }
        }

        // РЕНДЕР СООБЩЕНИЯ
        function renderMessage(msg) {
            let msgDiv = document.getElementById('msg-' + msg.id);
            const isMyMsg = (msg.user_id === currentUser?.id);
            
            if (msgDiv) {
                // ИСПРАВЛЕНИЕ БАГА СТОРОН: Принудительно проверяем и обновляем классы стороны при изменениях
                const correctSideClass = isMyMsg ? 'sent' : 'received';
                if (!msgDiv.classList.contains(correctSideClass)) {
                    msgDiv.className = 'msg ' + correctSideClass;
                }
                updateReactionsUI(msg.id, msg.reactions);
                return;
            }
            
            const timestamp = msg.created_at ? msg.created_at.toDate() : new Date();
            const msgDate = timestamp.toLocaleDateString('ru-RU');
            
            if (msgDate !== lastDisplayedDate) { 
                insertDateSeparator(timestamp.toISOString()); 
                lastDisplayedDate = msgDate; 
            }

            const div = document.createElement('div');
            div.id = 'msg-' + msg.id; 
            div.className = 'msg ' + (isMyMsg ? 'sent' : 'received');

            let html = '';
            if (!isMyMsg) {
                html += `<div class="name">${escapeHtml(msg.user_name || '')} (@${escapeHtml(msg.user_id || '')})</div>`;
            }
            html += `<div class="msg-content"><div class="bubble">${linkify(escapeHtml(msg.text || ''))}</div></div>`;
            html += `<div class="msg-footer"><div class="time">${formatTime(timestamp)}</div></div>`;

            div.innerHTML = html; 
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            const bubbleElement = div.querySelector('.bubble');

            // ПК Клик
            bubbleElement.addEventListener('click', (e) => {
                // Если кликнули по ссылке, игнорируем вызов меню реакций
                if (e.target.tagName === 'A') return;
                openReactionPicker(msg.id, bubbleElement);
            });

            // ИСПРАВЛЕНИЕ СВАЙПОВ: Добавляем трекинг вертикального скролла контейнера чата
            let startY = 0;
            let startX = 0;
            let isScrolling = false;
            
            bubbleElement.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
                startX = e.touches[0].clientX;
                isScrolling = false;
            }, { passive: true });

            // Отслеживаем движение: если юзер скроллит весь чат, жест свайпа блокируется
            bubbleElement.addEventListener('touchmove', (e) => {
                const moveY = e.touches[0].clientY;
                const moveX = e.touches[0].clientX;
                if (Math.abs(moveY - startY) < Math.abs(moveX - startX)) {
                    isScrolling = true; // Скроллинг вбок или обычное движение
                }
            }, { passive: true });

            bubbleElement.addEventListener('touchend', (e) => {
                if (isScrolling) return;

                const endY = e.changedTouches[0].clientY;
                const endX = e.changedTouches[0].clientX;
                
                const diffY = endY - startY; 
                const diffX = Math.abs(startX - endX);

                if (diffY > 35 && diffY > diffX) {
                    openReactionPicker(msg.id, bubbleElement);
                }
            }, { passive: true });

            updateReactionsUI(msg.id, msg.reactions);
        }

        function startLiveChat() {
            loadingSpinner.classList.add('active');
            const q = query(collection(db, "messages"), orderBy("created_at", "asc"));
            
            onSnapshot(q, (snapshot) => {
                loadingSpinner.classList.remove('active');
                snapshot.docChanges().forEach((change) => {
                    const data = change.doc.data();
                    if (change.type === "added" || change.type === "modified") {
                        renderMessage({ id: change.doc.id, ...data });
                    }
                });
            }, (error) => {
                console.error("Ошибка получения данных: ", error);
            });
        }

        async function sendMessage() {
            const text = msgInput.value.trim();
            if (!currentUser || !text) return;

            sendBtn.disabled = true;
            resetTextarea();

            try {
                await addDoc(collection(db, "messages"), {
                    user_id: currentUser.id,
                    user_name: currentUser.name,
                    text: text,
                    reactions: {},
                    created_at: serverTimestamp()
                });
            } catch (err) {
                console.error('Ошибка сохранения сообщения:', err);
            } finally {
                sendBtn.disabled = false; 
                msgInput.focus();
            }
        }

        msgInput.addEventListener('keypress', async (e) => { 
            if (e.key === 'Enter' && !e.shiftKey) { 
                e.preventDefault(); 
                await sendMessage(); 
            } 
        });
        sendBtn.addEventListener('click', sendMessage);

        function enterChat() {
            regScreen.classList.remove('active');
            chatScreen.classList.add('active');
            startLiveChat();
        }

        function formatDateSeparator(dateStr) {
            const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
            const d = new Date(dateStr); 
            return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()} г.`; 
        }
        function insertDateSeparator(dateString) {
            const sep = document.createElement('div'); 
            sep.className = 'date-separator';
            sep.innerHTML = `<span>${formatDateSeparator(dateString)}</span>`; 
            messagesDiv.appendChild(sep); 
        }
        function formatTime(dateObj) { 
            return dateObj.getHours().toString().padStart(2,'0') + ':' + dateObj.getMinutes().toString().padStart(2,'0'); 
        } 
        function escapeHtml(text) { 
            const el = document.createElement('div'); 
            el.textContent = text; 
            return el.innerHTML; 
        } 
    </script>
</body>
</html>
