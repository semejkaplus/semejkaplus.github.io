<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SEMEJKA PLUS</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6C63FF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Семейка+">
    <link rel="apple-touch-icon" href="https://s10.iimage.su/s/01/th_gbQUgmlxJOC82rwE42zTtHdJvyk5H1YnnJ3AfyWuK.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
            height: 100dvh; height: 100vh; overflow: hidden;
        }
        .screen { display: none; height: 100%; }
        .active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

        #regScreen {
            background: linear-gradient(180deg, #FEE0B7 0%, #FDD299 33%, #EB8680 66%, #E67D76 100%);
            padding: 20px;
        }
        .box {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-radius: 40px; padding: 45px 35px; max-width: 420px; width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15), inset 0 0 0 1px rgba(255,255,255,0.5);
            text-align: center; border: 1px solid rgba(255,255,255,0.8);
        }
        .title-logo { display: block; max-width: 400px; width: 95%; margin: 0 auto 30px; }
        p { color: #555; margin-bottom: 35px; font-size: 18px; }
        input { width: 100%; padding: 18px 24px; font-size: 18px; border: 1px solid rgba(255,255,255,0.8); border-radius: 25px; margin-bottom: 20px; background: rgba(255,255,255,0.5); outline: none; transition: 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        input:focus { border-color: #6C63FF; background: rgba(255,255,255,0.8); box-shadow: 0 0 0 4px rgba(108,99,255,0.2), 0 5px 15px rgba(0,0,0,0.1); }
        button { width: 100%; padding: 18px; background: linear-gradient(135deg, #6C63FF, #8B82FF); color: white; border: none; border-radius: 25px; font-size: 20px; font-weight: 700; cursor: pointer; transition: 0.2s; box-shadow: 0 10px 25px rgba(108,99,255,0.4); }
        button:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(108,99,255,0.5); }
        button:disabled { background: #B0B0B0; box-shadow: none; transform: none; }

        #chatScreen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, #FEE0B7 0%, #FDD299 33%, #EB8680 66%, #E67D76 100%); display: none; flex-direction: column; }
        #chatScreen.active { display: flex; }

        .chat-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 20px; background: rgba(255,255,255,0.5);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }
        .chat-header .title { font-weight: 700; font-size: 18px; color: #3A3A4A; }
        .refresh-btn {
            background: none; border: none; font-size: 24px; cursor: pointer;
            padding: 5px 10px; border-radius: 50%; transition: background 0.2s;
        }
        .refresh-btn:hover { background: rgba(108,99,255,0.2); }
        .refresh-btn:active { transform: scale(0.9); }

        .messages { flex: 1 1 auto; overflow-y: auto; padding: 10px 20px 0 20px; display: flex; flex-direction: column; gap: 14px; }

        .date-separator { display: flex; justify-content: center; align-items: center; margin: 10px 0; }
        .date-separator span { background: rgba(255,255,255,0.5); padding: 6px 18px; border-radius: 15px; font-size: 13px; color: #5A5A6A; border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 2px 6px rgba(0,0,0,0.05); white-space: nowrap; }

        .msg { max-width: 75%; display: flex; flex-direction: column; position: relative; }
        .msg.sent { align-self: flex-end; align-items: flex-end; }
        .msg.received { align-self: flex-start; align-items: flex-start; }

        .msg.animate-in { animation: fadeInUp 0.3s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .msg-content { display: flex; align-items: flex-end; gap: 6px; }
        .sent .msg-content { flex-direction: row-reverse; }
        .received .msg-content { flex-direction: row; }

        .bubble {
            display: inline-block; padding: 14px 20px; border-radius: 22px; font-size: 17px; line-height: 1.5; word-wrap: break-word;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
            background: rgba(240,236,245,0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            color: #3A3A4A; cursor: pointer; user-select: none; max-width: 100%; overflow-wrap: break-word; word-break: break-word;
            border: 1px solid rgba(255,255,255,0.6);
        }
        .sent .bubble { border-bottom-right-radius: 8px; }
        .received .bubble { border-bottom-left-radius: 8px; }

        .name { font-size: 13px; font-weight: 600; margin-bottom: 4px; padding-left: 6px; color: #6A6A7A; }
        .sent .name { display: none; }

        .msg-footer { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
        .sent .msg-footer { flex-direction: row-reverse; }
        .received .msg-footer { flex-direction: row; }

        .time { font-size: 11px; color: #4A4A5A; padding: 3px 8px; display: inline-block; border-radius: 12px; background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 2px 6px rgba(0,0,0,0.08); white-space: nowrap; }

        .loading-spinner { display: none; justify-content: center; align-items: center; flex-direction: column; gap: 12px; padding: 40px; color: #6C63FF; font-size: 16px; }
        .loading-spinner.active { display: flex; }
        .spinner-circle { width: 40px; height: 40px; border: 4px solid rgba(108, 99, 255, 0.2); border-top: 4px solid #6C63FF; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .reactions-container { display: flex; flex-wrap: wrap; gap: 4px; }
        .sent .reactions-container { justify-content: flex-end; }
        .reaction-badge { background: rgba(255, 255, 255, 0.85); border-radius: 12px; padding: 2px 6px; font-size: 11px; display: flex; align-items: center; gap: 3px; cursor: pointer; transition: 0.2s; border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 2px 6px rgba(0,0,0,0.08); white-space: nowrap; }
        .reaction-badge:hover { background: rgba(255, 255, 255, 0.95); transform: scale(1.05); }
        .reaction-badge.active { background: rgba(108, 99, 255, 0.25); border-color: #6C63FF; }

        .emoji-panel {
            display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
            background: white; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.15); padding: 8px;
            gap: 8px; z-index: 9999; margin-bottom: 8px; max-width: calc(100vw - 40px);
            flex-direction: column; align-items: stretch; width: max-content;
        }
        .sent .emoji-panel { left: auto; right: 0; transform: none; }
        .received .emoji-panel { left: 0; right: auto; transform: none; }
        .emoji-panel.open { display: flex; }
        .search-block { display: flex; justify-content: flex-end; margin-bottom: 2px; }
        .search-toggle { font-size: 18px; cursor: pointer; background: none; border: none; padding: 2px; opacity: 0.7; transition: opacity 0.2s; line-height: 1; }
        .search-toggle:hover { opacity: 1; }
        .search-row { display: none; margin-top: 4px; }
        .search-row.active { display: flex; flex-direction: column; gap: 6px; }
        .emoji-search { width: 100%; padding: 6px 10px; font-size: 14px; border: 1px solid #ddd; border-radius: 10px; outline: none; background: #f9f9f9; }
        .emoji-search:focus { border-color: #6C63FF; box-shadow: 0 0 0 2px rgba(108,99,255,0.2); }
        .quick-emojis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; justify-items: center; }
        .quick-emojis.hidden { display: none; }
        .emoji-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; justify-items: center; }
        .emoji-option { font-size: 22px; cursor: pointer; transition: transform 0.1s; padding: 4px; }
        .emoji-option:hover { transform: scale(1.3); }

        .input-area {
            background: rgba(255,255,255,0.8); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            padding: 14px 20px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            margin: 0 10px 10px 10px; display: flex; gap: 12px; align-items: flex-end;
            border-radius: 35px; box-shadow: 0 -5px 25px rgba(0,0,0,0.1), inset 0 0 0 1px rgba(255,255,255,0.8);
            border: 1px solid rgba(108,99,255,0.3);
        }
        .input-area textarea {
            flex: 1; margin: 0; border-radius: 25px; padding: 15px 22px; font-size: 17px;
            line-height: 1.4; border: 1px solid #D0D0E0; background: rgba(255,255,255,0.95);
            outline: none; transition: 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            resize: none; overflow-y: auto; font-family: inherit; min-height: 52px; max-height: 200px;
            scrollbar-width: none; -ms-overflow-style: none; max-width: 100%;
            word-wrap: break-word; word-break: break-word;
        }
        .input-area textarea::-webkit-scrollbar { display: none; }
        .input-area textarea:focus {
            border-color: #6C63FF; background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(108,99,255,0.2), 0 2px 8px rgba(0,0,0,0.1);
        }
        .input-area button {
            width: 52px; height: 52px; border-radius: 50%; padding: 0;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #6C63FF, #8B82FF);
            box-shadow: 0 10px 20px rgba(108,99,255,0.4); border: none; flex-shrink: 0;
        }
        .input-area button:hover { transform: scale(1.05); }

        .bubble a { color: #6C63FF; text-decoration: underline; word-break: break-all; }
        .bubble a:hover { color: #4A42D0; }

        @media (max-width: 480px) {
            .emoji-panel { max-width: calc(100vw - 30px); left: 50% !important; right: auto !important; transform: translateX(-50%) !important; }
        }
    </style>
</head>
<body>
    <div id="regScreen" class="screen active">
        <div class="box">
            <img src="https://s10.iimage.su/s/01/th_gbQUgmlxJOC82rwE42zTtHdJvyk5H1YnnJ3AfyWuK.png" alt="SEMEJKA PLUS" class="title-logo">
            <p>Семейный чат для самых близких</p>
            <input type="text" id="nameInput" placeholder="Ваше имя">
            <button id="joinBtn">Войти</button>
        </div>
    </div>

    <div id="chatScreen" class="screen">
        <div class="chat-header">
            <span class="title">Семейка+</span>
            <button class="refresh-btn" id="refreshBtn" title="Обновить чат">🔄</button>
        </div>
        <div class="messages" id="messages">
            <div class="loading-spinner" id="loadingSpinner">
                <div class="spinner-circle"></div>
                <span>Загрузка сообщений...</span>
            </div>
        </div>
        <div class="input-area">
            <textarea id="msgInput" rows="1" placeholder="Сообщение..."></textarea>
            <button id="sendBtn">
                <svg width="20" height="20" viewBox="0 0 24 24"><path d="M2 21L23 12L2 3V10L17 12L2 14V21Z" fill="currentColor"/></svg>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ==================== PWA + Push ====================
        if ('serviceWorker' in navigator && 'PushManager' in window) {
            window.addEventListener('load', async () => {
                try {
                    const registration = await navigator.serviceWorker.register('/service-worker.js');
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                if (confirm('Доступна новая версия приложения. Обновить сейчас?')) {
                                    window.location.reload();
                                }
                            }
                        });
                    });
                    const permission = await Notification.requestPermission();
                    if (permission === 'granted') {
                        const subscription = await registration.pushManager.subscribe({
                            userVisibleOnly: true,
                            applicationServerKey: urlBase64ToUint8Array('BPOJS8FN1hoVsNOyaUMKk1HdExG2fFgMDmg3mV_C2QBdOTWT6h5RKWfMLy-wedJlJoT2jXnBnfArU8ixOPvE554')
                        });
                        window._pushSubscription = subscription;
                    }
                } catch (err) { console.error('Push setup error:', err); }
            });
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
            return outputArray;
        }

        async function saveSubscription(subscription) {
            if (!currentUser) return;
            const { error } = await _sgClient
                .from('push_subscriptions')
                .upsert({ 
                    user_id: currentUser.id, 
                    subscription: JSON.stringify(subscription) 
                }, { onConflict: 'user_id' });
            if (error) console.error('Push subscription save error:', error);
        }

        // ==================== Supabase ====================
        const _sgClient = window.supabase.createClient(
            'https://sfsxflsbueyotiksqknp.supabase.co',
            'sb_publishable_32wqroL1fDtPIVwHbvZtIg_5Hipzmdj'
        );

        // DOM-элементы
        const regScreen = document.getElementById('regScreen');
        const chatScreen = document.getElementById('chatScreen');
        const nameInput = document.getElementById('nameInput');
        const joinBtn = document.getElementById('joinBtn');
        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');

        let currentUser = null, lastMessageId = null;
        let lastDisplayedDate = null;
        let reactionsCache = {};
        let longPressTimer = null;
        let pollingInterval = null;

        function autoResize() {
            msgInput.style.height = 'auto';
            const scrollHeight = msgInput.scrollHeight;
            const maxHeight = 200;
            if (scrollHeight > maxHeight) {
                msgInput.style.height = maxHeight + 'px';
                msgInput.style.overflowY = 'auto';
            } else {
                msgInput.style.height = scrollHeight + 'px';
                msgInput.style.overflowY = 'hidden';
            }
        }
        msgInput.addEventListener('input', autoResize);

        function resetTextarea() {
            msgInput.value = '';
            msgInput.style.height = 'auto';
            msgInput.style.overflowY = 'hidden';
        }

        const EMOJI_LIST = [
            { emoji: '👍', name: 'Нравится' }, { emoji: '❤️', name: 'Люблю' }, { emoji: '😊', name: 'Радость' },
            { emoji: '😢', name: 'Грусть' }, { emoji: '🎉', name: 'Поздравляю' }, { emoji: '🔥', name: 'Огонь' },
            { emoji: '😡', name: 'Злюсь' }, { emoji: '😂', name: 'Смех' }, { emoji: '😮', name: 'Удивлён' },
            { emoji: '😴', name: 'Сонный' }, { emoji: '😎', name: 'Круто' }, { emoji: '🤔', name: 'Задумчивость' },
            { emoji: '😍', name: 'Восхищён' }, { emoji: '👏', name: 'Аплодисменты' }, { emoji: '💪', name: 'Сила' },
            { emoji: '🙏', name: 'Спасибо' }
        ];

        async function loadReactions(messageIds) {
            if (!messageIds.length) return;
            try {
                const { data } = await _sgClient.from('reactions').select('*').in('message_id', messageIds);
                if (data) {
                    data.forEach(r => {
                        if (!reactionsCache[r.message_id]) reactionsCache[r.message_id] = [];
                        if (!reactionsCache[r.message_id].some(ex => ex.id === r.id)) reactionsCache[r.message_id].push(r);
                    });
                    messageIds.forEach(id => updateReactionDisplay(id));
                }
            } catch (err) { console.error('Ошибка загрузки реакций:', err); }
        }

        function updateReactionDisplay(messageId) {
            const msgEl = document.getElementById('msg-' + messageId);
            if (!msgEl) return;
            let container = msgEl.querySelector('.reactions-container');
            if (!container) {
                const footer = msgEl.querySelector('.msg-footer');
                if (!footer) return;
                container = document.createElement('div'); container.className = 'reactions-container';
                footer.appendChild(container);
            }
            const reactions = reactionsCache[messageId] || [];
            const counts = {};
            reactions.forEach(r => counts[r.emoji] = (counts[r.emoji] || 0) + 1);
            const userReaction = reactions.find(r => r.user_id === currentUser?.id);
            container.innerHTML = '';
            Object.entries(counts).forEach(([emoji, count]) => {
                const badge = document.createElement('span');
                badge.className = 'reaction-badge' + (userReaction && userReaction.emoji === emoji ? ' active' : '');
                badge.textContent = emoji + ' ' + count;
                badge.onclick = (e) => { e.stopPropagation(); toggleReaction(messageId, emoji); };
                container.appendChild(badge);
            });
        }

        async function toggleReaction(messageId, emoji) {
            if (!currentUser) return;
            const reactions = reactionsCache[messageId] || [];
            const existing = reactions.find(r => r.user_id === currentUser.id);
            if (existing && existing.emoji === emoji) {
                reactionsCache[messageId] = reactions.filter(r => r.id !== existing.id);
            } else {
                if (existing) reactionsCache[messageId] = reactions.filter(r => r.id !== existing.id);
                reactionsCache[messageId] = [...(reactionsCache[messageId] || []), { id: 'temp-' + Date.now(), message_id: messageId, user_id: currentUser.id, emoji: emoji }];
            }
            updateReactionDisplay(messageId);
            try {
                if (existing) await _sgClient.from('reactions').delete().eq('id', existing.id);
                if (!existing || existing.emoji !== emoji) {
                    const { data, error } = await _sgClient.from('reactions').insert({ message_id: messageId, user_id: currentUser.id, emoji: emoji }).select().single();
                    if (error) throw error;
                    if (data) {
                        reactionsCache[messageId] = reactions.filter(r => r.id !== (existing?.id) && !r.id.startsWith('temp-'));
                        if (!reactionsCache[messageId]) reactionsCache[messageId] = [];
                        if (!reactionsCache[messageId].some(r => r.id === data.id)) reactionsCache[messageId].push(data);
                    }
                }
                reactionsCache[messageId] = (reactionsCache[messageId] || []).filter(r => !r.id.startsWith('temp-'));
            } catch (err) { console.error('Ошибка реакции:', err); }
            finally { updateReactionDisplay(messageId); }
        }

        function showEmojiPanel(messageId) {
            const msgEl = document.getElementById('msg-' + messageId);
            if (!msgEl) return;
            document.querySelectorAll('.emoji-panel.open').forEach(p => p.classList.remove('open'));
            let panel = msgEl.querySelector('.emoji-panel');
            if (!panel) {
                panel = document.createElement('div'); panel.className = 'emoji-panel';
                const searchBlock = document.createElement('div'); searchBlock.className = 'search-block';
                const searchToggle = document.createElement('button'); searchToggle.className = 'search-toggle'; searchToggle.innerHTML = '🔍'; searchToggle.title = 'Поиск эмодзи';
                searchBlock.appendChild(searchToggle); panel.appendChild(searchBlock);
                const quickContainer = document.createElement('div'); quickContainer.className = 'quick-emojis';
                EMOJI_LIST.slice(0, 8).forEach(item => {
                    const span = document.createElement('span'); span.className = 'emoji-option'; span.textContent = item.emoji; span.title = item.name;
                    span.onclick = (e) => { e.stopPropagation(); toggleReaction(messageId, item.emoji); panel.classList.remove('open'); };
                    quickContainer.appendChild(span);
                });
                panel.appendChild(quickContainer);
                const searchRow = document.createElement('div'); searchRow.className = 'search-row';
                const searchInput = document.createElement('input'); searchInput.type = 'text'; searchInput.className = 'emoji-search'; searchInput.placeholder = 'Поиск эмодзи...';
                searchInput.addEventListener('mousedown', e => e.stopPropagation());
                searchInput.addEventListener('touchstart', e => e.stopPropagation());
                searchInput.addEventListener('click', e => e.stopPropagation());
                const optionsContainer = document.createElement('div'); optionsContainer.className = 'emoji-options';
                const renderFilteredEmojis = (filterText = '') => {
                    optionsContainer.innerHTML = '';
                    const filtered = EMOJI_LIST.filter(item => item.name.toLowerCase().includes(filterText.toLowerCase()) || item.emoji.includes(filterText));
                    filtered.forEach(item => {
                        const span = document.createElement('span'); span.className = 'emoji-option'; span.textContent = item.emoji; span.title = item.name;
                        span.onclick = (e) => { e.stopPropagation(); toggleReaction(messageId, item.emoji); panel.classList.remove('open'); };
                        optionsContainer.appendChild(span);
                    });
                };
                searchInput.addEventListener('input', () => renderFilteredEmojis(searchInput.value));
                renderFilteredEmojis();
                searchRow.appendChild(searchInput); searchRow.appendChild(optionsContainer); panel.appendChild(searchRow);
                searchToggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isActive = searchRow.classList.contains('active');
                    if (isActive) { searchRow.classList.remove('active'); quickContainer.classList.remove('hidden'); }
                    else { quickContainer.classList.add('hidden'); searchRow.classList.add('active'); searchInput.focus(); }
                });
                panel.addEventListener('mousedown', e => e.stopPropagation());
                panel.addEventListener('touchstart', e => e.stopPropagation());
                msgEl.appendChild(panel);
            } else {
                const quickContainer = panel.querySelector('.quick-emojis');
                const searchRow = panel.querySelector('.search-row');
                const searchInput = panel.querySelector('.emoji-search');
                if (quickContainer) quickContainer.classList.remove('hidden');
                if (searchRow) searchRow.classList.remove('active');
                if (searchInput) searchInput.value = '';
            }
            panel.classList.add('open');
        }
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.emoji-panel') && !e.target.closest('.bubble')) {
                document.querySelectorAll('.emoji-panel.open').forEach(p => p.classList.remove('open'));
            }
        });

        function addLongPressListeners(msgElement, messageId) {
            const bubble = msgElement.querySelector('.bubble');
            if (!bubble) return;
            const startPress = (e) => {
                if (e.target.closest('a')) return;
                e.preventDefault();
                longPressTimer = setTimeout(() => showEmojiPanel(messageId), 300);
            };
            const cancelPress = () => { clearTimeout(longPressTimer); };
            bubble.addEventListener('mousedown', startPress);
            bubble.addEventListener('mouseup', cancelPress);
            bubble.addEventListener('mouseleave', cancelPress);
            bubble.addEventListener('touchstart', startPress, { passive: false });
            bubble.addEventListener('touchend', cancelPress);
            bubble.addEventListener('touchcancel', cancelPress);
        }

        function linkify(text) {
            const urlRegex = /(https?:\/\/[^\s<]+)/gi;
            return text.replace(urlRegex, (url) => {
                const safeUrl = url.replace(/"/g, '&quot;');
                return `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${url}</a>`;
            });
        }

        // ==================== Сообщения ====================
        function renderMessage(msg, animate = false) {
            if (document.getElementById('msg-' + msg.id)) return;
            const msgDate = new Date(msg.created_at || Date.now()).toLocaleDateString('sv-SE');
            if (msgDate !== lastDisplayedDate) { insertDateSeparator(msg.created_at || new Date().toISOString()); lastDisplayedDate = msgDate; }

            const div = document.createElement('div');
            div.id = 'msg-' + msg.id;
            div.className = 'msg ' + (msg.user_id === currentUser?.id ? 'sent' : 'received');
            if (msg.created_at) div.dataset.msgDate = msgDate;

            let html = '';
            if (msg.user_id !== currentUser?.id) html += `<div class="name">${escapeHtml(msg.user_name)}</div>`;
            html += `<div class="msg-content"><div class="bubble">${linkify(escapeHtml(msg.text))}</div></div>`;
            html += `<div class="msg-footer"><div class="time">${formatTime(msg.created_at || new Date().toISOString())}</div></div>`;

            div.innerHTML = html;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            if (msg.id && !msg.id.toString().startsWith('optimistic')) lastMessageId = msg.id;

            if (animate) {
                div.classList.add('animate-in');
                div.addEventListener('animationend', () => div.classList.remove('animate-in'), { once: true });
            }

            addLongPressListeners(div, msg.id);
        }

        async function loadMessages() {
            loadingSpinner.classList.add('active');
            try {
                const { data, error } = await _sgClient.from('messages')
                    .select('id, user_id, user_name, text, created_at')
                    .order('created_at', { ascending: true }).limit(50);
                if (error) { console.error(error); return; }
                const children = Array.from(messagesDiv.children);
                children.forEach(child => { if (child !== loadingSpinner) child.remove(); });
                lastDisplayedDate = null;
                data.forEach(msg => renderMessage(msg, false));
                if (data.length > 0) lastMessageId = data[data.length - 1].id;
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                loadReactions(data.map(m => m.id));
            } finally {
                loadingSpinner.classList.remove('active');
            }
        }

        function subscribeMessages() {
            _sgClient.removeAllChannels();
            _sgClient.channel('realtime:messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    if (currentUser) {
                        renderMessage(payload.new, true);
                    }
                }).subscribe();
            _sgClient.channel('realtime:reactions')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'reactions' }, () => {
                    const ids = Object.keys(reactionsCache);
                    if (ids.length) loadReactions(ids);
                }).subscribe();
        }

        // ==================== Подгрузка пропущенных ====================
        async function fetchMissedMessages() {
            if (!currentUser || !lastMessageId) return;
            try {
                const { data } = await _sgClient.from('messages')
                    .select('id, user_id, user_name, text, created_at')
                    .gt('id', lastMessageId)
                    .order('created_at', { ascending: true })
                    .limit(20);
                if (data && data.length > 0) {
                    data.forEach(msg => renderMessage(msg, true));
                    lastMessageId = data[data.length - 1].id;
                    loadReactions(data.map(m => m.id));
                }
            } catch (e) { console.warn('Ошибка подгрузки:', e); }
        }

        refreshBtn.addEventListener('click', () => {
            fetchMissedMessages();
        });

        function startPolling() {
            if (pollingInterval) clearInterval(pollingInterval);
            pollingInterval = setInterval(() => {
                if (!currentUser || !lastMessageId) return;
                fetchMissedMessages();
            }, 3000);
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && currentUser) {
                fetchMissedMessages();
            }
        });

        // ==================== Отправка (с @exit) ====================
        async function sendMessage(text) {
            if (!currentUser || !text.trim()) return;

            // Команда выхода
            if (text.trim() === '@exit') {
                localStorage.removeItem('semejka_user');
                if (pollingInterval) clearInterval(pollingInterval);
                currentUser = null;
                lastMessageId = null;
                nameInput.value = '';
                regScreen.classList.add('active');
                chatScreen.classList.remove('active');
                resetTextarea();
                return;
            }

            sendBtn.disabled = true;

            const tempId = 'optimistic-' + Date.now();
            const optimisticMsg = {
                id: tempId,
                user_id: currentUser.id,
                user_name: currentUser.name,
                text: text.trim(),
                created_at: new Date().toISOString()
            };
            renderMessage(optimisticMsg, true);

            try {
                const { data, error } = await _sgClient.from('messages').insert({
                    user_id: currentUser.id, user_name: currentUser.name, text: text.trim()
                }).select('id, user_id, user_name, text, created_at').single();

                if (error) throw error;
                if (data) {
                    const tempElement = document.getElementById('msg-' + tempId);
                    if (tempElement) {
                        tempElement.id = 'msg-' + data.id;
                        if (!lastMessageId || data.id > lastMessageId) lastMessageId = data.id;
                        const timeElement = tempElement.querySelector('.time');
                        if (timeElement) timeElement.textContent = formatTime(data.created_at);
                    }
                }
            } catch (err) {
                alert('Ошибка отправки: ' + err.message);
                const tempElement = document.getElementById('msg-' + tempId);
                if (tempElement) tempElement.remove();
            } finally {
                sendBtn.disabled = false;
                msgInput.value = '';
                msgInput.style.height = 'auto';
                msgInput.style.overflowY = 'hidden';
                msgInput.focus();
            }
        }

        msgInput.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); await sendMessage(msgInput.value); resetTextarea(); }
        });
        sendBtn.addEventListener('click', async () => { await sendMessage(msgInput.value); resetTextarea(); });

        // ==================== Вход ====================
        const savedUser = localStorage.getItem('semejka_user');
        if (savedUser) { try { nameInput.value = JSON.parse(savedUser).name || ''; } catch(e) {} }

        function formatDateSeparator(dateStr) {
            const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
            const d = new Date(dateStr);
            return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()} г.`;
        }
        function insertDateSeparator(dateString) {
            const sep = document.createElement('div'); sep.className = 'date-separator';
            const svDate = new Date(dateString).toLocaleDateString('sv-SE'); sep.dataset.date = svDate;
            sep.innerHTML = `<span>${formatDateSeparator(dateString)}</span>`;
            messagesDiv.appendChild(sep);
        }

        joinBtn.addEventListener('click', async () => {
            const name = nameInput.value.trim();
            if (!name) return;
            joinBtn.disabled = true; joinBtn.textContent = 'Вход...';
            try {
                const { data: users } = await _sgClient.from('users').select('*').eq('name', name).limit(1);
                let user = users?.[0];
                if (user) {
                    await _sgClient.from('users').update({ last_seen: new Date() }).eq('id', user.id);
                } else {
                    const { data: newUser, error } = await _sgClient.from('users').insert({ name, email: null }).select().single();
                    if (error) throw error;
                    user = newUser;
                }
                currentUser = user;
                localStorage.setItem('semejka_user', JSON.stringify(user));
                regScreen.classList.remove('active'); chatScreen.classList.add('active');
                await loadMessages();
                subscribeMessages();
                startPolling();
                if (window._pushSubscription) await saveSubscription(window._pushSubscription);
                msgInput.focus(); resetTextarea();
            } catch (err) { alert('Ошибка входа: ' + err.message); joinBtn.disabled = false; joinBtn.textContent = 'Войти'; }
        });

        const saved = localStorage.getItem('semejka_user');
        if (saved) {
            const user = JSON.parse(saved);
            _sgClient.from('users').select('*').eq('id', user.id).single().then(({ data }) => {
                if (data) {
                    currentUser = data;
                    regScreen.classList.remove('active'); chatScreen.classList.add('active');
                    loadMessages().then(() => { subscribeMessages(); startPolling(); });
                } else { localStorage.removeItem('semejka_user'); }
            });
        }

        function formatTime(ts) { const d = new Date(ts); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
        function escapeHtml(text) { const el = document.createElement('div'); el.textContent = text; return el.innerHTML; }
    </script>
</body>
</html>
