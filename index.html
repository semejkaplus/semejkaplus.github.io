        .bubble a { color: #6C63FF; text-decoration: underline; word-break: break-all; }

        @media (max-width: 480px) {
            .emoji-panel { max-width: calc(100vw - 30px); }

    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const _sgClient = window.supabase.createClient(
            'https://sfsxflsbueyotiksqknp.supabase.co',
            'sb_publishable_32wqroL1fDtPIVwHbvZtIg_5Hipzmdj'
        );

        const regScreen = document.getElementById('regScreen');
        const chatScreen = document.getElementById('chatScreen');
        const nameInput = document.getElementById('nameInput');
        const joinBtn = document.getElementById('joinBtn');
        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const attachBtn = document.getElementById('attachBtn');
        const fileInput = document.getElementById('fileInput');
        const refreshBtn = document.getElementById('refreshBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');

        let currentUser = null, lastMessageId = null;
        let reactionsCache = {};
        let longPressTimer = null;
        let realtimeChannel = null;
        let backupSyncInterval = null;

        function autoResize() {
            msgInput.style.height = 'auto';
            const scrollHeight = msgInput.scrollHeight;
            const maxHeight = 200;
            msgInput.style.height = (scrollHeight > maxHeight ? maxHeight : scrollHeight) + 'px';
            msgInput.style.overflowY = scrollHeight > maxHeight ? 'auto' : 'hidden';
        }
        msgInput.addEventListener('input', autoResize);

        function resetTextarea() {
            msgInput.value = '';
            msgInput.style.height = 'auto';
            msgInput.style.overflowY = 'hidden';
        }

        function logout() {
            localStorage.removeItem('semejka_user');
            localStorage.removeItem('chat_cached_messages');
            if (backupSyncInterval) { clearInterval(backupSyncInterval); backupSyncInterval = null; }
            _sgClient.removeAllChannels();
            currentUser = null; lastMessageId = null; reactionsCache = {};
            regScreen.classList.add('active');
            chatScreen.classList.remove('active');
            nameInput.value = '';
            resetTextarea();
        }

        const EMOJI_LIST = [
            { emoji: '👍', name: 'Нравится' }, { emoji: '❤️', name: 'Люблю' }, { emoji: '😊', name: 'Радость' },
            { emoji: '😢', name: 'Грусть' }, { emoji: '🎉', name: 'Поздравляю' }, { emoji: '🔥', name: 'Огонь' },
            { emoji: '😡', name: 'Злюсь' }, { emoji: '😂', name: 'Смех' }, { emoji: '😮', name: 'Удивлён' },
            { emoji: '😴', name: 'Сонный' }, { emoji: '😎', name: 'Круто' }, { emoji: '🤔', name: 'Задумчивость' },
            { emoji: '😍', name: 'Восхищён' }, { emoji: '👏', name: 'Аплодисменты' }, { emoji: '💪', name: 'Сила' },
            { emoji: '🙏', name: 'Спасибо' }
        ];

        async function fetchWithTimeout(url, options, timeout = 3000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (error) {
                clearTimeout(id);
                throw error;
            }
        }

        async function loadReactions(messageIds) {
            if (!messageIds || !messageIds.length) return;
            try {
                const url = `https://sfsxflsbueyotiksqknp.supabase.co/rest/v1/reactions?select=id,message_id,user_id,emoji&message_id=in.(${messageIds.join(',')})`;
                const res = await fetchWithTimeout(url, {
                    headers: { 'apikey': 'sb_publishable_32wqroL1fDtPIVwHbvZtIg_5Hipzmdj', 'Authorization': 'Bearer sb_publishable_32wqroL1fDtPIVwHbvZtIg_5Hipzmdj' }
                }, 2500);
                if (!res.ok) return;
                const data = await res.json();
                if (data) {
                    data.forEach(r => {
                        if (!reactionsCache[r.message_id]) reactionsCache[r.message_id] = [];
                        if (!reactionsCache[r.message_id].some(ex => ex.id === r.id)) reactionsCache[r.message_id].push(r);
                    });
                    messageIds.forEach(id => updateReactionDisplay(id));
                }
            } catch (err) {}
        }

        function updateReactionDisplay(messageId) {
            const msgEl = document.getElementById('msg-' + messageId);
            if (!msgEl) return;
            let container = msgEl.querySelector('.reactions-container');
            if (!container) {
                const footer = msgEl.querySelector('.msg-footer');
                if (!footer) return;
                container = document.createElement('div'); container.className = 'reactions-container';
                footer.appendChild(container);
            }
            const reactions = reactionsCache[messageId] || [];
            const counts = {};
            reactions.forEach(r => counts[r.emoji] = (counts[r.emoji] || 0) + 1);
            const userReaction = reactions.find(r => r.user_id === currentUser?.id);
            container.innerHTML = '';
            Object.entries(counts).forEach(([emoji, count]) => {
                const badge = document.createElement('span');
                badge.className = 'reaction-badge' + (userReaction && userReaction.emoji === emoji ? ' active' : '');
                badge.textContent = emoji + ' ' + count;
                badge.onclick = (e) => { e.stopPropagation(); toggleReaction(messageId, emoji); };
                container.appendChild(badge);
            });
        }

        async function toggleReaction(messageId, emoji) {
            if (!currentUser) return;
            const reactions = reactionsCache[messageId] || [];
            const existing = reactions.find(r => r.user_id === currentUser.id);
            if (existing && existing.emoji === emoji) {
                reactionsCache[messageId] = reactions.filter(r => r.id !== existing.id);
            } else {
                if (existing) reactionsCache[messageId] = reactions.filter(r => r.id !== existing.id);
                reactionsCache[messageId] = [...(reactionsCache[messageId] || []), { id: 'temp-' + Date.now(), message_id: messageId, user_id: currentUser.id, emoji: emoji }];
            }
            updateReactionDisplay(messageId);
            try {
                if (existing) await _sgClient.from('reactions').delete().eq('id', existing.id);
                if (!existing || existing.emoji !== emoji) {
                    const { data, error } = await _sgClient.from('reactions').insert({ message_id: messageId, user_id: currentUser.id, emoji: emoji }).select().single();
                    if (!error && data) {
                        reactionsCache[messageId] = (reactionsCache[messageId] || []).filter(r => r.id !== (existing?.id) && !r.id.toString().startsWith('temp-'));
                        reactionsCache[messageId].push(data);
                    }
                }
            } catch (err) {} finally { updateReactionDisplay(messageId); }
        }

        function showEmojiPanel(messageId) {
            const msgEl = document.getElementById('msg-' + messageId);
            if (!msgEl) return;
            document.querySelectorAll('.emoji-panel.open').forEach(p => p.classList.remove('open'));
            let panel = msgEl.querySelector('.emoji-panel');
            if (!panel) {
                panel = document.createElement('div'); panel.className = 'emoji-panel';
                const searchBlock = document.createElement('div'); searchBlock.className = 'search-block';
                const searchToggle = document.createElement('button'); searchToggle.className = 'search-toggle'; searchToggle.innerHTML = '🔍';
                searchBlock.appendChild(searchToggle); panel.appendChild(searchBlock);
                const quickContainer = document.createElement('div'); quickContainer.className = 'quick-emojis';
                EMOJI_LIST.slice(0, 8).forEach(item => {
                    const span = document.createElement('span'); span.className = 'emoji-option'; span.textContent = item.emoji;
                    span.onclick = (e) => { e.stopPropagation(); toggleReaction(messageId, item.emoji); panel.classList.remove('open'); };
                    quickContainer.appendChild(span);
                });
                panel.appendChild(quickContainer);
                const searchRow = document.createElement('div'); searchRow.className = 'search-row';
                const searchInput = document.createElement('input'); searchInput.type = 'text'; searchInput.className = 'emoji-search'; searchInput.placeholder = 'Поиск...';
                const optionsContainer = document.createElement('div'); optionsContainer.className = 'emoji-options';
                const renderFilteredEmojis = (filterText = '') => {
                    optionsContainer.innerHTML = '';
                    EMOJI_LIST.filter(item => item.name.toLowerCase().includes(filterText.toLowerCase()) || item.emoji.includes(filterText)).forEach(item => {
                        const span = document.createElement('span'); span.className = 'emoji-option'; span.textContent = item.emoji;
                        span.onclick = (e) => { e.stopPropagation(); toggleReaction(messageId, item.emoji); panel.classList.remove('open'); };
                        optionsContainer.appendChild(span);
                    });
                };
                searchInput.addEventListener('input', () => renderFilteredEmojis(searchInput.value));
                renderFilteredEmojis();
                searchRow.appendChild(searchInput); searchRow.appendChild(optionsContainer); panel.appendChild(searchRow);
                searchToggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (searchRow.classList.contains('active')) { searchRow.classList.remove('active'); quickContainer.classList.remove('hidden'); }
                    else { quickContainer.classList.add('hidden'); searchRow.classList.add('active'); searchInput.focus(); }
                });
                msgEl.appendChild(panel);
            }
            panel.classList.add('open');
        }
        document.addEventListener('click', (e) => { if (!e.target.closest('.emoji-panel') && !e.target.closest('.bubble')) document.querySelectorAll('.emoji-panel.open').forEach(p => p.classList.remove('open')); });

        function addLongPressListeners(msgElement, messageId) {
            const bubble = msgElement.querySelector('.bubble');
            if (!bubble) return;
            bubble.addEventListener('mousedown', (e) => { if (!e.target.closest('a')) longPressTimer = setTimeout(() => showEmojiPanel(messageId), 300); });
            bubble.addEventListener('mouseup', () => clearTimeout(longPressTimer));
            bubble.addEventListener('mouseleave', () => clearTimeout(longPressTimer));
            bubble.addEventListener('touchstart', (e) => { if (!e.target.closest('a')) longPressTimer = setTimeout(() => showEmojiPanel(messageId), 300); }, { passive: true });
            bubble.addEventListener('touchend', () => clearTimeout(longPressTimer));
        }

        function linkify(text) {
            return text.replace(/(https?:\/\/[^\s<]+)/gi, (url) => `<a href="${url.replace(/"/g, '&quot;')}" target="_blank" rel="noopener noreferrer">${url}</a>`);
        }

        // ИСПРАВЛЕНО: Жёсткое и точное сравнение дат без смещений во времени
        function renderMessagesArray(messagesArray) {
            Array.from(messagesDiv.children).forEach(child => { if (child !== loadingSpinner) child.remove(); });
            
            messagesArray.sort((a, b) => {
                const idA = a.id.toString().startsWith('brc-') ? 0 : Number(a.id);
                const idB = b.id.toString().startsWith('brc-') ? 0 : Number(b.id);
                if (idA !== 0 && idB !== 0) return idA - idB;
                return new Date(a.created_at).getTime() - new Date(b.created_at).getTime();
            });

            let currentTrackedDate = null;

            messagesArray.forEach(msg => {
                if (document.getElementById('msg-' + msg.id)) return;

                // Унифицированное получение системной даты без погрешности часовых поясов
                const dObj = new Date(msg.created_at || Date.now());
                const msgDateString = `${dObj.getFullYear()}-${String(dObj.getMonth()+1).padStart(2,'0')}-${String(dObj.getDate()).padStart(2,'0')}`;

                if (msgDateString !== currentTrackedDate) {
                    const sep = document.createElement('div'); sep.className = 'date-separator';
                    sep.innerHTML = `<span>${formatDateSeparator(msg.created_at)}</span>`;
                    messagesDiv.appendChild(sep);
                    currentTrackedDate = msgDateString;
                }

                if (msg.id && !msg.id.toString().startsWith('optimistic') && !msg.id.toString().startsWith('brc-')) {
                    const currentId = Number(msg.id);
                    if (!lastMessageId || currentId > Number(lastMessageId)) lastMessageId = currentId;
                }

                const div = document.createElement('div');
                div.id = 'msg-' + msg.id;
                div.className = 'msg ' + (msg.user_id === currentUser?.id ? 'sent' : 'received');

                let html = msg.user_id !== currentUser?.id ? `<div class="name">${escapeHtml(msg.user_name || '')}</div>` : '';
                let bubbleContent = linkify(escapeHtml(msg.text || ''));
                
                if (msg.image_url) {
                    html += `<div class="msg-content"><div class="bubble">${bubbleContent}
                        <div class="img-wrapper">
                            <img src="${msg.image_url}" class="chat-image" onload="this.classList.add('loaded')" loading="lazy" decoding="async">
                        </div></div></div>`;
                } else {
                    html += `<div class="msg-content"><div class="bubble">${bubbleContent}</div></div>`;
                }
                
                html += `<div class="msg-footer"><div class="time">${formatTime(msg.created_at || new Date().toISOString())}</div></div>`;

                div.innerHTML = html;
                messagesDiv.appendChild(div);
                addLongPressListeners(div, msg.id);
            });

            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function renderSingleMessage(msg, animate = false) {
            if (document.getElementById('msg-' + msg.id)) return;

            if (msg.id && !msg.id.toString().startsWith('brc-')) {
                const el = document.getElementById('msg-brc-' + msg.created_at);
                if (el) { el.id = 'msg-' + msg.id; addLongPressListeners(el, msg.id); return; }
            }

            if (msg.id && !msg.id.toString().startsWith('optimistic') && !msg.id.toString().startsWith('brc-')) {
                const currentId = Number(msg.id);
                if (!lastMessageId || currentId > Number(lastMessageId)) lastMessageId = currentId;
            }

            const div = document.createElement('div');
            div.id = 'msg-' + msg.id;
            div.className = 'msg ' + (msg.user_id === currentUser?.id ? 'sent' : 'received');

            let html = msg.user_id !== currentUser?.id ? `<div class="name">${escapeHtml(msg.user_name || '')}</div>` : '';
            let bubbleContent = linkify(escapeHtml(msg.text || ''));
            
            if (msg.image_url) {
                html += `<div class="msg-content"><div class="bubble">${bubbleContent}
                    <div class="img-wrapper">
                        <img src="${msg.image_url}" class="chat-image" onload="this.classList.add('loaded')" loading="lazy" decoding="async">
                    </div></div></div>`;
            } else {
                html += `<div class="msg-content"><div class="bubble">${bubbleContent}</div></div>`;
            }

            html += `<div class="msg-footer"><div class="time">${formatTime(msg.created_at || new Date().toISOString())}</div></div>`;

            div.innerHTML = html;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            if (animate) {
                div.classList.add('animate-in');
                div.addEventListener('animationend', () => div.classList.remove('animate-in'), { once: true });
            }
            addLongPressListeners(div, msg.id);
        }

        async function syncNewMessagesOnly() {
            if (!currentUser) return;
            try {
                const url = `https://sfsxflsbueyotiksqknp.supabase.co/rest/v1/messages?select=id,user_id,user_name,text,image_url,created_at&order=created_at.asc${lastMessageId ? '&id=gt.' + lastMessageId : ''}`;
                const res = await fetchWithTimeout(url, { headers: { 'apikey': 'sb_publishable_32wqroL1fDtPIVwHbvZtIg_5Hipzmdj', 'Authorization': 'Bearer sb_publishable_32wqroL1fDtPIVwHbvZtIg_5Hipzmdj' } }, 3000);
                if (!res.ok) return;
                const data = await res.json();
                if (data && data.length > 0) {
                    data.forEach(msg => renderSingleMessage(msg, true));
                    cacheCurrentMessages();
                    loadReactions(data.map(m => m.id));
                }
            } catch (e) {}
        }

        function cacheCurrentMessages() {
            try {
                const url = `https://sfsxflsbueyotiksqknp.supabase.co/rest/v1/messages?select=id,user_id,user_name,text,image_url,created_at&order=created_at.desc&limit=30`;
                fetchWithTimeout(url, { headers: { 'apikey': 'sb_publishable_32wqroL1fDtPIVwHbvZtIg_5Hipzmdj', 'Authorization': 'Bearer sb_publishable_32wqroL1fDtPIVwHbvZtIg_5Hipzmdj' } }, 2500)
                .then(r => r.json())
                .then(data => {
                    if (data && data.length) {
                        localStorage.setItem('chat_cached_messages', JSON.stringify(data.reverse()));
                    }
                }).catch(()=>{});
            } catch(e){}
        }

        async function loadMessages() {
            let localData = [];
            try {
                const cached = localStorage.getItem('chat_cached_messages');
                if (cached) {
                    localData = JSON.parse(cached);
                    if (localData && localData.length > 0) {
                        renderMessagesArray(localData);
                        loadingSpinner.classList.remove('active'); 
                        setTimeout(() => loadReactions(localData.map(m => m.id)), 50);
                    }
                }
            } catch(e) {}

            try {
                const url = `https://sfsxflsbueyotiksqknp.supabase.co/rest/v1/messages?select=id,user_id,user_name,text,image_url,created_at&order=created_at.asc&limit=30`;
                const res = await fetchWithTimeout(url, { headers: { 'apikey': 'sb_publishable_32wqroL1fDtPIVwHbvZtIg_5Hipzmdj', 'Authorization': 'Bearer sb_publishable_32wqroL1fDtPIVwHbvZtIg_5Hipzmdj' } }, 3500);
                if (!res.ok) throw new Error();
                const serverData = await res.json();
                if (serverData && serverData.length > 0) {
                    renderMessagesArray(serverData);
                    localStorage.setItem('chat_cached_messages', JSON.stringify(serverData));
                    setTimeout(() => loadReactions(serverData.map(m => m.id)), 50);
                }
            } catch (e) {
                console.log('Сетевой таймаут. Зафиксировано на локальном кэше.');
            } finally {
                loadingSpinner.classList.remove('active');
            }
        }

        function subscribeMessages() {
            if (realtimeChannel) _sgClient.removeChannel(realtimeChannel);
            realtimeChannel = _sgClient.channel('chat-room', { config: { broadcast: { self: false, ack: true } } });
            realtimeChannel.on('broadcast', { event: 'shout' }, payload => { if (currentUser) { renderSingleMessage(payload.payload, true); cacheCurrentMessages(); } });
            
            _sgClient.channel('realtime:reactions').on('postgres_changes', { event: '*', schema: 'public', table: 'reactions' }, () => {
                const ids = Object.keys(reactionsCache); if (ids.length) loadReactions(ids);
            }).subscribe();

            realtimeChannel.subscribe((status) => {
                if (status === 'SUBSCRIBED') syncNewMessagesOnly();
                else setTimeout(subscribeMessages, 5000);
            });
        }

        async function compressAndUploadImage(file) {
            try {
                const options = { 
                    maxSizeMB: 0.04, 
                    maxWidthOrHeight: 800, 
                    useWebWorker: true, 
                    fileType: 'image/webp' 
                };
                const compressedFile = await imageCompression(file, options);
                const fileName = `${Date.now()}_r${Math.random().toString(36).substr(2, 4)}.webp`;
                const { error } = await _sgClient.storage.from('chat-attachments').upload(fileName, compressedFile);
                if (error) throw error;
                return _sgClient.storage.from('chat-attachments').getPublicUrl(fileName).data.publicUrl;
            } catch (err) {
                alert('Сбой сети при отправке. Попробуйте отправить фото ещё раз.'); return null;
            }
        }

        async function sendMessage(text, imageUrl = null) {
            const cleanText = text ? text.trim() : '';
            if (!currentUser || (!cleanText && !imageUrl)) return;
            if (cleanText === '@exit') { logout(); return; }

            sendBtn.disabled = true; attachBtn.disabled = true;
            const timeStamp = new Date().toISOString();
            const msgPayload = {
                id: 'brc-' + timeStamp,
                user_id: currentUser.id, user_name: currentUser.name,
                text: cleanText, image_url: imageUrl, created_at: timeStamp
            };

            renderSingleMessage(msgPayload, true);
            resetTextarea();

            if (realtimeChannel && realtimeChannel.state === 'joined') {
                realtimeChannel.send({ type: 'broadcast', event: 'shout', payload: msgPayload });
            }

            try {
                const { data } = await _sgClient.from('messages').insert({ user_id: currentUser.id, user_name: currentUser.name, text: cleanText, image_url: imageUrl }).select('id').single();
                if (data) {
                    const tempEl = document.getElementById('msg-' + msgPayload.id);
                    if (tempEl) { tempEl.id = 'msg-' + data.id; addLongPressListeners(tempEl, data.id); if (!lastMessageId || Number(data.id) > Number(lastMessageId)) lastMessageId = Number(data.id); }
                    cacheCurrentMessages();
                }
            } catch (err) {} finally { sendBtn.disabled = false; attachBtn.disabled = false; msgInput.focus(); }
        }

        attachBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', async () => {
            const file = fileInput.files[0]; if (!file) return;
            const originalSVG = attachBtn.innerHTML;
            attachBtn.innerHTML = '<div class="btn-spinner"></div>'; attachBtn.disabled = true;
            const imageUrl = await compressAndUploadImage(file);
            if (imageUrl) await sendMessage(msgInput.value, imageUrl);
            fileInput.value = ''; attachBtn.innerHTML = originalSVG; attachBtn.disabled = false;
        });

        function startPolling() { if (backupSyncInterval) clearInterval(backupSyncInterval); backupSyncInterval = setInterval(syncNewMessagesOnly, 6000); }
        refreshBtn.addEventListener('click', async () => { await syncNewMessagesOnly(); const ids = Object.keys(reactionsCache); if (ids.length) await loadReactions(ids); });

        ['visibilitychange', 'focus'].forEach(evt => { window.addEventListener(evt, () => { if (currentUser) { syncNewMessagesOnly(); subscribeMessages(); } }); });
        msgInput.addEventListener('keypress', async (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); await sendMessage(msgInput.value); } });
        sendBtn.addEventListener('click', async () => { await sendMessage(msgInput.value); });

        function formatDateSeparator(dateStr) {
            const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
            const d = new Date(dateStr); return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()} г.`;
        }

        joinBtn.addEventListener('click', async () => {
            const name = nameInput.value.trim(); if (!name) return;
            joinBtn.disabled = true;
            try {
                const { data: users } = await _sgClient.from('users').select('*').eq('name', name).limit(1);
                let user = users?.[0];
                if (user) await _sgClient.from('users').update({ last_seen: new Date() }).eq('id', user.id);
                else user = (await _sgClient.from('users').insert({ name, email: null }).select().single()).data;
                
                currentUser = user; localStorage.setItem('semejka_user', JSON.stringify(user));
                regScreen.classList.remove('active'); chatScreen.classList.add('active');
                loadingSpinner.classList.add('active');
                await loadMessages();
                loadingSpinner.classList.remove('active');
                subscribeMessages(); startPolling();
            } catch (err) { alert('Ошибка сети при авторизации'); regScreen.classList.add('active'); }
            finally { joinBtn.disabled = false; }
        });

        const saved = localStorage.getItem('semejka_user');
        if (saved) {
            const user = JSON.parse(saved);
            regScreen.classList.remove('active'); chatScreen.classList.add('active'); loadingSpinner.classList.add('active');
            _sgClient.from('users').select('*').eq('id', user.id).single().then(async ({ data }) => {
                if (data) { currentUser = data; await loadMessages(); loadingSpinner.classList.remove('active'); subscribeMessages(); startPolling(); }
                else { localStorage.removeItem('semejka_user'); logout(); }
            });
        }

        function formatTime(ts) { const d = new Date(ts); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
        function escapeHtml(text) { const el = document.createElement('div'); el.textContent = text; return el.innerHTML; }
    </script>
</body>
</html>
