<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SEMEJKA PLUS</title>

    <link class="icon" type="image/jpeg" href="https://s10.iimage.su/s/09/th_gvMJ97Lx8OAzBYuHL1UHLtuA0yebaDQnB8Uie9Xwd.jpg">
    <meta name="theme-color" content="#6C63FF">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Семейка+">
    <link rel="apple-touch-icon" href="https://s10.iimage.su/s/09/th_gvMJ97Lx8OAzBYuHL1UHLtuA0yebaDQnB8Uie9Xwd.jpg">
    <link rel="manifest" href="manifest.json">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            height: 100dvh; height: 100vh; 
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-overflow-scrolling: auto;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
        }
        .screen { display: none; height: 100%; width: 100%; }
        .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

        #regScreen {
            background: linear-gradient(180deg, #FEE0B7 0%, #FDD299 33%, #EB8680 66%, #E67D76 100%);
            padding: 20px;
        }
        .box {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-radius: 40px; padding: 45px 35px; max-width: 420px; width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1), inset 0 0 0 1px rgba(255,255,255,0.6);
            text-align: center; border: 1px solid rgba(255,255,255,0.5);
        }

        .logo-glass-container {
            width: 100%;
            max-width: 320px;
            margin: 0 auto 20px auto;
            user-select: none;
        }
        .logo-glass-container svg { width: 100%; height: auto; display: block; }

        p { color: #635857; margin-bottom: 25px; font-size: 17px; font-weight: 600; opacity: 0.85; }
        input { width: 100%; padding: 18px 24px; font-size: 18px; border: 1px solid rgba(255,255,255,0.8); border-radius: 25px; margin-bottom: 15px; background: rgba(255,255,255,0.5); outline: none; transition: 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.05); color: #3A3A4A; }
        input:focus { border-color: #6C63FF; background: rgba(255,255,255,0.8); box-shadow: 0 0 0 4px rgba(108,99,255,0.2), 0 5px 15px rgba(0,0,0,0.1); }
        
        .error-msg { color: #D04A42; font-size: 14px; font-weight: 600; margin-bottom: 15px; display: none; text-align: left; padding-left: 15px; }
        
        .welcome-back, .login-existing { display: none; flex-direction: column; gap: 15px; width: 100%; }
        .welcome-text { color: #3A3A4A; font-size: 20px; font-weight: 700; margin-bottom: 5px; }
        
        .link-btn { 
            width: 100% !important;
            padding: 14px; 
            background: rgba(255, 255, 255, 0.4); 
            border: 2px solid #6C63FF; 
            color: #6C63FF; 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            border-radius: 25px;
            margin-top: 12px; 
            display: inline-block;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(108,99,255,0.1);
        }
        .link-btn:hover { 
            background: #6C63FF;
            color: white;
            box-shadow: 0 8px 15px rgba(108,99,255,0.2);
            transform: translateY(-1px);
        }

        button { width: 100%; padding: 18px; background: linear-gradient(135deg, #6C63FF, #8B82FF); color: white; border: none; border-radius: 25px; font-size: 20px; font-weight: 700; cursor: pointer; transition: 0.2s; box-shadow: 0 10px 25px rgba(108,99,255,0.4); }
        button:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(108,99,255,0.5); }
        button:disabled { background: #B0B0B0; box-shadow: none; transform: none; cursor: not-allowed; }

        #chatScreen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, #FEE0B7 0%, #FDD299 33%, #EB8680 66%, #E67D76 100%); display: none; flex-direction: column; width: 100%; height: 100%; }
        #chatScreen.active { display: flex; }

        .control-capsule {
            position: absolute; top: 16px; right: 16px;
            width: 54px; height: 110px;
            background: #FFFDF9;
            border: 1px solid rgba(0,0,0,0.06);
            border-radius: 27px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            display: flex; flex-direction: column; z-index: 100; overflow: hidden;
        }
        .capsule-btn {
            flex: 1; width: 100%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; background: none; border: none; border-radius: 0; padding: 0; box-shadow: none;
            transition: background 0.15s ease, transform 0.1s ease;
        }
        .capsule-btn:active { transform: scale(0.92); }
        .capsule-btn:hover { background: rgba(0,0,0,0.02); }
        .capsule-divider { height: 1px; width: 100%; background: #231F20; opacity: 0.15; }

        .star-icon-svg { transform: rotate(-15deg); transform-origin: center; }

        .side-panel-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 150; opacity: 0; visibility: hidden;
            will-change: opacity, visibility;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }
        .side-panel-overlay.active { opacity: 1; visibility: visible; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

        .side-panel {
            position: fixed; 
            top: 50%; left: 20px; right: 20px;
            max-width: 500px; margin: 0 auto;
            background: white; border-radius: 32px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.2);
            z-index: 160; padding: 24px;
            display: flex; flex-direction: column;
            max-height: 80vh;
            opacity: 0; visibility: hidden;
            transform: translate3d(0, -45%, 0) scale(0.95);
            will-change: transform, opacity, visibility;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.15), opacity 0.2s ease, visibility 0.2s ease;
        }
        .side-panel.active { opacity: 1; visibility: visible; transform: translate3d(0, -50%, 0) scale(1); }
        
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .panel-title { font-size: 20px; font-weight: 800; color: #2A2A3A; }
        .panel-close { background: none; border: none; padding: 0; width: 34px; height: 34px; min-height: auto; border-radius: 50%; color: #8A8A9A; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: none; transition: 0.15s; font-size: 22px; }
        .panel-close:hover { background: #F0F0F5; color: #333; transform: none; }
        
        .panel-content { flex: 1; overflow-y: auto; padding-right: 5px; font-size: 15px; color: #4A4A5A; line-height: 1.6; }
        .panel-content::-webkit-scrollbar { width: 4px; }
        .panel-content::-webkit-scrollbar-thumb { background: #E0E0E5; border-radius: 4px; }

        .member-item { padding: 14px 0; border-bottom: 1px solid #F0F0F5; }
        .member-info { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 15px; }
        .member-text-block { display: flex; flex-direction: column; min-width: 0; flex: 1; }
        .member-name { font-size: 17px; font-weight: 700; color: #2A2A3A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .member-status { font-size: 14px; color: #8A8A9A; margin-top: 2px; }
        .member-action-block { flex-shrink: 0; }
        .member-call-btn { width: auto !important; min-width: 100px; padding: 10px 20px !important; background: #7B73FF; color: white; border: none; border-radius: 18px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(108,99,255,0.2); text-align: center; }
        .member-call-btn:hover { background: #6C63FF; transform: translateY(-1px); }
        .member-me-badge { font-size: 13px; color: #6A6A7A; font-weight: 700; padding: 6px 14px; background: #EAEAEA; border-radius: 12px; display: inline-block; }

        .news-card { background: #F8F9FD; padding: 15px; border-radius: 20px; border: 1px solid #EAECEF; margin-bottom: 12px; }
        .news-card h4 { font-size: 15px; font-weight: 700; color: #3A3A4A; margin-bottom: 5px; }
        .news-card p { font-size: 13px; color: #6A6A7A; margin-bottom: 0; font-weight: normal; opacity: 1; }

        .messages {
            flex: 1 1 auto; overflow-y: auto; padding: 10px 20px 80px 20px;
            display: flex; flex-direction: column; gap: 14px;
            margin: 20px auto 0 auto; width: 100%; max-width: 800px; align-items: stretch;
            position: relative; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch;
        }

        .date-separator { display: flex; justify-content: center; align-items: center; margin: 10px 0; width: 100%; }
        .date-separator span { background: rgba(255,255,255,0.5); padding: 6px 18px; border-radius: 15px; font-size: 13px; color: #5A5A6A; border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 2px 6px rgba(0,0,0,0.05); white-space: nowrap; }

        .msg { max-width: 100%; display: flex; flex-direction: column; margin-bottom: 2px; position: relative; }
        .msg.sent { align-items: flex-end; }
        .msg.received { align-items: flex-start; }

        .bubble {
            display: inline-block; padding: 14px 20px; border-radius: 22px; font-size: 17px; line-height: 1.5; word-wrap: break-word;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12); background: rgba(240,236,245,0.75);
            color: #3A3A4A; max-width: 75%; overflow-wrap: break-word; word-break: break-word; border: 1px solid rgba(255,255,255,0.6);
            cursor: pointer; user-select: none; -webkit-user-select: none; transition: transform 0.1s ease; position: relative;
        }
        .bubble:active { transform: scale(0.98); }
        .sent .bubble { border-bottom-right-radius: 8px; }
        .received .bubble { border-bottom-left-radius: 8px; }

        .name { font-size: 13px; font-weight: 600; margin-bottom: 4px; padding-left: 6px; color: #6A6A7A; }
        .sent .name { display: none; }
        
        .reply-in-bubble {
            background: rgba(108, 99, 255, 0.08); border-left: 3px solid #6C63FF;
            padding: 4px 10px; margin-bottom: 8px; border-radius: 6px; font-size: 14px; color: #4A4A5A;
            max-height: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .reply-in-bubble .reply-owner { font-weight: 700; color: #6C63FF; font-size: 12px; margin-bottom: 2px; }

        .msg-footer { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
        .sent .msg-footer { flex-direction: row-reverse; }
        .received .msg-footer { flex-direction: row; }

        .time { 
            font-size: 11px; color: #4A4A5A; padding: 4px 10px; border-radius: 12px; 
            background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.6); 
            box-shadow: 0 2px 6px rgba(0,0,0,0.08); white-space: nowrap; height: 23px; 
            display: inline-flex; align-items: center; 
        }

        .reactions-wrapper { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
        .reaction-badge {
            background: rgba(255, 255, 255, 0.65); border: 1px solid rgba(255,255,255,0.8); padding: 2px 8px; border-radius: 12px; font-size: 13px; display: flex; align-items: center; gap: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; transition: 0.15s ease; user-select: none; height: 23px;
        }
        .reaction-badge.active { background: rgba(108, 99, 255, 0.15); border-color: rgba(108, 99, 255, 0.4); }
        .reaction-count { font-size: 11px; font-weight: 700; color: #4A4A5A; }

        .reaction-modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.45);
            z-index: 999; display: flex; align-items: center; justify-content: center; 
            opacity: 0; visibility: hidden; transition: opacity 0.16s ease-out, visibility 0.16s ease-out;
        }
        .reaction-modal-overlay.active { opacity: 1; visibility: visible; }
        .reaction-modal-box {
            background: #F4F4F9; border: 1px solid rgba(255, 255, 255, 0.9); padding: 16px 22px; border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25); display: flex; gap: 12px; transform: translate3d(0, 10px, 0) scale(0.95); transition: transform 0.16s ease-out;
        }
        .reaction-modal-overlay.active .reaction-modal-box { transform: translate3d(0, 0, 0) scale(1); }
        .picker-emoji { font-size: 24px; cursor: pointer; transition: transform 0.1s; user-select: none; }

        .typing-container-wrapper { width: 100%; max-width: 800px; margin: 0 auto; position: relative; height: 0; display: flex; justify-content: center; z-index: 10; }
        .typing-indicator-container {
            display: none; align-items: center; gap: 10px; padding: 8px 18px; position: absolute; bottom: 8px;
            background: rgba(255, 255, 255, 0.9); border-radius: 20px; border: 1px solid rgba(108, 99, 255, 0.25); box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .typing-text { font-size: 13px; font-weight: 600; color: #4A4A5A; }
        .typing-sparkles { display: flex; align-items: center; gap: 5px; }
        .typing-sparkle { font-size: 11px; color: #6C63FF; animation: familySparkle 1.2s infinite ease-in-out; }
        @keyframes familySparkle { 0%, 100% { transform: scale(0.6); opacity: 0.3; } 50% { transform: scale(1.3); opacity: 1; } }

        .reply-bar {
            display: none; width: calc(100% - 20px); max-width: 800px; margin: 0 auto -6px auto;
            background: rgba(255, 255, 255, 0.95); padding: 10px 20px; border-top-left-radius: 24px; border-top-right-radius: 24px;
            border: 1px solid rgba(108, 99, 255, 0.25); border-bottom: none; align-items: center; gap: 12px; position: relative; z-index: 10;
        }
        .reply-bar-accent { width: 3px; height: 36px; background: #6C63FF; border-radius: 2px; }
        .reply-bar-content { flex: 1; min-width: 0; }
        .reply-bar-title { font-size: 13px; font-weight: 700; color: #6C63FF; }
        .reply-bar-text { font-size: 14px; color: #5A5A6A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .reply-bar-close { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #8A8A9A; }

        .input-area {
            background: rgba(255,255,255,0.85); padding: 14px 20px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); margin: 0 auto 10px auto; display: flex; gap: 12px; align-items: flex-end; border-radius: 35px; border: 1px solid rgba(108,99,255,0.25); width: calc(100% - 20px); max-width: 800px; position: relative; z-index: 11;
        }
        .input-area.has-reply { border-top-left-radius: 0; border-top-right-radius: 0; }
        .input-area textarea { flex: 1; border-radius: 25px; padding: 15px 22px; font-size: 17px; line-height: 1.4; border: 1px solid #D0D0E0; background: #FFFFFF; outline: none; resize: none; min-height: 52px; max-height: 160px; font-family: inherit; }
        .input-area button { background: linear-gradient(135deg, #6C63FF, #8B82FF); color: white; border: none; padding: 15px 25px; border-radius: 25px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 16px rgba(108,99,255,0.25); flex-shrink: 0; transition: 0.15s; height: 52px; }
        .input-area button:hover { transform: scale(1.02); }

        .bubble a { color: #6C63FF; text-decoration: underline; }
        .swipe-reply-icon { position: absolute; left: -40px; top: 50%; transform: translateY(-50%) scale(0.6); opacity: 0; color: #6C63FF; transition: 0.1s; }

        @media (max-width: 480px) {
            .messages { padding: 5px 10px 75px 10px; gap: 12px; }
            .bubble { font-size: 15px; padding: 11px 16px; max-width: 85%; }
            .control-capsule { width: 50px; height: 100px; top: 12px; right: 12px; border-radius: 25px; }
            .side-panel { left: 16px; right: 16px; padding: 20px; }
        }
    </style>
</head>
<body>
    <div id="regScreen" class="screen active">
        <div class="box">
            <div class="logo-glass-container">
                <svg viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <filter id="liquidGlassEffect" x="-30%" y="-30%" width="160%" height="160%">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur" />
                            <feOffset dx="0" dy="7" result="offsetBlur" />
                            <feSpecularLighting in="blur" surfaceScale="6" specularConstant="1.3" specularExponent="40" lighting-color="#ffffff" result="specOut">
                                <fePointLight x="-120" y="-140" z="180" />
                            </feSpecularLighting>
                            <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut" />
                            <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litOnOff" />
                            <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#c94a42" flood-opacity="0.35"/>
                        </filter>
                        <linearGradient id="glassSemejka" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFAE96" />
                            <stop offset="45%" stop-color="#F2796D" />
                            <stop offset="100%" stop-color="#C93D36" />
                        </linearGradient>
                    </defs>
                    <g filter="url(#liquidGlassEffect)">
                        <text x="200" y="65" font-family="'Arial Rounded MT Bold', sans-serif" font-weight="900" font-size="56" text-anchor="middle" fill="url(#glassSemejka)">SEMEJKA</text>
                        <text x="200" y="138" font-family="'Arial Rounded MT Bold', sans-serif" font-weight="900" font-size="62" text-anchor="middle" fill="url(#glassSemejka)">PLUS</text>
                    </g>
                </svg>
            </div>
            <p id="regSubtitle">Семейный чат для самых близких</p>
            
            <div id="freshForm">
                <input type="text" id="nameInput" placeholder="Ваше имя">
                <input type="text" id="usernameInput" placeholder="Придумайте юзернейм (например, ivan99)">
                <div class="error-msg" id="errorMsg">Юзернейм уже занят!</div>
                <button id="joinBtn">Создать аккаунт</button>
                <button class="link-btn" id="toLoginBtn">Уже есть юзернейм? Войти</button>
            </div>

            <div id="loginForm" class="login-existing">
                <input type="text" id="loginUsernameInput" placeholder="Введите ваш юзернейм">
                <div class="error-msg" id="loginErrorMsg">Пользователь не найден!</div>
                <button id="loginBtn">Войти</button>
                <button class="link-btn" id="toRegisterBtn">Создать новый аккаунт</button>
            </div>

            <div id="fastForm" class="welcome-back">
                <div class="welcome-text" id="welcomeText">Привет!</div>
                <p style="margin-bottom:10px;">Войти как <span id="savedUsernameLabel" style="color:#6C63FF;">@username</span>?</p>
                <button id="fastJoinBtn">Войти в чат</button>
                <button class="link-btn" id="changeUserBtn">Сменить аккаунт</button>
            </div>
        </div>
    </div>

    <div id="chatScreen" class="screen">
        <div class="control-capsule">
            <button class="capsule-btn" id="newsBtn" style="opacity: 0.4; cursor: not-allowed;" disabled>
                <svg class="star-icon-svg" width="32" height="32" viewBox="0 0 64 64" fill="none">
                    <path d="M32 6L40.2 22.6L58.5 25.3L45.2 38.3L48.4 56.6L32 48L15.6 56.6L18.8 38.3L5.5 25.3L23.8 22.6L32 6Z" fill="#FFBA42" stroke="#522613" stroke-width="3.5" stroke-linejoin="round"/>
                </svg>
            </button>
            <div class="capsule-divider"></div>
            <button class="capsule-btn" id="membersBtn" style="opacity: 0.4; cursor: not-allowed;" disabled>
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#6C63FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                </svg>
            </button>
        </div>

        <div class="side-panel-overlay" id="panelOverlay"></div>
        
        <div class="side-panel" id="newsPanel">
            <div class="panel-header">
                <div class="panel-title">Что нового 🌟</div>
                <button class="panel-close" id="closeNewsBtn">&times;</button>
            </div>
            <div class="panel-content">
                <div class="news-card">
                    <h4>Реакции на сообщения</h4>
                    <p>Нажмите на любое облачко сообщения, чтобы оставить быстрое сердечко или лайк!</p>
                </div>
            </div>
        </div>

        <div class="side-panel" id="membersPanel">
            <div class="panel-header">
                <div class="panel-title">Участники Семьи 🤍</div>
                <button class="panel-close" id="closeMembersBtn">&times;</button>
            </div>
            <div class="panel-content" id="membersList"></div>
        </div>

        <div class="messages" id="messages"></div>

        <div class="typing-container-wrapper">
            <div class="typing-indicator-container" id="typingContainer">
                <span class="typing-text" id="typingText">Кто-то шуршит...</span>
                <div class="typing-sparkles"><span class="typing-sparkle">✦</span></div>
            </div>
        </div>

        <div class="reply-bar" id="replyBar">
            <div class="reply-bar-accent"></div>
            <div class="reply-bar-content">
                <div class="reply-bar-title" id="replyBarTitle">Ответ</div>
                <div class="reply-bar-text" id="replyBarText">Текст...</div>
            </div>
            <div class="reply-bar-close" id="replyBarClose">&times;</div>
        </div>

        <div class="input-area" id="inputArea">
            <textarea id="msgInput" placeholder="Напишите сообщение..." rows="1"></textarea>
            <button id="sendBtn">Отправить</button>
        </div>
    </div>

    <div class="reaction-modal-overlay" id="reactionOverlay">
        <div class="reaction-modal-box">
            <span class="picker-emoji" data-emoji="❤️">❤️</span>
            <span class="picker-emoji" data-emoji="👍">👍</span>
            <span class="picker-emoji" data-emoji="🔥">🔥</span>
            <span class="picker-emoji" data-emoji="😂">😂</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDE_YOUR_API_KEY", 
            authDomain: "semejka-plus.firebaseapp.com",
            projectId: "semejka-plus",
            storageBucket: "semejka-plus.appspot.com",
            messagingSenderId: "567104085465",
            appId: "1:567104085465:web:86f68c740eeef23bd90f38"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let messaging = null;
        try {
            messaging = getMessaging(app);
        } catch(e) {
            console.log("Уведомления не поддерживаются вашим браузером");
        }

        let currentUser = null;
        let replyData = null;
        let activeReactionMessageId = null;
        let lastMessageDateStr = null;
        let typingTimeout = null;

        const regScreen = document.getElementById('regScreen');
        const chatScreen = document.getElementById('chatScreen');
        const freshForm = document.getElementById('freshForm');
        const loginForm = document.getElementById('loginForm');
        const fastForm = document.getElementById('fastForm');
        
        const nameInput = document.getElementById('nameInput');
        const usernameInput = document.getElementById('usernameInput');
        const loginUsernameInput = document.getElementById('loginUsernameInput');
        const errorMsg = document.getElementById('errorMsg');
        const loginErrorMsg = document.getElementById('loginErrorMsg');
        const savedUsernameLabel = document.getElementById('savedUsernameLabel');
        const welcomeText = document.getElementById('welcomeText');

        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const inputArea = document.getElementById('inputArea');

        const newsPanel = document.getElementById('newsPanel');
        const membersPanel = document.getElementById('membersPanel');
        const panelOverlay = document.getElementById('panelOverlay');
        const membersList = document.getElementById('membersList');
        const reactionOverlay = document.getElementById('reactionOverlay');

        window.addEventListener('DOMContentLoaded', async () => {
            const cached = localStorage.getItem('semejka_user');
            if (cached) {
                try {
                    const parsed = JSON.parse(cached);
                    const userDoc = await getDoc(doc(db, "users", parsed.username));
                    if (userDoc.exists()) {
                        currentUser = userDoc.data();
                        welcomeText.innerText = `Привет, ${currentUser.name}!`;
                        savedUsernameLabel.innerText = `@${currentUser.username}`;
                        freshForm.style.display = 'none';
                        loginForm.style.display = 'none';
                        fastForm.style.display = 'flex';
                    }
                } catch(e) {
                    localStorage.removeItem('semejka_user');
                }
            }
        });

        document.getElementById('toLoginBtn').addEventListener('click', () => {
            freshForm.style.display = 'none';
            loginForm.style.display = 'flex';
        });

        document.getElementById('toRegisterBtn').addEventListener('click', () => {
            loginForm.style.display = 'none';
            freshForm.style.display = 'flex';
        });

        document.getElementById('changeUserBtn').addEventListener('click', () => {
            fastForm.style.display = 'none';
            freshForm.style.display = 'flex';
        });

        document.getElementById('joinBtn').addEventListener('click', async () => {
            const name = nameInput.value.trim();
            const username = usernameInput.value.trim();
            errorMsg.style.display = 'none';
            if (!name || !username) return;

            const userDocRef = doc(db, "users", username);
            const userDoc = await getDoc(userDocRef);
            if (userDoc.exists()) {
                errorMsg.style.display = 'block';
                return;
            }

            const userData = {
                id: username,
                username: username,
                name: name,
                status: 'online',
                last_seen: serverTimestamp()
            };

            await setDoc(userDocRef, userData);
            currentUser = userData;
            localStorage.setItem('semejka_user', JSON.stringify(userData));
            enterChat();
        });

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const username = loginUsernameInput.value.trim();
            loginErrorMsg.style.display = 'none';
            if (!username) return;

            const userDocRef = doc(db, "users", username);
            const userDoc = await getDoc(userDocRef);
            if (!userDoc.exists()) {
                loginErrorMsg.style.display = 'block';
                return;
            }

            currentUser = userDoc.data();
            await updateDoc(userDocRef, {
                status: 'online',
                last_seen: serverTimestamp()
            });
            localStorage.setItem('semejka_user', JSON.stringify(currentUser));
            enterChat();
        });

        document.getElementById('fastJoinBtn').addEventListener('click', () => {
            if (currentUser) enterChat();
        });

        function closeAllPanels() {
            panelOverlay.classList.remove('active');
            newsPanel.classList.remove('active');
            membersPanel.classList.remove('active');
        }
        document.getElementById('closeNewsBtn').addEventListener('click', closeAllPanels);
        document.getElementById('closeMembersBtn').addEventListener('click', closeAllPanels);
        panelOverlay.addEventListener('click', closeAllPanels);

        function startLiveChat() {
            const q = query(collection(db, "messages"), orderBy("created_at", "asc"));
            onSnapshot(q, (snapshot) => {
                messagesDiv.innerHTML = '';
                lastMessageDateStr = null;
                snapshot.forEach((docSnap) => {
                    renderMessage(docSnap.id, docSnap.data());
                });
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });

            onSnapshot(collection(db, "typing"), (snapshot) => {
                let typers = [];
                snapshot.forEach(dDoc => {
                    if (dDoc.id !== currentUser.id && dDoc.data().isTyping) {
                        typers.push(dDoc.data().name);
                    }
                });
                if (typers.length > 0) {
                    document.getElementById('typingContainer').style.display = 'flex';
                } else {
                    document.getElementById('typingContainer').style.display = 'none';
                }
            });
        }

        function renderMessage(msgId, data) {
            if (!data.created_at) return;
            const msgDate = data.created_at.toDate();
            const dateStr = msgDate.toDateString();
            
            if (dateStr !== lastMessageDateStr) {
                insertDateSeparator(dateStr);
                lastMessageDateStr = dateStr;
            }

            const isMe = data.user_id === currentUser.id;
            const msgNode = document.createElement('div');
            msgNode.className = `msg ${isMe ? 'sent' : 'received'}`;
            
            let replyHtml = '';
            if (data.reply_to) {
                replyHtml = `
                    <div class="reply-in-bubble">
                        <div class="reply-owner">${escapeHtml(data.reply_to.user_name)}</div>
                        <div>${escapeHtml(data.reply_to.text)}</div>
                    </div>
                `;
            }

            let rxWrapperHtml = '';
            if (data.reactions && Object.keys(data.reactions).length > 0) {
                rxWrapperHtml = '<div class="reactions-wrapper">';
                const counts = {};
                Object.values(data.reactions).forEach(emoji => {
                    counts[emoji] = (counts[emoji] || 0) + 1;
                });
                for (const [emoji, count] of Object.entries(counts)) {
                    const activeClass = data.reactions[currentUser.id] === emoji ? 'active' : '';
                    rxWrapperHtml += `<div class="reaction-badge ${activeClass}" data-emoji="${emoji}">${emoji} <span class="reaction-count">${count}</span></div>`;
                }
                rxWrapperHtml += '</div>';
            }

            msgNode.innerHTML = `
                <span class="swipe-reply-icon">➔</span>
                <div class="name">${escapeHtml(data.user_name)}</div>
                <div class="bubble">
                    ${replyHtml}
                    <div>${escapeHtml(data.text)}</div>
                </div>
                <div class="msg-footer">
                    <div class="time">${formatTime(msgDate)}</div>
                    ${rxWrapperHtml}
                </div>
            `;

            msgNode.querySelector('.bubble').addEventListener('click', () => {
                activeReactionMessageId = msgId;
                reactionOverlay.classList.add('active');
            });
            
            msgNode.querySelectorAll('.reaction-badge').forEach(badge => {
                badge.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const emoji = badge.getAttribute('data-emoji');
                    const msgRef = doc(db, "messages", msgId);
                    const currentReactions = data.reactions || {};
                    if (currentReactions[currentUser.id] === emoji) {
                        delete currentReactions[currentUser.id];
                    } else {
                        currentReactions[currentUser.id] = emoji;
                    }
                    await updateDoc(msgRef, { reactions: currentReactions });
                });
            });

            setupSwipeToReply(msgNode, data);
            messagesDiv.appendChild(msgNode);
        }

        reactionOverlay.querySelectorAll('.picker-emoji').forEach(item => {
            item.addEventListener('click', async () => {
                const emoji = item.getAttribute('data-emoji');
                if (!activeReactionMessageId) return;
                const msgRef = doc(db, "messages", activeReactionMessageId);
                const msgDoc = await getDoc(msgRef);
                if (msgDoc.exists()) {
                    const currentReactions = msgDoc.data().reactions || {};
                    if (currentReactions[currentUser.id] === emoji) {
                        delete currentReactions[currentUser.id];
                    } else {
                        currentReactions[currentUser.id] = emoji;
                    }
                    await updateDoc(msgRef, { reactions: currentReactions });
                }
                reactionOverlay.classList.remove('active');
            });
        });

        async function sendMessage() {
            const text = msgInput.value.trim();
            if (!text || !currentUser) return;

            sendBtn.disabled = true;
            msgInput.value = '';
            msgInput.style.height = 'auto';

            try {
                await addDoc(collection(db, "messages"), { 
                    user_id: currentUser.id, 
                    user_name: currentUser.name, 
                    text: text, 
                    reactions: {}, 
                    reply_to: replyData, 
                    created_at: serverTimestamp() 
                });
                await setDoc(doc(db, "typing", currentUser.id), { isTyping: false });
                if (replyData) cancelReply();
            } catch (err) {
                console.error(err);
            } finally { 
                sendBtn.disabled = false; 
                msgInput.focus(); 
            }
        }

        msgInput.addEventListener('keypress', async (e) => { 
            if (e.key === 'Enter' && !e.shiftKey) { 
                e.preventDefault(); 
                await sendMessage(); 
            } 
        });
        sendBtn.addEventListener('click', sendMessage);

        msgInput.addEventListener('input', () => {
            msgInput.style.height = 'auto';
            msgInput.style.height = msgInput.scrollHeight + 'px';
            setDoc(doc(db, "typing", currentUser.id), { name: currentUser.name, isTyping: true });
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                setDoc(doc(db, "typing", currentUser.id), { isTyping: false });
            }, 2000);
        });

        function setupSwipeToReply(node, data) {
            let startX = 0;
            const bubble = node.querySelector('.bubble');
            bubble.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
            }, {passive: true});

            bubble.addEventListener('touchmove', (e) => {
                let diff = e.touches[0].clientX - startX;
                if (diff > 0 && diff < 60) {
                    bubble.style.transform = `translateX(${diff}px)`;
                }
            }, {passive: true});

            bubble.addEventListener('touchend', (e) => {
                let diff = e.changedTouches[0].clientX - startX;
                bubble.style.transform = '';
                if (diff >= 50) {
                    replyData = { text: data.text, user_name: data.user_name };
                    document.getElementById('replyBarText').innerText = data.text;
                    document.getElementById('replyBar').style.display = 'flex';
                    inputArea.classList.add('has-reply');
                }
            });
        }

        function cancelReply() {
            replyData = null;
            document.getElementById('replyBar').style.display = 'none';
            inputArea.classList.remove('has-reply');
        }
        document.getElementById('replyBarClose').addEventListener('click', cancelReply);
        reactionOverlay.addEventListener('click', () => reactionOverlay.classList.remove('active'));

        function formatDateSeparator(dateStr) {
            const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
            const d = new Date(dateStr); 
            return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()} г.`; 
        }
        
        function insertDateSeparator(dateString) {
            const sep = document.createElement('div'); 
            sep.className = 'date-separator';
            sep.innerHTML = `<span>${formatDateSeparator(dateString)}</span>`; 
            messagesDiv.appendChild(sep); 
        }
        
        function formatTime(dateObj) { 
            return dateObj.getHours().toString().padStart(2,'0') + ':' + dateObj.getMinutes().toString().padStart(2,'0'); 
        } 
        
        function escapeHtml(text) { 
            const el = document.createElement('div'); 
            el.innerText = text; 
            return el.innerHTML; 
        }

        async function setupNotifications() {
            if (!messaging || !currentUser) return;
            try {
                const permission = await Notification.requestPermission();
                if (permission === 'granted' && 'serviceWorker' in navigator) {
                    const reg = await navigator.serviceWorker.register('service-worker (4).js');
                    const token = await getToken(messaging, { 
                        serviceWorkerRegistration: reg, 
                        vapidKey: "YOUR_PUBLIC_VAPID_KEY" 
                    });
                    if (token) {
                        await updateDoc(doc(db, "users", currentUser.username), { 
                            pushToken: token 
                        });
                        console.log("Токен уведомлений сохранен.");
                    }
                }
            } catch (err) { 
                console.log("Ошибка настройки пуш-уведомлений:", err); 
            }
        }

        function enterChat() { 
            regScreen.classList.remove('active'); 
            chatScreen.classList.add('active'); 
            startLiveChat(); 
            setupNotifications();
        }
    </script>
</body>
</html>
