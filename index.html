<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семейка+</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --primary-color: #6c5ce7;
            --primary-hover: #5b4cdb;
            --text-dark: #2d3436;
            --text-light: #636e72;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(0,0,0,0.05);
            --border-radius: 20px;
            --accent-color: #00cec9;
            --danger-color: #ff7675;
            --success-color: #2ecc71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-dark);
            overflow: hidden;
        }

        /* Контейнер приложения */
        .app-container {
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            max-height: 850px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--border-radius);
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.5);
        }

        @media (max-width: 480px) {
            .app-container {
                width: 100vw;
                height: 100vh;
                max-width: none;
                max-height: none;
                border-radius: 0;
            }
        }

        /* Общие стили для экранов */
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px;
            transition: all 0.3s ease;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 1;
        }

        .screen.hidden {
            opacity: 0;
            transform: translateX(100%);
            pointer-events: none;
            z-index: 0;
        }

        /* Экран авторизации */
        #authScreen {
            justify-content: center;
            align-items: center;
            transform: translateX(0);
        }
        #authScreen.hidden {
            transform: translateX(-100%);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-title {
            font-family: 'Comfortaa', cursive;
            font-size: 36px;
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .logo-subtitle {
            font-size: 14px;
            color: var(--text-light);
        }

        .auth-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            position: relative;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            border-radius: 15px;
            border: 2px solid transparent;
            background: rgba(255,255,255,0.9);
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-dark);
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
            background: var(--white);
        }

        .btn {
            width: 100%;
            padding: 16px 20px;
            border-radius: 15px;
            border: none;
            background: var(--primary-color);
            color: var(--white);
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.3);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Главный экран */
        #mainScreen.hidden {
            transform: translateX(100%);
        }
        #mainScreen {
            transform: translateX(0);
            padding: 0;
        }

        /* Шапка чата */
        .chat-header {
            padding: 20px 24px;
            background: rgba(255,255,255,0.5);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--primary-color);
            color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.2);
        }

        .user-name {
            font-weight: 600;
            font-size: 18px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.9);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            background: var(--white);
            color: var(--primary-color);
            transform: scale(1.05);
        }

        .icon-btn.call-active-btn {
            background: var(--success-color);
            color: white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }

        /* Область сообщений */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Стили скроллбара */
        .messages-container::-webkit-scrollbar {
            width: 6px;
        }
        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
        }

        .message {
            max-width: 75%;
            display: flex;
            flex-direction: column;
            position: relative;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.incoming {
            align-self: flex-start;
        }

        .message.outgoing {
            align-self: flex-end;
        }

        .message-sender {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 4px;
            margin-left: 8px;
        }

        .message.outgoing .message-sender {
            display: none; /* Для своих сообщений имя скрываем */
        }

        .message-bubble {
            padding: 14px 18px;
            border-radius: var(--border-radius);
            font-size: 15px;
            line-height: 1.4;
            box-shadow: var(--shadow);
            word-break: break-word;
        }

        .message.incoming .message-bubble {
            background: var(--white);
            color: var(--text-dark);
            border-top-left-radius: 5px;
        }

        .message.outgoing .message-bubble {
            background: var(--primary-color);
            color: var(--white);
            border-top-right-radius: 5px;
        }

        .message-time {
            font-size: 10px;
            align-self: flex-end;
            margin-top: 4px;
            margin-right: 8px;
            color: var(--text-light);
        }
        .message.outgoing .message-time {
            color: rgba(255,255,255,0.7);
            margin-right: 4px;
        }

        /* Блок ввода сообщения */
        .chat-input-area {
            padding: 16px 24px;
            background: rgba(255,255,255,0.5);
            border-top: 1px solid rgba(0,0,0,0.05);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 14px 20px;
            border-radius: 25px;
            border: 2px solid transparent;
            background: var(--white);
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            font-weight: 500;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: var(--primary-color);
            color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
            transition: all 0.2s ease;
        }

        .send-btn:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }

        /* Голосовой вызов UI (модальное окно звонка) */
        .voice-call-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #7c5854, #43363b); /* Теплый темный фон под референс */
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--white);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .voice-call-ui.hidden {
            transform: translateY(-100%);
            pointer-events: none;
        }

        .call-card-container {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 45px;
            width: 85%;
            max-width: 400px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .call-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.4);
            margin: 0 auto 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .call-user-name {
            font-size: 24px;
            font-weight: 600;
            color: #1e222b;
            margin-bottom: 6px;
        }

        .call-status-text {
            font-size: 16px;
            color: rgba(28, 31, 38, 0.5);
            margin-bottom: 30px;
        }

        /* --- НОВЫЙ СТИЛЬ КНОПОК ЗВОНКА ПО РЕФЕРЕНСУ --- */
        .voice-call-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
        }

        .btn-icon {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            padding: 0;
        }

        .btn-icon svg {
            width: 26px;
            height: 26px;
        }

        /* Кнопка микрофона (Включен) */
        .btn-mic {
            background: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.45);
            color: #ffffff;
        }

        /* Кнопка микрофона (Выключен / Muted) */
        .btn-mic.muted {
            background: rgba(255, 255, 255, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.55);
            color: #ff4b4b; /* Иконка становится красной */
        }

        /* Кнопка сброса звонка */
        .btn-hangup {
            background: #ff4b4b;
            color: #ffffff;
            box-shadow: 0 12px 24px rgba(255, 75, 75, 0.5); /* Неоновое свечение вниз */
        }

        .btn-icon:active {
            transform: scale(0.95);
        }
        /* --- КОНЕЦ СТИЛЕЙ КНОПОК ЗВОНКА --- */

        /* Системные уведомления/ошибки */
        .toast {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(45, 52, 54, 0.9);
            color: var(--white);
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--shadow);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 1000;
            text-align: center;
            width: 80%;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="authScreen" class="screen">
            <div class="logo-container">
                <div class="logo-title">Семейка+</div>
                <div class="logo-subtitle">Твой уютный семейный мессенджер</div>
            </div>
            <div class="auth-form">
                <div class="input-group">
                    <input type="text" id="usernameInput" placeholder="Введите ваше имя..." autocomplete="off">
                </div>
                <button id="loginBtn" class="btn">Войти в чат</button>
            </div>
        </div>

        <div id="mainScreen" class="screen hidden">
            <div class="chat-header">
                <div class="user-info">
                    <div id="userAvatar" class="avatar">М</div>
                    <div>
                        <div id="displayUserName" class="user-name">Пользователь</div>
                        <div style="font-size: 12px; color: var(--success-color); font-weight: 500;">в сети</div>
                    </div>
                </div>
                <div class="header-actions">
                    <button id="startCallBtn" class="icon-btn" title="Позвонить">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                    </button>
                    <button id="logoutBtn" class="icon-btn" title="Выйти">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    </button>
                </div>
            </div>

            <div id="messagesContainer" class="messages-container">
                </div>

            <div class="chat-input-area">
                <input type="text" id="messageInput" class="chat-input" placeholder="Напишите сообщение..." autocomplete="off">
                <button id="sendMessageBtn" class="send-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>

        <div id="voiceCallUI" class="voice-call-ui hidden">
            <div class="call-card-container">
                <div id="callAvatar" class="call-avatar">?</div>
                <div id="callTargetName" class="call-user-name">Абонент</div>
                <div id="callStatusText" class="call-status-text">Вызов...</div>
                
                <div class="voice-call-buttons">
                    <button id="toggleMicBtn" class="btn-icon btn-mic" aria-label="Микрофон">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                            <line x1="12" x2="12" y1="19" y2="22"/>
                        </svg>
                    </button>

                    <button id="hangupBtn" class="btn-icon btn-hangup" aria-label="Сбросить">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" x2="6" y1="6" y2="18"/>
                            <line x1="6" x2="18" y1="6" y2="18"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="toast" class="toast">Уведомление</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
