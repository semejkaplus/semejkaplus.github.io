<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SEMEJKA PLUS</title>

    <link rel="icon" type="image/jpeg" href="https://s10.iimage.su/s/09/th_gvMJ97Lx8OAzBYuHL1UHLtuA0yebaDQnB8Uie9Xwd.jpg">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6C63FF">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Семейка+">
    <link rel="apple-touch-icon" href="https://s10.iimage.su/s/09/th_gvMJ97Lx8OAzBYuHL1UHLtuA0yebaDQnB8Uie9Xwd.jpg">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
            height: 100vh; overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .screen { display: none; height: 100%; width: 100%; }
        .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

        #regScreen {
            background: linear-gradient(180deg, #FEE0B7 0%, #FDD299 33%, #EB8680 66%, #E67D76 100%);
            padding: 20px;
        }
        .box {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-radius: 40px; padding: 45px 35px; max-width: 420px; width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1), inset 0 0 0 1px rgba(255,255,255,0.6);
            text-align: center; border: 1px solid rgba(255,255,255,0.5);
        }

        .logo-glass-container {
            width: 100%; max-width: 320px; margin: 0 auto 20px auto; user-select: none;
        }
        .logo-glass-container svg { width: 100%; height: auto; display: block; }

        p { color: #635857; margin-bottom: 25px; font-size: 17px; font-weight: 600; opacity: 0.85; }
        input { width: 100%; padding: 18px 24px; font-size: 18px; border: 1px solid rgba(255,255,255,0.8); border-radius: 25px; margin-bottom: 15px; background: rgba(255,255,255,0.5); outline: none; transition: 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.05); color: #3A3A4A; }
        input:focus { border-color: #6C63FF; background: rgba(255,255,255,0.8); box-shadow: 0 0 0 4px rgba(108,99,255,0.2), 0 5px 15px rgba(0,0,0,0.1); }
        
        .username-container { width: 100%; margin-bottom: 5px; }

        button { width: 100%; padding: 18px; background: linear-gradient(135deg, #6C63FF, #8B82FF); color: white; border: none; border-radius: 25px; font-size: 20px; font-weight: 700; cursor: pointer; transition: 0.2s; box-shadow: 0 10px 25px rgba(108,99,255,0.4); margin-top: 10px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(108,99,255,0.5); }

        #chatScreen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, #FEE0B7 0%, #FDD299 33%, #EB8680 66%, #E67D76 100%); display: none; flex-direction: column; width: 100%; height: 100%; }
        #chatScreen.active { display: flex; }

        .refresh-btn {
            position: absolute; top: 15px; right: 15px; z-index: 10; width: 44px; height: 44px; border-radius: 50%;
            background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.6);
            font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        .messages {
            flex: 1 1 auto; overflow-y: auto; padding: 10px 20px; display: flex; flex-direction: column; gap: 14px;
            margin: 60px auto 0 auto; width: 100%; max-width: 800px; align-items: stretch;
        }

        .msg { max-width: 75%; display: flex; flex-direction: column; position: relative; }
        .msg.sent { align-self: flex-end; align-items: flex-end; }
        .msg.received { align-self: flex-start; align-items: flex-start; }

        .bubble {
            display: inline-block; padding: 14px 20px; border-radius: 22px; font-size: 17px; line-height: 1.5;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12); background: rgba(240,236,245,0.75); backdrop-filter: blur(12px);
            color: #3A3A4A; max-width: 100%; overflow-wrap: break-word; word-break: break-word; border: 1px solid rgba(255,255,255,0.6);
        }
        .sent .bubble { border-bottom-right-radius: 8px; }
        .received .bubble { border-bottom-left-radius: 8px; }

        .name { font-size: 13px; font-weight: 600; margin-bottom: 4px; padding-left: 6px; color: #6A6A7A; }
        .msg-footer { display: flex; align-items: center; gap: 6px; margin-top: 4px; width: 100%; }
        .sent .msg-footer { justify-content: flex-end; }
        .received .msg-footer { justify-content: flex-start; }
        .time { font-size: 11px; color: #4A4A5A; padding: 3px 8px; border-radius: 12px; background: rgba(255,255,255,0.5); }

        .input-area {
            background: rgba(255,255,255,0.8); backdrop-filter: blur(30px); padding: 14px 20px; margin: 0 auto 10px auto;
            display: flex; gap: 12px; align-items: flex-end; border-radius: 35px; border: 1px solid rgba(108,99,255,0.3);
            width: calc(100% - 20px); max-width: 800px;
        }
        .input-area textarea {
            flex: 1; border-radius: 25px; padding: 15px 22px; font-size: 17px; border: 1px solid #D0D0E0;
            background: rgba(255,255,255,0.95); outline: none; resize: none; max-height: 200px;
        }
        .input-area button { width: 52px; height: 52px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #6C63FF, #8B82FF); border: none; flex-shrink: 0; color: white; }
    </style>
</head>
<body>
    <div id="regScreen" class="screen active">
        <div class="box">
            <div class="logo-glass-container">
                <svg viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <filter id="liquidGlassEffect" x="-30%" y="-30%" width="160%" height="160%">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur" />
                            <feOffset dx="0" dy="7" result="offsetBlur" />
                            <feSpecularLighting in="blur" surfaceScale="6" specularConstant="1.3" specularExponent="40" lighting-color="#ffffff" result="specOut">
                                <fePointLight x="-120" y="-140" z="180" />
                            </feSpecularLighting>
                            <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut" />
                            <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litOnOff" />
                            <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#c94a42" flood-opacity="0.35"/>
                        </filter>
                        <linearGradient id="glassSemejka" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFAE96" stop-opacity="1"/>
                            <stop offset="100%" stop-color="#C93D36" stop-opacity="1"/>
                        </linearGradient>
                    </defs>
                    <g filter="url(#liquidGlassEffect)">
                        <text x="200" y="95" font-family="sans-serif" font-weight="900" font-size="56" text-anchor="middle" fill="url(#glassSemejka)">SEMEJKA</text>
                    </g>
                </svg>
            </div>
            <p>Семейный чат для самых близких</p>
            <input type="text" id="nameInput" placeholder="Ваше имя">
            <div id="usernameWrapper" class="username-container">
                <input type="text" id="usernameInput" placeholder="Придумайте тег (напр. @alex)">
            </div>
            <button id="joinBtn">Войти в чат</button>
        </div>
    </div>

    <div id="chatScreen" class="screen">
        <button class="refresh-btn" id="refreshBtn">🔄</button>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <textarea id="msgInput" rows="1" placeholder="Сообщение..."></textarea>
            <button id="sendBtn">▶</button>
        </div>
    </div>

    <script>
        const HF_SPACE_DOMAIN = 'mrkricalo-semejka-plus-chat.hf.space'; 
        const API_URL = `https://${HF_SPACE_DOMAIN}`;
        const WS_PROTOCOL = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        
        let currentUser = null;
        let socket = null;

        const regScreen = document.getElementById('regScreen');
        const chatScreen = document.getElementById('chatScreen');
        const nameInput = document.getElementById('nameInput');
        const usernameInput = document.getElementById('usernameInput'); 
        const joinBtn = document.getElementById('joinBtn');
        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const refreshBtn = document.getElementById('refreshBtn');

        // ИЗМЕНЕНО: Новая логика сборки URL сокета с передачей apikey для нового прокси
        function initRealtime() {
            if (socket) { 
                try { 
                    socket.onclose = null; // Отключаем старый триггер реконнекта перед ручным закрытием
                    socket.close(); 
                } catch(e){} 
            }

            const saved = localStorage.getItem('semejka_user');
            let apikey = "";
            if (saved) {
                try { apikey = JSON.parse(saved).apikey || ""; } catch(e){}
            }

            // Передаем apikey как query-параметр. Новый прокси на httpx перехватит его
            const wsUrl = `${WS_PROTOCOL}//${HF_SPACE_DOMAIN}/ws?apikey=${encodeURIComponent(apikey)}`;
            console.log("Попытка подключения к сокету:", wsUrl);
            
            socket = new WebSocket(wsUrl);

            socket.onopen = () => { 
                console.log('Подключено к новому httpx-прокси Realtime!'); 
            };

            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    // Ловим уведомления от Supabase о системных изменениях в БД
                    if (data.event === "postgres_changes" || data.type === "broadcast") { 
                        loadMessages(); 
                    }
                } catch(e) {}
            };

            socket.onerror = (err) => { 
                console.error('Ошибка в работе сокета:', err); 
            };

            socket.onclose = () => { 
                console.log('Соединение закрыто. Переподключение через 4 секунды...');
                setTimeout(initRealtime, 4000); 
            };
        }

        // Загрузка сообщений через HTTP-прокси
        async function loadMessages() {
            if (!currentUser) return;
            try {
                const res = await fetch(`${API_URL}/messages?order=created_at.asc`, {
                    headers: { 
                        'apikey': currentUser.apikey, 
                        'Authorization': `Bearer ${currentUser.apikey}` 
                    }
                });
                const list = await res.json();
                if (!Array.isArray(list)) return;

                messagesDiv.innerHTML = '';
                list.forEach(m => {
                    const div = document.createElement('div');
                    div.className = 'msg ' + (m.user_id === currentUser.id ? 'sent' : 'received');
                    div.innerHTML = `
                        <div class="name">${m.user_name || 'Пользователь'}</div>
                        <div class="msg-content"><div class="bubble">${m.text}</div></div>
                        <div class="msg-footer"><div class="time">${new Date(m.created_at).toLocaleTimeString()}</div></div>
                    `;
                    messagesDiv.appendChild(div);
                });
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            } catch (err) { 
                console.error("Ошибка обновления сообщений:", err); 
            }
        }

        // Отправка нового сообщения в базу данных
        async function sendMessage() {
            const text = msgInput.value.trim();
            if (!text || !currentUser) return;

            try {
                const res = await fetch(`${API_URL}/messages`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': currentUser.apikey,
                        'Authorization': `Bearer ${currentUser.apikey}`,
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        user_name: currentUser.name,
                        text: text
                    })
                });

                if (res.ok) {
                    msgInput.value = '';
                    await loadMessages(); // Локально обновляем список сразу после отправки
                }
            } catch (err) {
                console.error("Ошибка при отправке:", err);
            }
        }

        async function handleLogin(name, tag, customKey) {
            const payload = { id: Date.now(), name: name, tag: tag, apikey: customKey };
            localStorage.setItem('semejka_user', JSON.stringify(payload));
            currentUser = payload;
            
            regScreen.classList.remove('active');
            chatScreen.classList.add('active');
            
            await loadMessages();
            initRealtime();
        }

        joinBtn.onclick = async () => {
            const name = nameInput.value.trim();
            const tag = usernameInput.value.trim();
            
            // Ваш текущий рабочий anon_key от Supabase
            const defaultKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmc3hmbHNidWV5b3Rpa3NxY25wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MTg1NjM0MDAsImV4cCI6MjAzNDE1OTQwMH0.your-key-here"; 

            if(!name || !tag) return alert('Пожалуйста, заполните все поля!');
            await handleLogin(name, tag, defaultKey);
        };

        sendBtn.onclick = sendMessage;
        msgInput.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
        refreshBtn.onclick = loadMessages;

        // Автоматический вход, если пользователь заходил ранее
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('semejka_user');
            if(saved) {
                try {
                    currentUser = JSON.parse(saved);
                    regScreen.classList.remove('active');
                    chatScreen.classList.add('active');
                    loadMessages();
                    initRealtime();
                } catch(e) { 
                    localStorage.removeItem('semejka_user'); 
                }
            }
        });
    </script>
</body>
</html>
