<html lang="ru">
<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f7ede2; height: 100dvh; height: 100vh; overflow: hidden;
        }

        .screen { display: none; height: 100%; width: 100%; }
        .active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

        #regScreen { padding: 20px; background: #b17046; }
        
        .box {
            background: white; padding: 40px 30px; border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); max-width: 400px; width: 100%;
            text-align: center;
        }

        .title-logo {
            display: block; max-width: 400px; width: 95%; margin: 0 auto 20px;
            border-radius: 20px; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .title-logo img { width: 100%; height: auto; display: block; }

        p { color: #6d4c41; margin-bottom: 25px; font-size: 16px; }
        
        input { 
            width: 100%; padding: 14px 20px; font-size: 16px; 
            border: 2px solid #e0e0e0; border-radius: 12px; 
            margin-bottom: 16px; background: #fbfbfb; outline: none; transition: 0.2s; 
        }
        input:focus { border-color: #b17046; background: white; }

        button { 
            width: 100%; padding: 14px; background: #b17046; 
            color: white; border: none; border-radius: 12px; 
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; 
            box-shadow: 0 4px 12px rgba(177,112,70,0.3);
        }
        button:hover { background: #9c6038; }
        button:disabled { background: #B0B0B0; box-shadow: none; }

        #chatScreen { background: #f7ede2; display: none; flex-direction: column; width: 100%; height: 100%; }
        #chatScreen.active { display: flex; }

        .refresh-btn {
            position: absolute; top: 10px; right: 10px; z-index: 10;
            width: 42px; height: 42px; border-radius: 50%;
            background: white; border: 1px solid #ddd; font-size: 18px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: 0.2s;
        }
        .refresh-btn:hover { background: #f5f5f5; }

        .messages {
            flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
            margin: 0 auto; width: 100%; max-width: 800px; padding-top: 60px;
        }

        .date-separator { display: flex; justify-content: center; margin: 10px 0; width: 100%; }
        .date-separator span { background: #e0d4c8; padding: 4px 12px; border-radius: 12px; font-size: 12px; color: #5d4037; }

        .msg { max-width: 75%; display: flex; flex-direction: column; position: relative; }
        .msg.sent { align-self: flex-end; align-items: flex-end; }
        .msg.received { align-self: flex-start; align-items: flex-start; }
        .msg.animate-in { animation: fadeInUp 0.2s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .msg-content { display: flex; align-items: flex-end; gap: 6px; width: 100%; }
        .sent .msg-content { flex-direction: row-reverse; }
        .received .msg-content { flex-direction: row; }

        .bubble {
            display: inline-block; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.4;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; user-select: none; max-width: 100%;
            overflow-wrap: break-word; word-break: break-word;
        }
        .sent .bubble { background: #b17046; color: white; border-bottom-right-radius: 4px; }
        .received .bubble { background: white; color: #333; border-bottom-left-radius: 4px; border: 1px solid #e0e0e0; }

        .name { font-size: 12px; color: #795548; margin-bottom: 3px; font-weight: bold; padding-left: 4px; }
        
        .msg-footer { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
        .sent .msg-footer { flex-direction: row-reverse; }
        .received .msg-footer { flex-direction: row; }

        .time { font-size: 10px; color: #999; }

        .loading-spinner { display: none; justify-content: center; align-items: center; flex-direction: column; gap: 10px; padding: 20px; color: #795548; font-size: 14px; }
        .loading-spinner.active { display: flex; }
        .spinner-circle { width: 30px; height: 30px; border: 3px solid #e0d4c8; border-top: 3px solid #b17046; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .reactions-container { display: flex; flex-wrap: wrap; gap: 4px; }
        .sent .reactions-container { justify-content: flex-end; }
        .reaction-badge { 
            background: rgba(0,0,0,0.05); border-radius: 10px; padding: 2px 6px; 
            font-size: 11px; display: flex; align-items: center; gap: 3px; cursor: pointer; transition: 0.1s; 
        }
        .reaction-badge:hover { background: rgba(0,0,0,0.1); }
        .reaction-badge.active { background: rgba(177,112,70,0.15); border: 1px solid rgba(177,112,70,0.3); }

        .emoji-panel {
            display: none; position: absolute; bottom: 100%; background: white; border: 1px solid #ddd;
            border-radius: 16px; box-shadow: 0 5px 20px rgba(0,0,0,0.15); padding: 8px; gap: 4px; z-index: 999; margin-bottom: 5px;
            max-width: calc(100vw - 30px); flex-direction: column; align-items: stretch; width: max-content;
        }
        .sent .emoji-panel { left: auto; right: 0; }
        .received .emoji-panel { left: 0; right: auto; }
        .emoji-panel.open { display: flex; }
        
        .search-block { display: flex; justify-content: flex-end; margin-bottom: 2px; }
        .search-toggle { font-size: 14px; cursor: pointer; background: none; border: none; padding: 2px; opacity: 0.6; }
        .search-row { display: none; margin-top: 4px; }
        .search-row.active { display: flex; flex-direction: column; gap: 4px; }
        .emoji-search { width: 100%; padding: 4px 8px; font-size: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        
        .quick-emojis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
        .quick-emojis.hidden { display: none; }
        .emoji-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
        .emoji-option { font-size: 18px; cursor: pointer; transition: transform 0.1s; padding: 2px; }
        .emoji-option:hover { transform: scale(1.2); }

        .input-area {
            padding: 15px; background: white; border-top: 1px solid #e0e0e0;
            display: flex; gap: 10px; align-items: flex-end; width: 100%;
            padding-bottom: calc(15px + env(safe-area-inset-bottom, 0px));
        }
        .input-area-inner { display: flex; gap: 10px; align-items: flex-end; width: 100%; max-width: 800px; margin: 0 auto; }
        
        .input-area textarea {
            flex: 1; border: 1px solid #e0e0e0; border-radius: 12px; padding: 12px; font-size: 15px;
            line-height: 1.4; outline: none; resize: none; overflow-y: auto; max-height: 120px;
            font-family: inherit; background: #fbfbfb;
        }
        .input-area textarea:focus { border-color: #b17046; background: white; }
        
        .input-area button { width: 44px; height: 44px; border-radius: 12px; padding: 0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

        .bubble a { color: #fff; text-decoration: underline; word-break: break-all; }
        .received .bubble a { color: #b17046; }

        @media (max-width: 480px) {
            .messages { padding: 10px; padding-top: 55px; }
            .bubble { font-size: 14px; padding: 10px 14px; }
            .msg { max-width: 85%; }
            .input-area { padding: 10px; }
        }
    </style>
</head>
<body>
    <div id="regScreen" class="screen active">
        <div class="box">

                <img src="https://s10.iimage.su/s/01/th_gbQUgmlxJOC82rwE42zTtHdJvyk5H1YnnJ3AfyWuK.png" alt="SEMEJKA PLUS" onerror="this.style.display='none'">

            <div class="loading-spinner" id="loadingSpinner">
                <div class="spinner-circle"></div>

                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        if ('serviceWorker' in navigator && 'PushManager' in window) {
            window.addEventListener('load', async () => {
                try {
                    const registration = await navigator.serviceWorker.register('/service-worker.js');
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                if (confirm('Доступна новая версия приложения. Обновить сейчас?')) {
                                    window.location.reload();
                                }
                            }
                        });
                    });
                    const permission = await Notification.requestPermission();
                    if (permission === 'granted') {
                        const subscription = await registration.pushManager.subscribe({
                            userVisibleOnly: true,
                            applicationServerKey: urlBase64ToUint8Array('BPOJS8FN1hoVsNOyaUMKk1HdExG2fFgMDmg3mV_C2QBdOTWT6h5RKWfMLy-wedJlJoT2jXnBnfArU8ixOPvE554')
                        });
                        window._pushSubscription = subscription;
                    }
                } catch (err) { console.error('Push setup error:', err); }
            });
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
            return outputArray;
        }

        async function saveSubscription(subscription) {
            if (!currentUser) return;
            const { error } = await _sgClient
                .from('push_subscriptions')
                .upsert({ 
                    user_id: currentUser.id, 
                    subscription: JSON.stringify(subscription) 
                }, { onConflict: 'user_id' });
            if (error) console.error('Push subscription save error:', error);
        }

        const _sgClient = window.supabase.createClient(
            'https://sfsxflsbueyotiksqknp.supabase.co',
            'sb_publishable_32wqroL1fDtPIVwHbvZtIg_5Hipzmdj'
        );

        const regScreen = document.getElementById('regScreen');
        const chatScreen = document.getElementById('chatScreen');
        const nameInput = document.getElementById('nameInput');
        const joinBtn = document.getElementById('joinBtn');
        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');

        let currentUser = null, lastMessageId = null;
        let lastDisplayedDate = null;
        let reactionsCache = {};
        let longPressTimer = null;
        
        let realtimeChannel = null;
        let backupSyncInterval = null;

        function autoResize() {
            msgInput.style.height = 'auto';
            msgInput.style.height = msgInput.scrollHeight + 'px';
        }
        msgInput.addEventListener('input', autoResize);

        function resetTextarea() {
            msgInput.value = '';
            msgInput.style.height = 'auto';
        }

        function logout() {
            localStorage.removeItem('semejka_user');
            if (backupSyncInterval) { clearInterval(backupSyncInterval); backupSyncInterval = null; }
            _sgClient.removeAllChannels();
            currentUser = null; lastMessageId = null; lastDisplayedDate = null; reactionsCache = {};
            regScreen.classList.add('active');
            chatScreen.classList.remove('active');
            nameInput.value = '';
            resetTextarea();
        }

        const EMOJI_LIST = [
            { emoji: '👍', name: 'Нравится' }, { emoji: '❤️', name: 'Люблю' }, { emoji: '😊', name: 'Радость' },
            { emoji: '😢', name: 'Грусть' }, { emoji: '🎉', name: 'Поздравляю' }, { emoji: '🔥', name: 'Огонь' },
            { emoji: '😡', name: 'Злюсь' }, { emoji: '😂', name: 'Смех' }, { emoji: '😮', name: 'Удивлён' },
            { emoji: '😴', name: 'Сонный' }, { emoji: '😎', name: 'Круто' }, { emoji: '🤔', name: 'Задумчивость' },
            { emoji: '😍', name: 'Восхищён' }, { emoji: '👏', name: 'Аплодисменты' }, { emoji: '💪', name: 'Сила' },
            { emoji: '🙏', name: 'Спасибо' }
        ];

        async function loadReactions(messageIds) {
            if (!messageIds.length) return;
            try {
                const url = `https://sfsxflsbueyotiksqknp.supabase.co/rest/v1/reactions?select=*&message_id=in.(${messageIds.join(',')})`;
                const res = await fetch(url, {
                    headers: {
                        'apikey': 'sb_publishable_32wqroL1fDtPIVwHbvZtIg_5Hipzmdj',
                        'Authorization': 'Bearer sb_publishable_32wqroL1fDtPIVwHbvZtIg_5Hipzmdj'
                    }
                });
                if (!res.ok) throw new Error('Network fail');
                const data = await res.json();
                if (data) {
                    data.forEach(r => {
                        if (!reactionsCache[r.message_id]) reactionsCache[r.message_id] = [];
                        if (!reactionsCache[r.message_id].some(ex => ex.id === r.id)) reactionsCache[r.message_id].push(r);
                    });
                    messageIds.forEach(id => updateReactionDisplay(id));
                }
            } catch (err) { console.error('Ошибка загрузки реакций:', err); }
        }

        function updateReactionDisplay(messageId) {
            const msgEl = document.getElementById('msg-' + messageId);
            if (!msgEl) return;
            let container = msgEl.querySelector('.reactions-container');
            if (!container) {
                const footer = msgEl.querySelector('.msg-footer');
                if (!footer) return;
                container = document.createElement('div'); container.className = 'reactions-container';
                footer.appendChild(container);
            }
            const reactions = reactionsCache[messageId] || [];
            const counts = {};
            reactions.forEach(r => counts[r.emoji] = (counts[r.emoji] || 0) + 1);
            const userReaction = reactions.find(r => r.user_id === currentUser?.id);
            container.innerHTML = '';
            Object.entries(counts).forEach(([emoji, count]) => {
                const badge = document.createElement('span');
                badge.className = 'reaction-badge' + (userReaction && userReaction.emoji === emoji ? ' active' : '');
                badge.textContent = emoji + ' ' + count;
                badge.onclick = (e) => { e.stopPropagation(); toggleReaction(messageId, emoji); };
                container.appendChild(badge);
            });
        }

        async function toggleReaction(messageId, emoji) {
            if (!currentUser) return;
            const reactions = reactionsCache[messageId] || [];
            const existing = reactions.find(r => r.user_id === currentUser.id);
            if (existing && existing.emoji === emoji) {
                reactionsCache[messageId] = reactions.filter(r => r.id !== existing.id);
            } else {
                if (existing) reactionsCache[messageId] = reactions.filter(r => r.id !== existing.id);
                reactionsCache[messageId] = [...(reactionsCache[messageId] || []), { id: 'temp-' + Date.now(), message_id: messageId, user_id: currentUser.id, emoji: emoji }];
            }
            updateReactionDisplay(messageId);
            try {
                if (existing) await _sgClient.from('reactions').delete().eq('id', existing.id);
                if (!existing || existing.emoji !== emoji) {
                    const { data, error } = await _sgClient.from('reactions').insert({ message_id: messageId, user_id: currentUser.id, emoji: emoji }).select().single();
                    if (error) throw error;
                    if (data) {
                        reactionsCache[messageId] = reactions.filter(r => r.id !== (existing?.id) && !r.id.toString().startsWith('temp-'));
                        if (!reactionsCache[messageId]) reactionsCache[messageId] = [];
                        if (!reactionsCache[messageId].some(r => r.id === data.id)) reactionsCache[r.message_id].push(data);
                    }
                }
                reactionsCache[messageId] = (reactionsCache[messageId] || []).filter(r => !r.id.toString().startsWith('temp-'));
            } catch (err) { console.error('Ошибка реакции:', err); }
            finally { updateReactionDisplay(messageId); }
        }

        function showEmojiPanel(messageId) {
            const msgEl = document.getElementById('msg-' + messageId);
            if (!msgEl) return;
            document.querySelectorAll('.emoji-panel.open').forEach(p => p.classList.remove('open'));
            let panel = msgEl.querySelector('.emoji-panel');
            if (!panel) {
                panel = document.createElement('div'); panel.className = 'emoji-panel';
                const searchBlock = document.createElement('div'); searchBlock.className = 'search-block';
                const searchToggle = document.createElement('button'); searchToggle.className = 'search-toggle'; searchToggle.innerHTML = '🔍'; searchToggle.title = 'Поиск эмодзи';
                searchBlock.appendChild(searchToggle); panel.appendChild(searchBlock);
                const quickContainer = document.createElement('div'); quickContainer.className = 'quick-emojis';
                EMOJI_LIST.slice(0, 8).forEach(item => {
                    const span = document.createElement('span'); span.className = 'emoji-option'; span.textContent = item.emoji; span.title = item.name;
                    span.onclick = (e) => { e.stopPropagation(); toggleReaction(messageId, item.emoji); panel.classList.remove('open'); };
                    quickContainer.appendChild(span);
                });
                panel.appendChild(quickContainer);
                const searchRow = document.createElement('div'); searchRow.className = 'search-row';
                const searchInput = document.createElement('input'); searchInput.type = 'text'; searchInput.className = 'emoji-search'; searchInput.placeholder = 'Поиск эмодзи...';
                searchInput.addEventListener('mousedown', e => e.stopPropagation());
                searchInput.addEventListener('touchstart', e => e.stopPropagation());
                searchInput.addEventListener('click', e => e.stopPropagation());
                const optionsContainer = document.createElement('div'); optionsContainer.className = 'emoji-options';
                const renderFilteredEmojis = (filterText = '') => {
                    optionsContainer.innerHTML = '';
                    const filtered = EMOJI_LIST.filter(item => item.name.toLowerCase().includes(filterText.toLowerCase()) || item.emoji.includes(filterText));
                    filtered.forEach(item => {
                        const span = document.createElement('span'); span.className = 'emoji-option'; span.textContent = item.emoji; span.title = item.name;
                        span.onclick = (e) => { e.stopPropagation(); toggleReaction(messageId, item.emoji); panel.classList.remove('open'); };
                        optionsContainer.appendChild(span);
                    });
                };
                searchInput.addEventListener('input', () => renderFilteredEmojis(searchInput.value));
                renderFilteredEmojis();
                searchRow.appendChild(searchInput); searchRow.appendChild(optionsContainer); panel.appendChild(searchRow);
                searchToggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isActive = searchRow.classList.contains('active');
                    if (isActive) { searchRow.classList.remove('active'); quickContainer.classList.remove('hidden'); }
                    else { quickContainer.classList.add('hidden'); searchRow.classList.add('active'); searchInput.focus(); }
                });
                panel.addEventListener('mousedown', e => e.stopPropagation());
                panel.addEventListener('touchstart', e => e.stopPropagation());
                msgEl.appendChild(panel);
            } else {
                const quickContainer = panel.querySelector('.quick-emojis');
                const searchRow = panel.querySelector('.search-row');
                const searchInput = panel.querySelector('.emoji-search');
                if (quickContainer) quickContainer.classList.remove('hidden');
                if (searchRow) searchRow.classList.remove('active');
                if (searchInput) searchInput.value = '';
            }
            panel.classList.add('open');
        }
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.emoji-panel') && !e.target.closest('.bubble')) {
                document.querySelectorAll('.emoji-panel.open').forEach(p => p.classList.remove('open'));
            }
        });

        function addLongPressListeners(msgElement, messageId) {
            const bubble = msgElement.querySelector('.bubble');
            if (!bubble) return;
            const startPress = (e) => {
                if (e.target.closest('a')) return;
                longPressTimer = setTimeout(() => showEmojiPanel(messageId), 300);
            };
            const cancelPress = () => { clearTimeout(longPressTimer); };
            bubble.addEventListener('mousedown', startPress);
            bubble.addEventListener('mouseup', cancelPress);
            bubble.addEventListener('mouseleave', cancelPress);
            bubble.addEventListener('touchstart', startPress, { passive: true });
            bubble.addEventListener('touchend', cancelPress);
            bubble.addEventListener('touchcancel', cancelPress);
        }

        function linkify(text) {
            const urlRegex = /(https?:\/\/[^\s<]+)/gi;
            return text.replace(urlRegex, (url) => {
                const safeUrl = url.replace(/"/g, '&quot;');
                return `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${url}</a>`;
            });
        }

        function renderMessage(msg, animate = false) {
            if (document.getElementById('msg-' + msg.id)) return;

            if (msg.id && !msg.id.toString().startsWith('brc-')) {
                const existingElements = Array.from(messagesDiv.querySelectorAll('.msg.sent, .msg.received'));
                const isDuplicate = existingElements.some(el => {
                    const bubble = el.querySelector('.bubble');
                    const nameEl = el.querySelector('.name');
                    const sameText = bubble && bubble.textContent === msg.text;
                    const sameUser = msg.user_id === currentUser?.id ? el.classList.contains('sent') : (nameEl && nameEl.textContent === msg.user_name);
                    
                    if (sameText && sameUser && el.id.startsWith('msg-brc-')) {
                        el.id = 'msg-' + msg.id;
                        addLongPressListeners(el, msg.id);
                        return true;
                    }
                    return false;
                });
                
                if (isDuplicate) return;
            }

            if (msg.id && !msg.id.toString().startsWith('optimistic') && !msg.id.toString().startsWith('brc-')) {
                const currentId = Number(msg.id);
                if (!lastMessageId || currentId > Number(lastMessageId)) {
                    lastMessageId = currentId;
                }
            }
            
            const msgDate = new Date(msg.created_at || Date.now()).toLocaleDateString('ru-RU');
            if (msgDate !== lastDisplayedDate) { insertDateSeparator(msg.created_at || new Date().toISOString()); lastDisplayedDate = msgDate; }

            const div = document.createElement('div');
            div.id = 'msg-' + msg.id;
            div.className = 'msg ' + (msg.user_id === currentUser?.id ? 'sent' : 'received');
            if (msg.created_at) div.dataset.msgDate = msgDate;

            let html = '';
            if (msg.user_id !== currentUser?.id) html += `<div class="name">${escapeHtml(msg.user_name || '')}</div>`;
            html += `<div class="msg-content"><div class="bubble">${linkify(escapeHtml(msg.text || ''))}</div></div>`;
            html += `<div class="msg-footer"><div class="time">${formatTime(msg.created_at || new Date().toISOString())}</div></div>`;

            div.innerHTML = html;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            if (animate) {
                div.classList.add('animate-in');
                div.addEventListener('animationend', () => div.classList.remove('animate-in'), { once: true });
            }

            addLongPressListeners(div, msg.id);
        }

        /* НАДЕЖНЫЙ АЛГОРИТМ СИНХРОНИЗАЦИИ ДЛЯ ПОЛЬЗОВАТЕЛЕЙ БЕЗ ВПН */
        async function syncNewMessagesOnly() {
            if (!currentUser) return;
            try {
                // Всегда запрашиваем последние 40 сообщений из базы (сортировка от новых к старым)
                const url = `https://sfsxflsbueyotiksqknp.supabase.co/rest/v1/messages?select=id,user_id,user_name,text,created_at&order=created_at.desc&limit=40`;
                const res = await fetch(url, {
                    headers: {
                        'apikey': 'sb_publishable_32wqroL1fDtPIVwHbvZtIg_5Hipzmdj',
                        'Authorization': 'Bearer sb_publishable_32wqroL1fDtPIVwHbvZtIg_5Hipzmdj'
                    }
                });
                if (!res.ok) throw new Error('API Sync Fail');
                const data = await res.json();
                
                if (data && data.length > 0) {
                    // Разворачиваем полученную пачку, чтобы они шли от старых к новым для правильной отрисовки
                    const correctOrder = data.reverse();
                    
                    correctOrder.forEach(msg => {
                        // Метод renderMessage автоматически отсечет те, которые уже отрисованы на экране
                        renderMessage(msg, true);
                    });
                    
                    // Обновляем указатель на самое последнее сообщение
                    const newestMsg = correctOrder[correctOrder.length - 1];
                    if (newestMsg && (!lastMessageId || Number(newestMsg.id) > Number(lastMessageId))) {
                        lastMessageId = Number(newestMsg.id);
                    }
                    
                    // Синхронизируем реакции для отображаемых сообщений
                    loadReactions(correctOrder.map(m => m.id));
                }
            } catch (e) {
                console.warn('Пропуск фоновой проверки базы данных:', e.message);
            }
        }

        async function loadMessages() {
            try {
                const url = `https://sfsxflsbueyotiksqknp.supabase.co/rest/v1/messages?select=id,user_id,user_name,text,created_at&order=created_at.asc&limit=50`;
                const res = await fetch(url, {
                    headers: {
                        'apikey': 'sb_publishable_32wqroL1fDtPIVwHbvZtIg_5Hipzmdj',
                        'Authorization': 'Bearer sb_publishable_32wqroL1fDtPIVwHbvZtIg_5Hipzmdj'
                    }
                });
                
                if (!res.ok) throw new Error('Не удалось связаться с сервером истории');
                const data = await res.json();

                if (data) {
                    const children = Array.from(messagesDiv.children);
                    children.forEach(child => { if (child !== loadingSpinner) child.remove(); });
                    
                    lastDisplayedDate = null;
                    lastMessageId = null;

                    data.forEach(msg => renderMessage(msg, false));
                    if (data.length > 0) lastMessageId = Number(data[data.length - 1].id);
                    
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    loadReactions(data.map(m => m.id));
                }
            } catch (e) {
                console.error('Ошибка холодной загрузки истории:', e.message);
                alert('Ошибка сети при загрузке истории. Попробуйте обновить страницу.');
            }
        }

        function subscribeMessages() {
            if (realtimeChannel) {
                _sgClient.removeChannel(realtimeChannel);
            }

            realtimeChannel = _sgClient.channel('chat-room', {
                config: {
                    broadcast: { self: false, ack: true }
                }
            });

            realtimeChannel.on('broadcast', { event: 'shout' }, payload => {
                if (currentUser) {
                    renderMessage(payload.payload, true);
                }
            });

            _sgClient.channel('realtime:reactions')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'reactions' }, () => {
                    const ids = Object.keys(reactionsCache);
                    if (ids.length) loadReactions(ids);
                }).subscribe();

            realtimeChannel.subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                    console.log('Эфир Broadcast успешно подключен!');
                    syncNewMessagesOnly();
                }
                if (status === 'CHANNEL_ERROR' || status === 'CLOSED') {
                    console.log('Сбой канала вещания. Попытка реанимации...');
                    setTimeout(subscribeMessages, 2000);
                }
            });
        }

        async function sendMessage(text) {
            const cleanText = text.trim();
            if (!currentUser || !cleanText) return;
            if (cleanText === '@exit') { logout(); return; }

            sendBtn.disabled = true;
            
            const msgPayload = {
                id: 'brc-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
                user_id: currentUser.id,
                user_name: currentUser.name,
                text: cleanText,
                created_at: new Date().toISOString()
            };

            renderMessage(msgPayload, true);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            resetTextarea();

            if (realtimeChannel && realtimeChannel.state === 'joined') {
                realtimeChannel.send({
                    type: 'broadcast',
                    event: 'shout',
                    payload: msgPayload
                }).then((resp) => {
                    if (resp !== 'ok') console.warn('Broadcast не достучался до серверов, сработает база.');
                });
            }

            try {
                const { data, error } = await _sgClient.from('messages').insert({
                    user_id: currentUser.id, user_name: currentUser.name, text: cleanText
                }).select('id, created_at').single();

                if (!error && data) {
                    const tempEl = document.getElementById('msg-' + msgPayload.id);
                    if (tempEl) {
                        tempEl.id = 'msg-' + data.id;
                        addLongPressListeners(tempEl, data.id);
                        if (!lastMessageId || Number(data.id) > Number(lastMessageId)) {
                            lastMessageId = Number(data.id);
                        }
                    }
                }
            } catch (err) {
                console.error('Ошибка фиксации сообщения в истории:', err.message);
            } finally {
                sendBtn.disabled = false;
                msgInput.focus();
            }
        }

        function startPolling() {
            if (backupSyncInterval) clearInterval(backupSyncInterval);
            backupSyncInterval = setInterval(syncNewMessagesOnly, 4000);
        }

        refreshBtn.addEventListener('click', async () => {
            refreshBtn.style.transform = 'rotate(360deg)';
            refreshBtn.style.transition = 'transform 0.5s ease';
            await syncNewMessagesOnly();
            const ids = Object.keys(reactionsCache);
            if (ids.length) await loadReactions(ids);
            setTimeout(() => { refreshBtn.style.transform = 'none'; refreshBtn.style.transition = 'none'; }, 500);
        });

        ['visibilitychange', 'focus', 'pageshow', 'online'].forEach(evt => {
            window.addEventListener(evt, () => {
                if (currentUser) {
                    syncNewMessagesOnly();
                    subscribeMessages();
                }
            });
        });

        msgInput.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); await sendMessage(msgInput.value); }
        });
        sendBtn.addEventListener('click', async () => { await sendMessage(msgInput.value); });

        const savedUser = localStorage.getItem('semejka_user');
        if (savedUser) { try { nameInput.value = JSON.parse(savedUser).name || ''; } catch(e) {} }

        function formatDateSeparator(dateStr) {
            const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
            const d = new Date(dateStr);
            return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()} г.`;
        }
        function insertDateSeparator(dateString) {
            const sep = document.createElement('div'); sep.className = 'date-separator';
            const svDate = new Date(dateString).toLocaleDateString('sv-SE'); sep.dataset.date = svDate;
            sep.innerHTML = `<span>${formatDateSeparator(dateString)}</span>`;
            messagesDiv.appendChild(sep);
        }

        joinBtn.addEventListener('click', async () => {
            const name = nameInput.value.trim();
            if (!name) return;
            joinBtn.disabled = true; joinBtn.textContent = 'Вход...';

            try {
                const { data: users } = await _sgClient.from('users').select('*').eq('name', name).limit(1);
                let user = users?.[0];
                if (user) {
                    await _sgClient.from('users').update({ last_seen: new Date() }).eq('id', user.id);
                } else {
                    const { data: newUser, error } = await _sgClient.from('users').insert({ name, email: null }).select().single();
                    if (error) throw error;
                    user = newUser;
                }
                currentUser = user;
                localStorage.setItem('semejka_user', JSON.stringify(user));

                regScreen.classList.remove('active');
                chatScreen.classList.add('active');
                loadingSpinner.classList.add('active');
                
                const children = Array.from(messagesDiv.children);
                children.forEach(child => { if (child !== loadingSpinner) child.remove(); });

                loadingSpinner.classList.add('active');
                await loadMessages();
                loadingSpinner.classList.remove('active');
                
                subscribeMessages();
                startPolling(); 
                if (window._pushSubscription) saveSubscription(window._pushSubscription);
                
                msgInput.focus();
                resetTextarea();
            } catch (err) {
                alert('Ошибка входа: ' + err.message);
                regScreen.classList.add('active');
                chatScreen.classList.remove('active');
            } finally {
                joinBtn.disabled = false;
                joinBtn.textContent = 'Войти';
            }
        });

        const saved = localStorage.getItem('semejka_user');
        if (saved) {
            const user = JSON.parse(saved);
            regScreen.classList.remove('active');
            chatScreen.classList.add('active');
            loadingSpinner.classList.add('active');
            _sgClient.from('users').select('*').eq('id', user.id).single().then(async ({ data }) => {
                if (data) {
                    currentUser = data;
                    await loadMessages();
                    loadingSpinner.classList.remove('active');
                    subscribeMessages();
                    startPolling(); 
                } else {
                    localStorage.removeItem('semejka_user');
                    regScreen.classList.add('active');
                    chatScreen.classList.remove('active');
                }
            });
        }

        function formatTime(ts) { const d = new Date(ts); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
        function escapeHtml(text) { const el = document.createElement('div'); el.textContent = text; return el.innerHTML; }
    </script>
</body>
</html>
