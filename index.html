<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SEMEJKA PLUS</title>

    <link rel="icon" type="image/jpeg" href="https://s10.iimage.su/s/09/th_gvMJ97Lx8OAzBYuHL1UHLtuA0yebaDQnB8Uie9Xwd.jpg">
    <meta name="theme-color" content="#6C63FF">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Семейка+">
    <link rel="apple-touch-icon" href="https://s10.iimage.su/s/09/th_gvMJ97Lx8OAzBYuHL1UHLtuA0yebaDQnB8Uie9Xwd.jpg">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
            height: 100dvh; height: 100vh; overflow: hidden;
        }
        .screen { display: none; height: 100%; width: 100%; }
        .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

        #regScreen {
            background: linear-gradient(180deg, #FEE0B7 0%, #FDD299 33%, #EB8680 66%, #E67D76 100%);
            padding: 20px;
        }
        .box {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-radius: 40px; padding: 45px 35px; max-width: 420px; width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1), inset 0 0 0 1px rgba(255,255,255,0.6);
            text-align: center; border: 1px solid rgba(255,255,255,0.5);
        }

        .logo-glass-container {
            width: 100%;
            max-width: 320px;
            margin: 0 auto 20px auto;
            user-select: none;
        }
        .logo-glass-container svg { width: 100%; height: auto; display: block; }

        p { color: #635857; margin-bottom: 35px; font-size: 17px; font-weight: 600; opacity: 0.85; }
        input { width: 100%; padding: 18px 24px; font-size: 18px; border: 1px solid rgba(255,255,255,0.8); border-radius: 25px; margin-bottom: 20px; background: rgba(255,255,255,0.5); outline: none; transition: 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.05); color: #3A3A4A; }
        input:focus { border-color: #6C63FF; background: rgba(255,255,255,0.8); box-shadow: 0 0 0 4px rgba(108,99,255,0.2), 0 5px 15px rgba(0,0,0,0.1); }
        button { width: 100%; padding: 18px; background: linear-gradient(135deg, #6C63FF, #8B82FF); color: white; border: none; border-radius: 25px; font-size: 20px; font-weight: 700; cursor: pointer; transition: 0.2s; box-shadow: 0 10px 25px rgba(108,99,255,0.4); }
        button:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(108,99,255,0.5); }
        button:disabled { background: #B0B0B0; box-shadow: none; transform: none; }

        #chatScreen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, #FEE0B7 0%, #FDD299 33%, #EB8680 66%, #E67D76 100%); display: none; flex-direction: column; width: 100%; height: 100%; }
        #chatScreen.active { display: flex; }

        .messages {
            flex: 1 1 auto; overflow-y: auto; padding: 10px 20px;
            display: flex; flex-direction: column; gap: 14px;
            margin: 20px auto 0 auto; width: 100%; max-width: 800px; align-items: stretch;
        }

        .date-separator { display: flex; justify-content: center; align-items: center; margin: 10px 0; width: 100%; }
        .date-separator span { background: rgba(255,255,255,0.5); padding: 6px 18px; border-radius: 15px; font-size: 13px; color: #5A5A6A; border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 2px 6px rgba(0,0,0,0.05); white-space: nowrap; }

        .msg { max-width: 75%; display: flex; flex-direction: column; position: relative; }
        .msg.sent { align-self: flex-end; align-items: flex-end; }
        .msg.received { align-self: flex-start; align-items: flex-start; }
        .msg.animate-in { animation: fadeInUp 0.3s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .msg-content { display: flex; align-items: flex-end; gap: 6px; width: 100%; }
        .sent .msg-content { flex-direction: row-reverse; }
        .received .msg-content { flex-direction: row; }

        .bubble {
            display: inline-block; padding: 14px 20px; border-radius: 22px; font-size: 17px; line-height: 1.5; word-wrap: break-word;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12); background: rgba(240,236,245,0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            color: #3A3A4A; max-width: 100%; overflow-wrap: break-word; word-break: break-word; border: 1px solid rgba(255,255,255,0.6);
        }
        .sent .bubble { border-bottom-right-radius: 8px; }
        .received .bubble { border-bottom-left-radius: 8px; }

        .name { font-size: 13px; font-weight: 600; margin-bottom: 4px; padding-left: 6px; color: #6A6A7A; }
        .sent .name { display: none; }
        .msg-footer { display: flex; align-items: center; gap: 8px; margin-top: 4px; width: 100%; }
        .sent .msg-footer { flex-direction: row-reverse; }
        .received .msg-footer { flex-direction: row; }

        .time { font-size: 11px; color: #4A4A5A; padding: 3px 8px; display: inline-block; border-radius: 12px; background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 2px 6px rgba(0,0,0,0.08); white-space: nowrap; }

        .loading-spinner { display: none; justify-content: center; align-items: center; flex-direction: column; gap: 12px; padding: 40px; color: #6C63FF; font-size: 16px; width: 100%; }
        .loading-spinner.active { display: flex; }
        .spinner-circle { width: 40px; height: 40px; border: 4px solid rgba(108,99,255,0.2); border-top: 4px solid #6C63FF; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .input-area {
            background: rgba(255,255,255,0.8); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); padding: 14px 20px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); margin: 0 auto 10px auto; display: flex; gap: 12px; align-items: flex-end; border-radius: 35px; box-shadow: 0 -5px 25px rgba(0,0,0,0.1), inset 0 0 0 1px rgba(255,255,255,0.8); border: 1px solid rgba(108,99,255,0.3); width: calc(100% - 20px); max-width: 800px;
        }
        .input-area textarea {
            flex: 1; margin: 0; border-radius: 25px; padding: 15px 22px; font-size: 17px; line-height: 1.4; border: 1px solid #D0D0E0; background: rgba(255,255,255,0.95); outline: none; transition: 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.08); resize: none; overflow-y: auto; font-family: inherit; min-height: 52px; max-height: 200px; max-width: 100%; word-wrap: break-word; word-break: break-word;
        }
        .input-area textarea::-webkit-scrollbar { display: none; }
        .input-area textarea:focus { border-color: #6C63FF; background: #FFFFFF; box-shadow: 0 0 0 4px rgba(108,99,255,0.2), 0 2px 8px rgba(0,0,0,0.1); }
        .input-area button { width: 52px; height: 52px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #6C63FF, #8B82FF); box-shadow: 0 10px 20px rgba(108,99,255,0.4); border: none; flex-shrink: 0; }
        .input-area button:hover { transform: scale(1.05); }

        .bubble a { color: #6C63FF; text-decoration: underline; word-break: break-all; }
        .bubble a:hover { color: #4A42D0; }

        @media (max-width: 480px) {
            .messages { padding: 5px 10px; gap: 10px; }
            .bubble { font-size: 15px; padding: 10px 14px; }
            .msg { max-width: 85%; }
        }
    </style>
</head>
<body>
    <div id="regScreen" class="screen active">
        <div class="box">
            <div class="logo-glass-container">
                <svg viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <filter id="liquidGlassEffect" x="-30%" y="-30%" width="160%" height="160%">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur" />
                            <feOffset dx="0" dy="7" result="offsetBlur" />
                            <feSpecularLighting in="blur" surfaceScale="6" specularConstant="1.3" specularExponent="40" lighting-color="#ffffff" result="specOut">
                                <fePointLight x="-120" y="-140" z="180" />
                            </feSpecularLighting>
                            <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut" />
                            <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litOnOff" />
                            <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#c94a42" flood-opacity="0.35"/>
                        </filter>
                        <linearGradient id="glassSemejka" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFAE96" />
                            <stop offset="45%" stop-color="#F2796D" />
                            <stop offset="100%" stop-color="#C93D36" />
                        </linearGradient>
                        <linearGradient id="glassPlus" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFAA85" />
                            <stop offset="50%" stop-color="#ED5D52" />
                            <stop offset="100%" stop-color="#A61C17" />
                        </linearGradient>
                    </defs>
                    <g filter="url(#liquidGlassEffect)">
                        <text x="200" y="65" font-family="'Arial Rounded MT Bold', 'Comic Sans MS', system-ui, sans-serif" font-weight="900" font-size="56" text-anchor="middle" letter-spacing="3" fill="url(#glassSemejka)">SEMEJKA</text>
                        <text x="200" y="138" font-family="'Arial Rounded MT Bold', 'Comic Sans MS', system-ui, sans-serif" font-weight="900" font-size="62" text-anchor="middle" letter-spacing="4" fill="url(#glassPlus)">PLUS</text>
                    </g>
                </svg>
            </div>
            <p>Семейный чат для самых близких</p>
            <input type="text" id="nameInput" placeholder="Ваше имя">
            <button id="joinBtn">Войти</button>
        </div>
    </div>

    <div id="chatScreen" class="screen">
        <div class="messages" id="messages">
            <div class="loading-spinner" id="loadingSpinner">
                <div class="spinner-circle"></div>
                <span>Загрузка сообщений...</span>
            </div>
        </div>
        <div class="input-area">
            <textarea id="msgInput" rows="1" placeholder="Сообщение..."></textarea>
            <button id="sendBtn">
                <svg width="20" height="20" viewBox="0 0 24 24"><path d="M2 21L23 12L2 3V10L17 12L2 14V21Z" fill="currentColor"/></svg>
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Твой личный конфиг Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAlt7Q4ZjhSM9M3gytNk1UA6XHPROtz7eQ",
            authDomain: "semejka-plus.firebaseapp.com",
            projectId: "semejka-plus",
            storageBucket: "semejka-plus.firebasestorage.app",
            messagingSenderId: "400648498300",
            appId: "1:400648498300:web:b4fe58d33a2d66d5c72df9",
            measurementId: "G-NBG9WYCM1J"
        };

        // Инициализируем Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const regScreen = document.getElementById('regScreen');
        const chatScreen = document.getElementById('chatScreen');
        const nameInput = document.getElementById('nameInput');
        const joinBtn = document.getElementById('joinBtn');
        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');

        let currentUser = null;
        let lastDisplayedDate = null;

        function autoResize() {
            msgInput.style.height = 'auto';
            const scrollHeight = msgInput.scrollHeight;
            msgInput.style.height = (scrollHeight > 200 ? 200 : scrollHeight) + 'px';
            msgInput.style.overflowY = scrollHeight > 200 ? 'auto' : 'hidden';
        }
        msgInput.addEventListener('input', autoResize);

        function resetTextarea() {
            msgInput.value = '';
            msgInput.style.height = 'auto';
            msgInput.style.overflowY = 'hidden';
        }

        function linkify(text) {
            const urlRegex = /(https?:\/\/[^\s<]+)/gi;
            return text.replace(urlRegex, (url) => `<a href="${url.replace(/"/g, '&quot;')}" target="_blank" rel="noopener noreferrer">${url}</a>`);
        }

        function renderMessage(msg) {
            if (document.getElementById('msg-' + msg.id)) return;
            
            const timestamp = msg.created_at ? msg.created_at.toDate() : new Date();
            const msgDate = timestamp.toLocaleDateString('ru-RU');
            
            if (msgDate !== lastDisplayedDate) { 
                insertDateSeparator(timestamp.toISOString()); 
                lastDisplayedDate = msgDate; 
            }

            const div = document.createElement('div');
            div.id = 'msg-' + msg.id; 
            div.className = 'msg ' + (msg.user_id === currentUser?.id ? 'sent' : 'received');

            let html = '';
            if (msg.user_id !== currentUser?.id) {
                html += `<div class="name">${escapeHtml(msg.user_name || '')}</div>`;
            }
            html += `<div class="msg-content"><div class="bubble">${linkify(escapeHtml(msg.text || ''))}</div></div>`;
            html += `<div class="msg-footer"><div class="time">${formatTime(timestamp)}</div></div>`;

            div.innerHTML = html; 
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Подписка на сообщения в реальном времени
        function startLiveChat() {
            loadingSpinner.classList.add('active');
            const q = query(collection(db, "messages"), orderBy("created_at", "asc"));
            
            onSnapshot(q, (snapshot) => {
                loadingSpinner.classList.remove('active');
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const data = change.doc.data();
                        renderMessage({ id: change.doc.id, ...data });
                    }
                });
            }, (error) => {
                console.error("Ошибка получения данных: ", error);
            });
        }

        async function sendMessage() {
            const text = msgInput.value.trim();
            if (!currentUser || !text) return;

            sendBtn.disabled = true;
            resetTextarea();

            try {
                await addDoc(collection(db, "messages"), {
                    user_id: currentUser.id,
                    user_name: currentUser.name,
                    text: text,
                    created_at: serverTimestamp()
                });
            } catch (err) {
                console.error('Ошибка сохранения сообщения:', err);
            } finally {
                sendBtn.disabled = false; 
                msgInput.focus();
            }
        }

        msgInput.addEventListener('keypress', async (e) => { 
            if (e.key === 'Enter' && !e.shiftKey) { 
                e.preventDefault(); 
                await sendMessage(); 
            } 
        });
        sendBtn.addEventListener('click', sendMessage);

        joinBtn.addEventListener('click', () => {
            const name = nameInput.value.trim();
            if (!name) return;

            localStorage.setItem('semejka_username', name);

            let userId = localStorage.getItem('semejka_uid');
            if (!userId) {
                userId = 'user_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('semejka_uid', userId);
            }

            currentUser = { id: userId, name: name };
            
            regScreen.classList.remove('active');
            chatScreen.classList.add('active');

            startLiveChat();
        });

        const savedName = localStorage.getItem('semejka_username');
        if (savedName) nameInput.value = savedName;

        function formatDateSeparator(dateStr) {
            const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
            const d = new Date(dateStr); 
            return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()} г.`; 
        }
        function insertDateSeparator(dateString) {
            const sep = document.createElement('div'); 
            sep.className = 'date-separator';
            sep.innerHTML = `<span>${formatDateSeparator(dateString)}</span>`; 
            messagesDiv.appendChild(sep); 
        }
        function formatTime(dateObj) { 
            return dateObj.getHours().toString().padStart(2,'0') + ':' + dateObj.getMinutes().toString().padStart(2,'0'); 
        } 
        function escapeHtml(text) { 
            const el = document.createElement('div'); 
            el.textContent = text; 
            return el.innerHTML; 
        } 
    </script>
</body>
</html>
