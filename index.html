<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SEMEJKA PLUS</title>

    <link rel="icon" type="image/jpeg" href="https://s10.iimage.su/s/09/th_gvMJ97Lx8OAzBYuHL1UHLtuA0yebaDQnB8Uie9Xwd.jpg">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6C63FF">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Семейка+">
    <link rel="apple-touch-icon" href="https://s10.iimage.su/s/09/th_gvMJ97Lx8OAzBYuHL1UHLtuA0yebaDQnB8Uie9Xwd.jpg">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
            height: 100vh; overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .screen { display: none; height: 100%; width: 100%; position: relative; }
        .screen.active { display: flex; flex-direction: column; }

        #regScreen {
            background: linear-gradient(180deg, #FEE0B7 0%, #FDD299 33%, #EB8680 66%, #E67D76 100%);
            align-items: center; justify-content: center; padding: 20px;
        }
        .box {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-radius: 40px; padding: 45px 35px; max-width: 420px; width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1), inset 0 0 0 1px rgba(255,255,255,0.6);
            text-align: center; border: 1px solid rgba(255,255,255,0.5);
        }

        .logo-glass-container { width: 100%; max-width: 320px; margin: 0 auto 20px auto; user-select: none; }
        .logo-glass-container svg { width: 100%; height: auto; display: block; }
        p { color: #635857; margin-bottom: 25px; font-size: 17px; font-weight: 600; opacity: 0.85; }
        input { width: 100%; padding: 18px 24px; font-size: 18px; border: 1px solid rgba(255,255,255,0.8); border-radius: 25px; margin-bottom: 20px; background: rgba(255,255,255,0.5); outline: none; transition: 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.05); color: #3A3A4A; }
        input:focus { border-color: #6C63FF; background: rgba(255,255,255,0.8); box-shadow: 0 0 0 4px rgba(108,99,255,0.2), 0 5px 15px rgba(0,0,0,0.1); }
        button { width: 100%; padding: 18px; background: linear-gradient(135deg, #6C63FF, #8B82FF); color: white; border: none; border-radius: 25px; font-size: 20px; font-weight: 700; cursor: pointer; transition: 0.2s; box-shadow: 0 10px 25px rgba(108,99,255,0.4); }
        button:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(108,99,255,0.5); }
        button:disabled { background: #B0B0C0; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

        #chatScreen { background: #fdfaf6; height: 100%; width: 100%; }
        .chat-header { height: 64px; background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0,0,0,0.06); display: flex; align-items: center; padding: 0 20px; position: absolute; top:0; left:0; right:0; z-index:10; }
        .chat-title { font-size: 20px; font-weight: 800; color: #3A3A4A; letter-spacing: -0.5px; }
        
        .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; margin-top: 64px; margin-bottom: 80px; width: 100%; max-width: 800px; margin-left: auto; margin-right: auto; }
        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }

        .date-separator { align-self: center; margin: 10px 0; font-size: 13px; font-weight: 700; color: #8A8A9A; background: rgba(0,0,0,0.04); padding: 4px 14px; border-radius: 12px; }

        .msg { max-width: 75%; display: flex; flex-direction: column; position: relative; opacity: 0; transform: translateY(10px); animation: msgIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes msgIn { to { opacity: 1; transform: translateY(0); } }
        .msg.sent { align-self: flex-end; align-items: flex-end; }
        .msg.received { align-self: flex-start; align-items: flex-start; }

        .bubble { display: inline-block; padding: 14px 20px; border-radius: 22px; font-size: 17px; line-height: 1.5; box-shadow: 0 4px 14px rgba(0,0,0,0.04); position: relative; transition: background 0.2s; user-select: none; -webkit-user-select: none; max-width: 100%; overflow-wrap: break-word; word-break: break-word; }
        .sent .bubble { background: linear-gradient(135deg, #6C63FF, #8B82FF); color: white; border-bottom-right-radius: 6px; }
        .received .bubble { background: #FFFFFF; color: #3A3A4A; border-bottom-left-radius: 6px; border: 1px solid rgba(0,0,0,0.04); }
        .msg.context-active .bubble { background: #E0E0FF !important; color: #3A3A4A !important; }

        .name { font-size: 13px; font-weight: 600; margin-bottom: 4px; padding-left: 6px; color: #8A8A9A; }
        .msg-footer { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
        .time { font-size: 11px; color: #A0A0B0; }
        .status-icon { font-size: 11px; color: #A0A0B0; display: flex; align-items: center; }
        .sent .status-icon { color: rgba(255,255,255,0.7); position: absolute; right: 15px; bottom: 5px; font-size: 10px; }
        .sent .time { color: rgba(255,255,255,0.7); position: absolute; right: 32px; bottom: 5px; font-size: 10px; }
        .sent .bubble { padding-bottom: 22px; }

        .input-area { background: rgba(255,255,255,0.85); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-top: 1px solid rgba(0,0,0,0.05); padding: 14px 20px; position: absolute; bottom: 0; left: 0; right: 0; display: flex; gap: 12px; align-items: flex-end; z-index: 10; }
        .input-container { flex: 1; background: #F2F2F7; border-radius: 25px; padding: 4px 6px; display: flex; align-items: flex-end; border: 1px solid transparent; transition: 0.2s; }
        .input-container:focus-within { background: #FFFFFF; border-color: rgba(108,99,255,0.4); box-shadow: 0 0 0 4px rgba(108,99,255,0.1); }
        
        textarea { flex: 1; border: none; background: transparent; padding: 10px 14px; font-family: inherit; font-size: 17px; outline: none; resize: none; max-height: 120px; min-height: 40px; color: #3A3A4A; line-height: 1.3; }
        
        .send-btn { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #6C63FF, #8B82FF); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; flex-shrink: 0; margin-bottom: 2px; box-shadow: 0 4px 10px rgba(108,99,255,0.3); }
        .send-btn:hover { transform: scale(1.05); }
        .send-btn svg { width: 18px; height: 18px; fill: white; margin-left: 2px; }
        .send-btn:disabled { background: #E5E5EA; box-shadow: none; cursor: not-allowed; transform: none; }
        .send-btn:disabled svg { fill: #D1D1D6; }

        .spinner { display: none; align-self: center; margin: 15px 0; width: 28px; height: 28px; border: 3px solid rgba(108,99,255,0.1); border-top-color: #6C63FF; border-radius: 50%; animation: spin 0.8s linear infinite; }
        .spinner.active { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .context-menu { position: fixed; background: rgba(255,255,255,0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.5); border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.12), 0 5px 15px rgba(0,0,0,0.05); z-index: 1000; display: none; padding: 6px; min-width: 160px; transform: scale(0.9); opacity: 0; transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.15s; pointer-events: none; }
        .context-menu.active { display: block; transform: scale(1); opacity: 1; pointer-events: auto; }
        .context-item { padding: 12px 16px; font-size: 16px; font-weight: 600; color: #3A3A4A; cursor: pointer; border-radius: 14px; display: flex; align-items: center; justify-content: space-between; transition: 0.15s; }
        .context-item:hover { background: rgba(0,0,0,0.05); }
        .context-item.delete { color: #FF3B30; }
        .context-item.delete:hover { background: rgba(255,59,48,0.08); }

        .context-overlay { position: fixed; top:0; left:0; right:0; bottom:0; z-index: 999; display: none; background: rgba(0,0,0,0.02); }
        .context-overlay.active { display: block; }
    </style>
</head>
<body>

    <div id="regScreen" class="screen active">
        <div class="box">
            <div class="logo-glass-container">
                <svg viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <filter id="liquidGlassEffect" x="-30%" y="-30%" width="160%" height="160%">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur" />
                            <feOffset dx="0" dy="7" result="offsetBlur" />
                            <feSpecularLighting in="blur" surfaceScale="6" specularConstant="1.3" specularExponent="40" lighting-color="#ffffff" result="specOut">
                                <fePointLight x="-120" y="-140" z="180" />
                            </feSpecularLighting>
                            <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut" />
                            <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litOnOff" />
                            <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#c94a42" flood-opacity="0.35"/>
                        </filter>
                        <linearGradient id="glassSemejka" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFAE96" stop-opacity="1"/>
                            <stop offset="100%" stop-color="#C93D36" stop-opacity="1"/>
                        </linearGradient>
                    </defs>
                    <g filter="url(#liquidGlassEffect)">
                        <text x="200" y="95" font-family="sans-serif" font-weight="900" font-size="56" text-anchor="middle" fill="url(#glassSemejka)">SEMEJKA</text>
                    </g>
                </svg>
            </div>
            <p>Семейный чат для самых близких</p>
            <input type="text" id="nameInput" placeholder="Ваше имя" autocomplete="off">
            <button id="joinBtn">Войти</button>
        </div>
    </div>

    <div id="chatScreen" class="screen">
        <div class="chat-header">
            <div class="chat-title">Семейка+</div>
        </div>
        <div class="messages" id="messages">
            <div id="loadingSpinner" class="spinner"></div>
        </div>
        <div class="input-area">
            <div class="input-container">
                <textarea id="msgInput" rows="1" placeholder="Сообщение"></textarea>
            </div>
            <button class="send-btn" id="sendBtn" disabled>
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <div class="context-overlay" id="contextOverlay"></div>
    <div class="context-menu" id="contextMenu">
        <div class="context-item delete" id="ctxDelete">Удалить</div>
    </div>

    <script>
        // ИЗМЕНЕНА СТРОГО ЭТА СТРОЧКА:
        const HF_SPACE_DOMAIN = 'mrkricalo-semejka-proxy.hf.space'; 
        
        const API_URL = `https://${HF_SPACE_DOMAIN}/api`;
        const WS_URL = `wss://${HF_SPACE_DOMAIN}/ws`;

        let currentUser = null;
        let ws = null;
        let lastDisplayedDate = null;
        let activeMenuMessageId = null;
        let activeMenuElement = null;

        const regScreen = document.getElementById('regScreen');
        const chatScreen = document.getElementById('chatScreen');
        const nameInput = document.getElementById('nameInput');
        const joinBtn = document.getElementById('joinBtn');
        const messagesDiv = document.getElementById('messages');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const contextMenu = document.getElementById('contextMenu');
        const contextOverlay = document.getElementById('contextOverlay');
        const ctxDelete = document.getElementById('ctxDelete');

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js').catch(err => console.error(err));
            });
        }

        async function loadMessages() {
            try {
                const response = await fetch(`${API_URL}/messages`);
                if (!response.ok) throw new Error('Ошибка сети');
                const data = await response.json();
                
                const children = Array.from(messagesDiv.children);
                children.forEach(c => { if (c !== loadingSpinner) c.remove(); });
                lastDisplayedDate = null;
                
                data.forEach(msg => renderMessage(msg, false));
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            } catch (e) { console.error(e); } finally { loadingSpinner.classList.remove('active'); }
        }

        function connectWebSocket() {
            if (ws) { ws.close(); }
            ws = new WebSocket(WS_URL);

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'new_message') {
                    renderMessage(msg.data, false);
                } else if (msg.type === 'delete_message') {
                    const el = document.getElementById('msg-' + msg.id);
                    if (el) el.remove();
                }
            };

            ws.onclose = () => { setTimeout(connectWebSocket, 3000); };
        }

        async function sendMessage(text) {
            const cleanText = text.trim();
            if (!currentUser || !cleanText) return;
            if (cleanText === '@exit') { logout(); return; }

            sendBtn.disabled = true;
            const tempTimestamp = Date.now().toString();
            
            const localPayload = {
                id: 'brc-' + tempTimestamp, user_id: currentUser.id, user_name: currentUser.name, text: cleanText, created_at: new Date().toISOString()
            };
            renderMessage(localPayload, true);
            resetTextarea();

            try {
                const response = await fetch(`${API_URL}/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        user_name: currentUser.name,
                        text: cleanText
                    })
                });

                if (!response.ok) throw new Error('Не удалось отправить');
                const realMsg = await response.json();

                const createdEl = document.getElementById('msg-brc-' + tempTimestamp);
                if (createdEl && realMsg) {
                    createdEl.id = 'msg-' + realMsg.id;
                    const statusIcon = createdEl.querySelector('.status-icon');
                    if (statusIcon) statusIcon.textContent = '✓';
                    addLongPressListeners(createdEl, realMsg.id);
                }
            } catch (err) { console.error(err); } finally { sendBtn.disabled = false; msgInput.focus(); }
        }

        async function deleteMessageFromServer(id) {
            try {
                const response = await fetch(`${API_URL}/messages/${id}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Не удалось удалить');
                const el = document.getElementById('msg-' + id);
                if (el) el.remove();
            } catch (err) { console.error(err); }
        }

        function renderMessage(msg, isLocalOptimistic) {
            const msgDate = new Date(msg.created_at).toDateString();
            if (msgDate !== lastDisplayedDate) {
                insertDateSeparator(msg.created_at);
                lastDisplayedDate = msgDate;
            }

            const isMe = msg.user_id === currentUser.id;
            const div = document.createElement('div');
            div.id = 'msg-' + msg.id;
            div.className = `msg ${isMe ? 'sent' : 'received'}`;

            let nameHtml = isMe ? '' : `<div class="name">${escapeHtml(msg.user_name)}</div>`;
            let statusHtml = isMe ? `<span class="status-icon">${isLocalOptimistic ? '...' : '✓'}</span>` : '';

            div.innerHTML = `
                ${nameHtml}
                <div class="bubble">
                    ${escapeHtml(msg.text)}
                    <div class="msg-footer">
                        <span class="time">${formatTime(msg.created_at)}</span>
                        ${statusHtml}
                    </div>
                </div>
            `;

            messagesDiv.appendChild(div);
            if (!isLocalOptimistic) { addLongPressListeners(div, msg.id); }
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addLongPressListeners(element, messageId) {
            let pressTimer;
            const start = (e) => {
                if (e.type === 'click' && e.button !== 0) return;
                element.classList.add('context-active');
                pressTimer = setTimeout(() => { showContextMenu(e, messageId, element); }, 600);
            };
            const cancel = () => {
                clearTimeout(pressTimer);
                if (!contextMenu.classList.contains('active')) { element.classList.remove('context-active'); }
            };
            element.addEventListener('mousedown', start);
            element.addEventListener('touchstart', start, { passive: true });
            element.addEventListener('click', cancel);
            element.addEventListener('mouseout', cancel);
            element.addEventListener('touchend', cancel);
            element.addEventListener('touchmove', cancel);
        }

        function showContextMenu(e, messageId, element) {
            activeMenuMessageId = messageId;
            activeMenuElement = element;
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            contextMenu.style.left = `${Math.min(clientX, window.innerWidth - 180)}px`;
            contextMenu.style.top = `${Math.min(clientY, window.innerHeight - 80)}px`;
            contextMenu.classList.add('active');
            contextOverlay.classList.add('active');
            if(e.cancelable) e.preventDefault();
        }

        function hideContextMenu() {
            contextMenu.classList.remove('active');
            contextOverlay.classList.remove('active');
            if (activeMenuElement) { activeMenuElement.classList.remove('context-active'); activeMenuElement = null; }
            activeMenuMessageId = null;
        }

        contextOverlay.onclick = hideContextMenu;
        ctxDelete.onclick = async () => {
            if (activeMenuMessageId) {
                const id = activeMenuMessageId; hideContextMenu(); await deleteMessageFromServer(id);
            }
        };

        function logout() {
            localStorage.removeItem('semejka_user'); currentUser = null;
            chatScreen.classList.remove('active'); regScreen.classList.add('active');
            if (ws) ws.close();
        }

        joinBtn.addEventListener('click', async () => {
            const name = nameInput.value.trim();
            if (!name) return;
            joinBtn.disabled = true; joinBtn.textContent = 'Вход...';

            try {
                const response = await fetch(`${API_URL}/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name })
                });
                if (!response.ok) throw new Error('Ошибка регистрации');
                const user = await response.json();

                currentUser = user;
                localStorage.setItem('semejka_user', JSON.stringify(user));

                regScreen.classList.remove('active');
                chatScreen.classList.add('active');
                loadingSpinner.classList.add('active');

                await loadMessages();
                connectWebSocket();
            } catch (err) { 
                alert('Ошибка входа: ' + err.message); 
            } finally { 
                joinBtn.disabled = false; joinBtn.textContent = 'Войти'; 
            }
        });

        msgInput.addEventListener('input', () => {
            msgInput.style.height = 'auto'; msgInput.style.height = msgInput.scrollHeight + 'px';
            sendBtn.disabled = !msgInput.value.trim();
        });

        function resetTextarea() {
            msgInput.value = ''; msgInput.style.height = '40px'; sendBtn.disabled = true;
        }

        sendBtn.onclick = () => sendMessage(msgInput.value);
        msgInput.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(msgInput.value); } };

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('semejka_user');
            if (saved) {
                try {
                    currentUser = JSON.parse(saved);
                    regScreen.classList.remove('active');
                    chatScreen.classList.add('active');
                    loadingSpinner.classList.add('active');
                    loadMessages();
                    connectWebSocket();
                } catch (e) { localStorage.removeItem('semejka_user'); }
            }
        });

        function formatDateSeparator(dateStr) {
            const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
            const d = new Date(dateStr); return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()} г.`;
        }
        function insertDateSeparator(dateString) {
            const sep = document.createElement('div'); sep.className = 'date-separator';
            sep.innerHTML = `<span>${formatDateSeparator(dateString)}</span>`; messagesDiv.appendChild(sep);
        }
        function formatTime(ts) { const d = new Date(ts); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
        function escapeHtml(text) { const el = document.createElement('div'); el.textContent = text; return el.innerHTML; }
    </script>
</body>
</html>
