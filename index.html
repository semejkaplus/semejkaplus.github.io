<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SEMEJKA PLUS</title>

    <link rel="icon" type="image/jpeg" href="https://s10.iimage.su/s/09/th_gvMJ97Lx8OAzBYuHL1UHLtuA0yebaDQnB8Uie9Xwd.jpg">
    <link rel="manifest" href="/manifest.json?v=2">
    <meta name="theme-color" content="#6C63FF">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Семейка+">
    <link rel="apple-touch-icon" href="https://s10.iimage.su/s/09/th_gvMJ97Lx8OAzBYuHL1UHLtuA0yebaDQnB8Uie9Xwd.jpg">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(180deg, #FEE0B7 0%, #FDD299 33%, #EB8680 66%, #E67D76 100%);
            height: 100dvh; height: 100vh; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .screen { display: none; height: 100%; width: 100%; }
        .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

        #regScreen { padding: 20px; }
        .box {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-radius: 40px; padding: 40px 30px; max-width: 410px; width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1), inset 0 0 0 1px rgba(255,255,255,0.6);
            text-align: center; border: 1px solid rgba(255,255,255,0.5);
        }

        /* === НАСТОЯЩИЙ ЦИФРОВОЙ 3D-АРТ (МАТЕМАТИЧЕСКИЙ НАДУВНОЙ ЭФФЕКТ) === */
        .logo-3d-wrapper {
            width: 100%;
            max-width: 340px;
            margin: 0 auto 20px auto;
            user-select: none;
        }
        .logo-3d-wrapper svg {
            width: 100%;
            height: auto;
            display: block;
        }

        p { color: #5F5251; margin-bottom: 30px; font-size: 17px; font-weight: 600; opacity: 0.9; }
        input { width: 100%; padding: 18px 24px; font-size: 18px; border: 1px solid rgba(255,255,255,0.8); border-radius: 25px; margin-bottom: 20px; background: rgba(255,255,255,0.6); outline: none; transition: 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.03); color: #2A2A3A; }
        input:focus { border-color: #6C63FF; background: rgba(255,255,255,0.9); box-shadow: 0 0 0 4px rgba(108,99,255,0.2); }
        
        button { width: 100%; padding: 18px; background: linear-gradient(135deg, #6C63FF, #8B82FF); color: white; border: none; border-radius: 25px; font-size: 20px; font-weight: 700; cursor: pointer; transition: 0.2s; box-shadow: 0 10px 25px rgba(108,99,255,0.35); }
        button:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(108,99,255,0.45); }
        button:disabled { background: #B0B0B0; box-shadow: none; transform: none; }

        /* Интерфейс чата */
        #chatScreen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, #FEE0B7 0%, #FDD299 33%, #EB8680 66%, #E67D76 100%); display: none; flex-direction: column; width: 100%; height: 100%; }
        #chatScreen.active { display: flex; }

        .refresh-btn {
            position: absolute; top: 15px; right: 15px; z-index: 10;
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.6); font-size: 22px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.1); color: #3A3A4A;
        }

        .messages { flex: 1 1 auto; overflow-y: auto; padding: 10px 20px; display: flex; flex-direction: column; gap: 14px; margin: 60px auto 0 auto; width: 100%; max-width: 800px; align-items: stretch; }
        .date-separator { display: flex; justify-content: center; align-items: center; margin: 10px 0; width: 100%; }
        .date-separator span { background: rgba(255,255,255,0.5); padding: 6px 18px; border-radius: 15px; font-size: 13px; color: #5A5A6A; border: 1px solid rgba(255,255,255,0.6); }

        .msg { max-width: 75%; display: flex; flex-direction: column; position: relative; }
        .msg.sent { align-self: flex-end; align-items: flex-end; }
        .msg.received { align-self: flex-start; align-items: flex-start; }

        .bubble {
            display: inline-block; padding: 14px 20px; border-radius: 22px; font-size: 17px; line-height: 1.5; word-wrap: break-word;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12); background: rgba(240,236,245,0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            color: #3A3A4A; border: 1px solid rgba(255,255,255,0.6);
        }
        .sent .bubble { border-bottom-right-radius: 8px; }
        .received .bubble { border-bottom-left-radius: 8px; }
        .name { font-size: 13px; font-weight: 600; margin-bottom: 4px; padding-left: 6px; color: #6A6A7A; }
        .msg-footer { display: flex; align-items: center; gap: 8px; margin-top: 4px; width: 100%; }
        .sent .msg-footer { flex-direction: row-reverse; }
        .time { font-size: 11px; color: #4A4A5A; padding: 3px 8px; border-radius: 12px; background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.6); }

        .loading-spinner { display: none; justify-content: center; align-items: center; flex-direction: column; gap: 12px; padding: 40px; color: #6C63FF; font-size: 16px; width: 100%; }
        .loading-spinner.active { display: flex; }
        .spinner-circle { width: 40px; height: 40px; border: 4px solid rgba(108,99,255,0.2); border-top: 4px solid #6C63FF; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .reactions-container { display: flex; flex-wrap: wrap; gap: 4px; }
        .reaction-badge { background: rgba(255,255,255,0.85); border-radius: 12px; padding: 2px 6px; font-size: 11px; border: 1px solid rgba(255,255,255,0.4); }

        .emoji-panel {
            display: none; position: absolute; bottom: 100%; background: white; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.15); padding: 6px; gap: 6px; z-index: 9999; margin-bottom: 8px;
        }
        .emoji-panel.open { display: flex; }
        .quick-emojis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
        .emoji-option { font-size: 18px; cursor: pointer; padding: 4px; }

        .input-area {
            background: rgba(255,255,255,0.8); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); padding: 14px 20px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); margin: 0 auto 10px auto; display: flex; gap: 12px; align-items: flex-end; border-radius: 35px; box-shadow: 0 -5px 25px rgba(0,0,0,0.05); border: 1px solid rgba(108,99,255,0.2); width: calc(100% - 20px); max-width: 800px;
        }
        .input-area textarea {
            flex: 1; margin: 0; border-radius: 25px; padding: 15px 22px; font-size: 17px; line-height: 1.4; border: 1px solid #D0D0E0; background: rgba(255,255,255,0.95); outline: none; resize: none; max-height: 200px; min-height: 52px; font-family: inherit;
        }
        .input-area button { width: 52px; height: 52px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #6C63FF, #8B82FF); border: none; flex-shrink: 0; color: white; box-shadow: 0 10px 20px rgba(108,99,255,0.3); }

        @media (max-width: 480px) {
            .messages { padding: 5px 10px; gap: 10px; margin-top: 50px; }
            .bubble { font-size: 15px; padding: 10px 14px; }
            .msg { max-width: 85%; }
        }
    </style>
</head>
<body>
    <div id="regScreen" class="screen active">
        <div class="box">
            
            <div class="logo-3d-wrapper">
                <svg viewBox="0 0 400 170" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <filter id="balloon3D" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur" />
                            <feOffset dx="1" dy="6" result="offsetBlur" />
                            <feSpecularLighting in="blur" surfaceScale="7" specularConstant="1.2" specularExponent="35" lighting-color="#fff" result="specOut">
                                <fePointLight x="-100" y="-150" z="220" />
                            </feSpecularLighting>
                            <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut" />
                            <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litOnOff" />
                            <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#d45953" flood-opacity="0.4"/>
                        </filter>

                        <linearGradient id="semejkaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFBBA4" />
                            <stop offset="40%" stop-color="#FF8A7A" />
                            <stop offset="100%" stop-color="#D9524B" />
                        </linearGradient>
                        <linearGradient id="plusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFA885" />
                            <stop offset="50%" stop-color="#FA6E64" />
                            <stop offset="100%" stop-color="#B52D27" />
                        </linearGradient>
                    </defs>

                    <g filter="url(#balloon3D)">
                        <text x="200" y="70" font-family="'Arial Rounded MT Bold', 'Comic Sans MS', sans-serif" font-weight="900" font-size="58" text-anchor="middle" letter-spacing="3" fill="url(#semejkaGrad)">SEMEJKA</text>
                        <text x="200" y="145" font-family="'Arial Rounded MT Bold', 'Comic Sans MS', sans-serif" font-weight="900" font-size="64" text-anchor="middle" letter-spacing="4" fill="url(#plusGrad)">PLUS</text>
                    </g>
                </svg>
            </div>
            <p>Семейный чат для самых близких</p>
            <input type="text" id="nameInput" placeholder="Ваше имя">
            <button id="joinBtn">Войти</button>
        </div>
    </div>

    <div id="chatScreen" class="screen">
        <button class="refresh-btn" id="refreshBtn">🔄</button>
        <div class="messages" id="messages">
            <div class="loading-spinner" id="loadingSpinner">
                <div class="spinner-circle"></div>
                <span>Загрузка сообщений...</span>
            </div>
        </div>
        <div class="input-area">
            <textarea id="msgInput" rows="1" placeholder="Сообщение..."></textarea>
            <button id="sendBtn">
                <svg width="20" height="20" viewBox="0 0 24 24"><path d="M2 21L23 12L2 3V10L17 12L2 14V21Z" fill="currentColor"/></svg>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Добавляем случайную строку к сессии, чтобы принудительно очистить старый кеш браузера на смартфоне
        const CACHE_BUST = Date.now();
        console.log("Лог оптимизации версии кода:", CACHE_BUST);

        let _sgClient;
        try {
            _sgClient = window.supabase.createClient(
                'https://sfsxflsbueyotiksqknp.supabase.co',
                'sb_publishable_32wqroL1fDtPIVwHbvZtIg_5Hipzmdj'
            );
        } catch(e) { console.error(e); }

        const regScreen = document.getElementById('regScreen');
        const chatScreen = document.getElementById('chatScreen');
        const nameInput = document.getElementById('nameInput');
        const joinBtn = document.getElementById('joinBtn');
        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');

        let currentUser = null, lastMessageId = null, lastDisplayedDate = null;
        let reactionsCache = {}, longPressTimer = null, realtimeChannel = null, backupSyncInterval = null;

        function autoResize() {
            msgInput.style.height = 'auto';
            msgInput.style.height = Math.min(msgInput.scrollHeight, 200) + 'px';
        }
        msgInput.addEventListener('input', autoResize);

        function logout() {
            localStorage.removeItem('semejka_user');
            if (backupSyncInterval) clearInterval(backupSyncInterval);
            if (_sgClient) _sgClient.removeAllChannels();
            currentUser = null; lastMessageId = null; lastDisplayedDate = null; reactionsCache = {};
            regScreen.classList.add('active'); chatScreen.classList.remove('active');
            nameInput.value = ''; msgInput.value = ''; msgInput.style.height = 'auto';
        }

        const EMOJI_LIST = ['👍', '❤️', '😊', '😢', '🎉', '🔥', '😡', '😂', '😮', '😎', '🤔', '🙏'];

        async function loadReactions(messageIds) {
            if (!messageIds.length || !_sgClient) return;
            try {
                const { data, error } = await _sgClient.from('reactions').select('*').in('message_id', messageIds);
                if (!error && data) {
                    data.forEach(r => {
                        if (!reactionsCache[r.message_id]) reactionsCache[r.message_id] = [];
                        if (!reactionsCache[r.message_id].some(ex => ex.id === r.id)) reactionsCache[r.message_id].push(r);
                    });
                    messageIds.forEach(id => updateReactionDisplay(id));
                }
            } catch (err) { transformToBackupMode(); }
        }

        function updateReactionDisplay(messageId) {
            const msgEl = document.getElementById('msg-' + messageId); if (!msgEl) return;
            let container = msgEl.querySelector('.reactions-container');
            if (!container) {
                const footer = msgEl.querySelector('.msg-footer'); if (!footer) return;
                container = document.createElement('div'); container.className = 'reactions-container';
                footer.appendChild(container);
            }
            const reactions = reactionsCache[messageId] || []; const counts = {};
            reactions.forEach(r => counts[r.emoji] = (counts[r.emoji] || 0) + 1);
            const userReaction = reactions.find(r => r.user_id === currentUser?.id);
            container.innerHTML = '';
            Object.entries(counts).forEach(([emoji, count]) => {
                const badge = document.createElement('span');
                badge.className = 'reaction-badge' + (userReaction && userReaction.emoji === emoji ? ' active' : '');
                badge.textContent = emoji + ' ' + count;
                badge.onclick = (e) => { e.stopPropagation(); toggleReaction(messageId, emoji); };
                container.appendChild(badge);
            });
        }

        async function toggleReaction(messageId, emoji) {
            if (!currentUser || !_sgClient) return;
            const reactions = reactionsCache[messageId] || [];
            const existing = reactions.find(r => r.user_id === currentUser.id);
            if (existing && existing.emoji === emoji) {
                reactionsCache[messageId] = reactions.filter(r => r.id !== existing.id);
            } else {
                if (existing) reactionsCache[messageId] = reactions.filter(r => r.id !== existing.id);
                reactionsCache[messageId] = [...(reactionsCache[messageId] || []), { id: 'temp-' + Date.now(), message_id: messageId, user_id: currentUser.id, emoji: emoji }];
            }
            updateReactionDisplay(messageId);
            try {
                if (existing) await _sgClient.from('reactions').delete().eq('id', existing.id);
                if (!existing || existing.emoji !== emoji) {
                    const { data } = await _sgClient.from('reactions').insert({ message_id: messageId, user_id: currentUser.id, emoji: emoji }).select().single();
                    if (data) {
                        reactionsCache[messageId] = (reactionsCache[messageId] || []).filter(r => r.id !== existing?.id && !r.id.toString().startsWith('temp-'));
                        reactionsCache[messageId].push(data);
                    }
                }
            } catch (err) {} finally { updateReactionDisplay(messageId); }
        }

        function showEmojiPanel(messageId) {
            const msgEl = document.getElementById('msg-' + messageId); if (!msgEl) return;
            document.querySelectorAll('.emoji-panel.open').forEach(p => p.classList.remove('open'));
            let panel = msgEl.querySelector('.emoji-panel');
            if (!panel) {
                panel = document.createElement('div'); panel.className = 'emoji-panel';
                const quickContainer = document.createElement('div'); quickContainer.className = 'quick-emojis';
                EMOJI_LIST.forEach(emoji => {
                    const span = document.createElement('span'); span.className = 'emoji-option'; span.textContent = emoji;
                    span.onclick = (e) => { e.stopPropagation(); toggleReaction(messageId, emoji); panel.classList.remove('open'); };
                    quickContainer.appendChild(span);
                });
                panel.appendChild(quickContainer); msgEl.appendChild(panel);
            }
            panel.classList.add('open');
        }

        document.addEventListener('click', (e) => { if (!e.target.closest('.emoji-panel') && !e.target.closest('.bubble')) document.querySelectorAll('.emoji-panel.open').forEach(p => p.classList.remove('open')); });

        function addLongPressListeners(msgElement, messageId) {
            const bubble = msgElement.querySelector('.bubble'); if (!bubble) return;
            const startPress = (e) => { if (!e.target.closest('a')) longPressTimer = setTimeout(() => showEmojiPanel(messageId), 300); };
            const cancelPress = () => clearTimeout(longPressTimer);
            bubble.addEventListener('mousedown', startPress); bubble.addEventListener('mouseup', cancelPress); bubble.addEventListener('mouseleave', cancelPress);
            bubble.addEventListener('touchstart', startPress, { passive: true }); bubble.addEventListener('touchend', cancelPress);
        }

        function linkify(text) { return text.replace(/(https?:\/\/[^\s<]+)/gi, (url) => `<a href="${url.replace(/"/g, '&quot;')}" target="_blank" rel="noopener noreferrer">${url}</a>`); }

        function renderMessage(msg, animate = false) {
            if (document.getElementById('msg-' + msg.id)) return;
            const msgDate = new Date(msg.created_at || Date.now()).toLocaleDateString('ru-RU');
            if (msgDate !== lastDisplayedDate) { insertDateSeparator(msg.created_at || new Date().toISOString()); lastDisplayedDate = msgDate; }

            const div = document.createElement('div'); div.id = 'msg-' + msg.id; div.className = 'msg ' + (msg.user_id === currentUser?.id ? 'sent' : 'received');
            let html = '';
            if (msg.user_id !== currentUser?.id) html += `<div class="name">${escapeHtml(msg.user_name || '')}</div>`;
            html += `<div class="msg-content"><div class="bubble">${linkify(escapeHtml(msg.text || ''))}</div></div>`;
            html += `<div class="msg-footer"><div class="time">${formatTime(msg.created_at || new Date().toISOString())}</div></div>`;
            div.innerHTML = html; messagesDiv.appendChild(div); messagesDiv.scrollTop = messagesDiv.scrollHeight;
            if (animate) { div.style.animation = 'fadeInUp 0.3s ease-out'; }
            addLongPressListeners(div, msg.id);
        }

        async function syncNewMessagesOnly() {
            if (!currentUser || !_sgClient) return;
            try {
                const { data, error } = await _sgClient.from('messages').select('id,user_id,user_name,text,created_at').order('created_at', { ascending: false }).limit(25);
                if (!error && data) {
                    data.reverse().forEach(msg => renderMessage(msg, true));
                    loadReactions(data.map(m => m.id));
                }
            } catch (e) {}
        }

        async function loadMessages() {
            if (!_sgClient) { transformToBackupMode(); return; }
            
            // Жёсткий аварийный предохранитель: если сеть висит дольше 3.5 секунд, чат разблокируется сам!
            const forceUnlockTimer = new Promise((_, reject) => setTimeout(() => reject(new Error('EmergencyUnlock')), 3500));
            
            try {
                const { data, error } = await Promise.race([
                    _sgClient.from('messages').select('id,user_id,user_name,text,created_at').order('created_at', { ascending: true }).limit(45),
                    forceUnlockTimer
                ]);
                if (!error && data) {
                    const children = Array.from(messagesDiv.children); children.forEach(c => { if (c !== loadingSpinner) c.remove(); });
                    data.forEach(msg => renderMessage(msg, false));
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }
            } catch (e) {
                console.warn("Активирован быстрый обход блокировки загрузки.");
                transformToBackupMode();
            } finally {
                loadingSpinner.classList.remove('active'); // Гарантированное скрытие бесконечного круга
            }
        }

        function transformToBackupMode() {
            const children = Array.from(messagesDiv.children);
            children.forEach(c => { if (c !== loadingSpinner) c.remove(); });
            loadingSpinner.classList.remove('active');
        }

        function subscribeMessages() {
            if (!_sgClient) return;
            try {
                if (realtimeChannel) _sgClient.removeChannel(realtimeChannel);
                realtimeChannel = _sgClient.channel('chat-room', { config: { broadcast: { self: false, ack: true } } });
                realtimeChannel.on('broadcast', { event: 'shout' }, p => currentUser && renderMessage(p.payload, true)).subscribe();
                if (backupSyncInterval) clearInterval(backupSyncInterval);
                backupSyncInterval = setInterval(syncNewMessagesOnly, 3500);
            } catch(e) {}
        }

        async function sendMessage(text) {
            const cleanText = text.trim(); if (!currentUser || !cleanText) return;
            if (cleanText === '@exit') { logout(); return; }

            sendBtn.disabled = true;
            const msgPayload = { id: 'brc-' + Date.now(), user_id: currentUser.id, user_name: currentUser.name, text: cleanText, created_at: new Date().toISOString() };
            renderMessage(msgPayload, true);
            msgInput.value = ''; msgInput.style.height = 'auto';

            if (realtimeChannel) realtimeChannel.send({ type: 'broadcast', event: 'shout', payload: msgPayload }).catch(() => {});
            try {
                if (_sgClient) await _sgClient.from('messages').insert({ user_id: currentUser.id, user_name: currentUser.name, text: cleanText });
            } catch (err) {} finally { sendBtn.disabled = false; msgInput.focus(); }
        }

        refreshBtn.addEventListener('click', async () => { loadingSpinner.classList.add('active'); await loadMessages(); });
        msgInput.addEventListener('keypress', async (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); await sendMessage(msgInput.value); } });
        sendBtn.addEventListener('click', async () => await sendMessage(msgInput.value));

        const savedUser = localStorage.getItem('semejka_user');
        if (savedUser) { try { nameInput.value = JSON.parse(savedUser).name || ''; } catch(e) {} }

        joinBtn.addEventListener('click', async () => {
            const name = nameInput.value.trim(); if (!name) return;
            joinBtn.disabled = true; joinBtn.textContent = 'Вход...';

            try {
                if (!_sgClient) throw new Error('Offline');
                const { data: users, error } = await _sgClient.from('users').select('*').eq('name', name).limit(1);
                let user = (!error && users && users[0]) ? users[0] : null;
                if (!user) {
                    const { data: newUser } = await _sgClient.from('users').insert({ name, email: null }).select().single();
                    user = newUser || { id: 'usr-' + Date.now(), name: name };
                }
                currentUser = user;
            } catch (err) {
                currentUser = { id: 'usr-' + Date.now(), name: name };
            } finally {
                localStorage.setItem('semejka_user', JSON.stringify(currentUser));
                regScreen.classList.remove('active'); chatScreen.classList.add('active');
                loadingSpinner.classList.add('active');
                await loadMessages(); subscribeMessages();
                joinBtn.disabled = false; joinBtn.textContent = 'Войти';
            }
        });

        function formatDateSeparator(dateStr) {
            const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
            const d = new Date(dateStr); return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()} г.`;
        }
        function insertDateSeparator(dateString) {
            const sep = document.createElement('div'); sep.className = 'date-separator';
            sep.innerHTML = `<span>${formatDateSeparator(dateString)}</span>`; messagesDiv.appendChild(sep);
        }
        function formatTime(ts) { const d = new Date(ts); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
        function escapeHtml(text) { const el = document.createElement('div'); el.textContent = text; return el.innerHTML; }
    </script>
</body>
</html>
